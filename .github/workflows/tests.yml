name: tests

concurrency:
  # Новый пуш гасит прогон предыдущего: пачки пушей не копят очередь из десятков прогонов.
  group: tests-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  commit-trailers:
    # Облачные сессии Claude Code дописывают «Claude-Session: https://claude.ai/code/…» в сообщение
    # коммита; репозиторий публичный — новые коммиты с такой строкой не пропускаем. Локально её
    # вырезает .githooks/commit-msg (git config core.hooksPath .githooks). Старые — отдельной чисткой.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No Claude-Session trailers in new commits
        env:
          BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            range="$BASE_SHA..HEAD"
          elif [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -qE '^0+$' && git cat-file -e "$BEFORE" 2>/dev/null; then
            range="$BEFORE..HEAD"
          else
            range="HEAD~1..HEAD"
          fi
          bad=$(git log --format='%h %s' --grep='^Claude-Session:' "$range")
          if [ -n "$bad" ]; then
            echo "::error::Коммиты со ссылкой на сессию Claude Code (строка Claude-Session:) — уберите её из сообщения:"
            echo "$bad"
            exit 1
          fi
          echo "ok: $range"

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]  # 3.11 = образ в Dockerfile (python:3.11-slim)
    env:
      # config.Settings требует эти два поля при импорте; значения фиктивные, сеть не трогается
      BOT_TOKEN: "123456:dummy-test-token"
      ADMIN_IDS: "[1]"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        # -n auto: 9 тыс. тестов в один поток дольше 45 мин — прогон убивался по таймауту
        # и висел «cancelled» с 22.09. На 4 ядрах раннера ~15–20 мин.
        run: python -m pytest tests -q -n auto
