services:
  bot:
    build: .
    restart: always
    env_file:
      - .env
    dns:
      - 8.8.8.8
      - 8.8.4.4
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./google_credentials.json:/app/google_credentials.json:ro
      - ./resources:/app/resources:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Дашборд статистики (Phase 15, D-04): sidecar того же стека, читает ту же БД только
  # на чтение. Портов наружу нет — снаружи до него дотягивается только cloudflared
  # (стек tunnel/) по имени сервиса внутри общей внешней сети `edge`:
  #   CF Zero Trust public hostname  yl26.<домен>  →  http://yl26-dashboard:8000
  # Имя сервиса намеренно НЕ `dashboard`: на сервере уже есть чужой проект с таким именем,
  # а в общей сети `edge` короткое имя занял бы первый поднятый стек. Схема —
  # `<меро><год>-dashboard`, как и у поддоменов (D-02). Сервис `bot` в `edge` не входит.
  yl26-dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: youlead26-dashboard
    restart: always
    env_file:
      - .env
    volumes:
      # НЕ `:ro`: WAL-БД (Phase 17) требует у читателя права создать/открыть `-shm` в каталоге,
      # на read-only томе `mode=ro`-подключение падало «unable to open database file» (500
      # после входа, 31.08). Только-чтение гарантирует само подключение — `dashboard/db.py`.
      - ./data:/app/data
    networks:
      - default
      - edge
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Mini App делегата/менеджера (Phase 19, WEBAPP-01): sidecar того же образа, что и `bot`
  # (корневой Dockerfile, не dashboard/Dockerfile) — процесс отдельный, код и БД общие. Том
  # `./data` смонтирован БЕЗ `:ro`: это второй писатель в ту же SQLite (Pitfall 8) — сдача
  # заданий и правки менеджера пишут напрямую, не через бота. У `yl26-dashboard` том остаётся
  # `:ro` (D-04) — второй писатель туда не добавляется. Имя сервиса `miniapp`, а не `dashboard`
  # или `app`: короткое, не конфликтует с чужим `dashboard` на сервере, путь наружу —
  # `/app*` (docs/DEPLOY-DOMAIN.md). Healthcheck образа бота проверяет heartbeat long polling'а
  # и здесь всегда был бы unhealthy — переопределён на собственный `/app/health`. `TZ` сервису
  # не задаётся: время должно совпадать с ботом (T-19-64), а не с локалью хоста запуска.
  miniapp:
    build: .
    container_name: youlead26-miniapp
    command: ["uvicorn", "miniapp.main:app", "--host", "0.0.0.0", "--port", "8001"]
    restart: always
    env_file:
      - .env
    dns:
      - 8.8.8.8
      - 8.8.4.4
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - default
      - edge
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/app/health', timeout=3).status == 200 else 1)"]
      interval: 60s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Phase 27 (27-03, LANG-10): HTTP-фоллбэк драйвера перевода делегатской анкеты
  # (services/i18n_engine.py::HttpLibreTranslateDriver) — ВЫКЛЮЧЕН по умолчанию (owner-decision
  # 27-01, чекпоинт: драйвер = embedded с выгрузкой, не сайдкар — на хосте физически свободно
  # 237 МБ на ~26 контейнеров, постоянные 400-700 МБ сайдкара туда не влезают). `docker compose
  # up` без явного профиля поднимает стек ровно как сегодня — этот сервис не запускается.
  # Поднять вручную: `docker compose --profile i18n up -d libretranslate`, затем переключить
  # реестровую настройку `delegate_lang_driver` на "http" (код готов, автопереключения нет).
  # `LT_LOAD_ONLY=en,ru` обязателен — без него грузятся 30+ языков (8 ГБ+ RAM, ~10 ГБ диска).
  # Сеть — `edge` (один сайдкар на сервер для всех стеков мероприятий, D-02 доменной схемы);
  # ВАЖНО: сервис `bot` этого стека сам в `edge` не входит (см. комментарий у `yl26-dashboard`
  # выше) — чтобы КОНКРЕТНО этот бот достучался до сайдкара по имени `libretranslate`, `bot`
  # тоже пришлось бы добавить в сеть `edge` (не сделано: owner выбрал embedded, это
  # задокументированный задел на будущее, не рабочая связка «из коробки»).
  libretranslate:
    image: libretranslate/libretranslate:v1.9.6
    profiles: ["i18n"]
    restart: unless-stopped
    environment:
      - LT_LOAD_ONLY=en,ru
    volumes:
      - ./data/libretranslate:/home/libretranslate/.local
    networks:
      - edge
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # Создаётся один раз на сервер руками (подсеть фиксирована — на неё настроен
  # DASHBOARD_TRUSTED_PROXIES):  docker network create --subnet 172.31.0.0/16 edge
  edge:
    external: true
    name: edge
