# Доска приёмки (10.09.2026): порт на loopback, наружу через tunnel-relay (-R 8005) →
# is-hosting (/etc/hosts: uat-board) → Cloudflare uat.alekseev.info. Код доступа — в .env
# рядом (UAT_CODE=...), ссылка для тестировщиков: https://uat.alekseev.info/?k=<код>.
services:
  board:
    build: .
    container_name: uat-board
    restart: always
    ports:
      - "127.0.0.1:8005:8005"
    env_file:
      - .env
    volumes:
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
