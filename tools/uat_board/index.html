<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Приёмка Юлид '26 · долг и новое</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Raleway:ital,wght@1,800&display=swap">
<style>
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --sunken:#EAEEF5;
  --ink:#151A21; --muted:#56606E; --faint:#8A93A1;
  --line:#DCE2EB; --line-soft:#E8ECF3;
  --accent:#037EF3; --accent-ink:#0163C0; --accent-soft:#E3F0FE;
  --warm:#F48924; --warm-soft:#FDEBD9;
  --ok:#12855A; --ok-soft:#E1F3EA; --bad:#CF3A24; --bad-soft:#FBE7E3; --skip:#8A6A00; --skip-soft:#FFF3CC;
  --role-m:#0163C0; --role-m-soft:#E3F0FE; --role-d:#B85C00; --role-d-soft:#FDEBD9; --role-v:#5B3FB8; --role-v-soft:#ECE6FA;
  --shadow:0 1px 2px rgba(21,26,33,.06);
  --font-h:"Raleway","Segoe UI",system-ui,sans-serif;
  --font-b:"Lato","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161C; --surface:#1A1F27; --sunken:#151A21;
  --ink:#E9EDF3; --muted:#A3ADBB; --faint:#7C8695;
  --line:#2A323D; --line-soft:#232A34;
  --accent:#4FA6F7; --accent-ink:#8CC5FA; --accent-soft:#16283C;
  --warm:#F9A44C; --warm-soft:#3A2812;
  --ok:#4FBF8E; --ok-soft:#142A22; --bad:#F0705A; --bad-soft:#2E1A17; --skip:#F0C24B; --skip-soft:#3A3114;
  --role-m:#8CC5FA; --role-m-soft:#16283C; --role-d:#F9A44C; --role-d-soft:#3A2812; --role-v:#B9A6F0; --role-v-soft:#261D3F;
  --shadow:0 1px 2px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --bg:#12161C; --surface:#1A1F27; --sunken:#151A21;
  --ink:#E9EDF3; --muted:#A3ADBB; --faint:#7C8695;
  --line:#2A323D; --line-soft:#232A34;
  --accent:#4FA6F7; --accent-ink:#8CC5FA; --accent-soft:#16283C;
  --warm:#F9A44C; --warm-soft:#3A2812;
  --ok:#4FBF8E; --ok-soft:#142A22; --bad:#F0705A; --bad-soft:#2E1A17; --skip:#F0C24B; --skip-soft:#3A3114;
  --role-m:#8CC5FA; --role-m-soft:#16283C; --role-d:#F9A44C; --role-d-soft:#3A2812; --role-v:#B9A6F0; --role-v-soft:#261D3F;
  --shadow:0 1px 2px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.5;
     -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;padding:0 0 96px;overflow-wrap:anywhere}
.wrap{max-width:52rem;margin:0 auto;padding:0 16px}
a{color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font-family:inherit}
[hidden]{display:none!important}

/* шапка */
header.top{padding:16px 0 0}
.plate{position:relative;overflow:hidden;background:var(--accent) url("/pattern.webp") -162px -324px / 1368px auto no-repeat;color:#fff;border-radius:18px;padding:22px 18px 18px}
.plate .eyebrow{color:#FFE1C2}
.eyebrow{font:700 11px/1 var(--font-b);letter-spacing:.14em;text-transform:uppercase;color:var(--warm)}
h1{font:italic 800 clamp(26px,7vw,40px)/1.04 var(--font-h);letter-spacing:-.02em;margin:10px 0 8px;text-wrap:balance;color:#fff}
.plate .lede{color:rgba(255,255,255,.9);margin:0;max-width:44rem}
.plate .meta{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:12px;font-size:14px;color:rgba(255,255,255,.85)}
.plate .meta b{color:#fff;font-weight:700}
.back{display:inline-block;margin:14px 0 0;font:700 13px/1 var(--font-b);color:var(--accent-ink);text-decoration:none}
.back:hover{text-decoration:underline}
.warn{display:flex;gap:12px;align-items:flex-start;margin:14px 0 0;padding:12px 14px;
      background:var(--bad-soft);border-left:3px solid var(--bad);border-radius:0 6px 6px 0}
.warn p{margin:0;font-size:14px}
.warn b{color:var(--bad)}
.tip{margin:12px 0 0;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.tip h2,.info summary h2{font:italic 800 15px/1.2 var(--font-h);margin:0 0 6px;color:var(--ink)}
.tip p{margin:0;font-size:14px;color:var(--muted)}
.tip.people p{margin-top:10px;color:var(--ink)}.tip.people p:first-of-type{margin-top:0}
.tip.people ul{margin:4px 0 0;padding-left:20px;font-size:14px;color:var(--muted)}.tip.people li{margin:3px 0}
.tip p + p{margin-top:6px}
.tip b{color:var(--ink)}
code,.tip code{font:700 13.5px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink);background:var(--sunken);border-radius:5px;padding:1px 5px}
.tip ul{margin:6px 0 0;padding-left:20px;font-size:14px;color:var(--muted)}
.tip li + li{margin-top:4px}

/* карточки сессий */
.cards{display:grid;gap:12px;margin-top:16px}
.card{display:block;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.card:hover{border-color:var(--accent)}
.card .ey{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.card .ey .eyebrow{color:var(--accent)}
.card .ey .when{font-size:13px;color:var(--faint);font-variant-numeric:tabular-nums}
.card h2{font:italic 800 20px/1.15 var(--font-h);margin:6px 0 4px;letter-spacing:-.01em;text-wrap:balance}
.card p{margin:0;color:var(--muted);font-size:14px}
.card .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip-s{font-size:12px;font-weight:700;color:var(--muted);background:var(--sunken);border-radius:6px;padding:3px 8px}
.card .prog{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.card .prog .t{flex:1}
.card.bl{border-style:dashed}
.card.done{border-color:var(--ok)}
.track{display:flex;height:6px;background:var(--sunken);border-radius:99px;overflow:hidden}
.track i{display:block;height:100%;width:0;transition:width .25s ease}
.track .t-ok{background:var(--ok)}.track .t-bad{background:var(--bad)}.track .t-skip{background:var(--skip)}

/* полоса прогресса сессии + фильтры */
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 6px;border-bottom:1px solid var(--line)}
.bar .pt{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;margin-bottom:6px}
.bar .pt b{color:var(--ink)}
.bar .pt .e{color:var(--bad)}
.sync{font-size:12px;color:var(--faint);margin-top:6px}
.sync.ok{color:var(--ok)}
.sync.bad{color:var(--bad)}
.under{padding-top:8px}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:30px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:99px;
      font:700 12.5px/1 var(--font-b);padding:7px 11px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.chip.r-M[aria-pressed="true"]{background:var(--role-m-soft);border-color:var(--role-m);color:var(--role-m)}
.chip.r-D[aria-pressed="true"]{background:var(--role-d-soft);border-color:var(--role-d);color:var(--role-d)}
.chip.r-V[aria-pressed="true"]{background:var(--role-v-soft);border-color:var(--role-v);color:var(--role-v)}
.filters .sep{flex-basis:100%;height:0}

/* блоки */
.info{margin:14px 0 0;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.info summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;align-items:center;gap:10px}
.info summary::-webkit-details-marker{display:none}
.info summary .ic{font-size:18px;line-height:1}
.info summary h2{margin:0;flex:1}
.info summary .tm{font-size:12.5px;color:var(--faint);white-space:nowrap}
.info summary::after{content:"▸";color:var(--faint);font-size:14px;transition:transform .15s}
.info[open] summary::after{transform:rotate(90deg)}
.info .ib{padding:0 14px 12px;font-size:14px;color:var(--muted)}
.info .ib p{margin:0 0 8px}
.info .ib b{color:var(--ink)}
.info.stuck{border-color:var(--warm)}
.info.stuck summary .ic{color:var(--warm)}
.roles{display:grid;gap:8px;margin:4px 0 10px}
.role{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:start;padding:10px 12px;background:var(--sunken);border-radius:10px}
.role p{margin:0;font-size:13.5px;color:var(--muted)}
.role p b{color:var(--ink)}
.who{display:inline-block;font:700 11px/1 var(--font-b);letter-spacing:.04em;text-transform:uppercase;border-radius:6px;padding:4px 7px;white-space:nowrap}
.who.M{color:var(--role-m);background:var(--role-m-soft)}
.who.D{color:var(--role-d);background:var(--role-d-soft)}
.who.V{color:var(--role-v);background:var(--role-v-soft)}
.who.A{color:var(--muted);background:var(--sunken)}

/* чек-лист «Перед началом» */
ol.pre{list-style:none;margin:0;padding:0}
ol.pre li{display:grid;grid-template-columns:auto auto 1fr;gap:6px 10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line-soft)}
ol.pre li:last-child{border-bottom:0}
.box{width:24px;height:24px;border:1.5px solid var(--line);border-radius:7px;cursor:pointer;display:grid;place-items:center;
     font:700 13px/1 var(--font-b);color:transparent;margin-top:1px;background:var(--surface)}
ol.pre li[data-s="ok"] .box{background:var(--ok);border-color:var(--ok);color:#fff}
ol.pre li[data-s="ok"] .do{color:var(--muted)}
ol.pre .txt p{margin:0}
ol.pre .do{font-weight:700;color:var(--ink);font-size:14px}
ol.pre .exp{color:var(--muted);font-size:13.5px;margin-top:2px}

/* разделы и шаги */
section.block{margin-top:28px}
.bh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding-bottom:8px;border-bottom:2px solid var(--ink)}
.bn{font:italic 800 13px/1 var(--font-h);letter-spacing:.06em;color:var(--accent);font-variant-numeric:tabular-nums}
.bh h2{font:italic 800 20px/1.15 var(--font-h);letter-spacing:-.01em;margin:0;flex:1 1 auto;text-wrap:balance}
.bt{font-size:13px;color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap}
.cnt{font:700 12px/1 var(--font-b);color:var(--muted);background:var(--sunken);border-radius:6px;padding:5px 8px;font-variant-numeric:tabular-nums}
.cnt.all{color:var(--ok);background:var(--ok-soft)}
.cnt.has-bad{color:var(--bad);background:var(--bad-soft)}
.bmeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;font-size:12.5px}
.bmeta span{color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:3px 8px}
.bmeta span.opt{color:var(--skip);border-color:var(--skip);background:var(--skip-soft)}
.bnote{color:var(--muted);font-size:14px;margin:10px 0 0}
.bnote b{color:var(--ink)}
.soon{margin-top:10px;padding:14px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);font-size:14px;background:var(--surface)}

ol.steps{list-style:none;margin:6px 0 0;padding:0}
li.step{padding:14px 0;border-bottom:1px solid var(--line-soft)}
li.step:last-child{border-bottom:0}
.sh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px}
.id{font:700 12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--faint);font-variant-numeric:tabular-nums}
.pair{font-size:11.5px;font-weight:700;color:var(--warm);background:var(--warm-soft);border-radius:6px;padding:3px 7px}
.txt p{margin:0}
.txt .do{font-weight:700}
.txt .exp{color:var(--muted);font-size:14px;margin-top:4px}
.txt .exp::before{content:"Должно быть: ";color:var(--faint);font-weight:700}
li.step[data-s="ok"] .txt .do{color:var(--muted)}
q.ui{quotes:none;display:inline;background:var(--sunken);border-radius:5px;padding:1px 5px;font-weight:700;color:var(--ink);font-size:.95em}
.exp q.ui{font-weight:700;color:var(--ink)}
.ar{color:var(--faint)}
.ctl{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.mk{min-height:40px;border:1px solid var(--line);background:var(--surface);border-radius:9px;cursor:pointer;
    font:700 13px/1 var(--font-b);color:var(--muted);padding:0 11px;display:inline-flex;align-items:center;gap:5px}
.mk:hover{border-color:var(--accent)}
.mk.nb{width:40px;justify-content:center;padding:0;font-size:16px}
.mk.nb.has{border-color:var(--accent);background:var(--accent-soft)}
li.step[data-s="ok"] .mk.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
li.step[data-s="bad"] .mk.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
li.step[data-s="skip"] .mk.skip{background:var(--skip-soft);border-color:var(--skip);color:var(--skip)}
.note{width:100%;margin-top:8px;font:400 14px/1.45 var(--font-b);color:var(--ink);background:var(--sunken);
      border:1px solid var(--line);border-radius:8px;padding:9px 10px;resize:vertical;min-height:62px}
.note::placeholder{color:var(--faint)}
.by{font-size:12px;color:var(--faint);margin-top:5px;font-variant-numeric:tabular-nums}
.empty{margin:20px 0;padding:14px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);text-align:center}

footer.end{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);color:var(--faint);font-size:13px}

/* низ: имя + отчёт */
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
      padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:6;box-shadow:0 -4px 14px rgba(0,0,0,.06)}
.dock .row{max-width:52rem;margin:0 auto;display:flex;gap:8px;align-items:center}
.whoin{flex:1 1 120px;min-width:0;font:400 14px/1 var(--font-b);color:var(--ink);background:var(--bg);
     border:1px solid var(--line);border-radius:9px;padding:12px 10px}
.btn{font:700 14px/1 var(--font-b);color:#fff;background:var(--accent);border:1px solid var(--accent);
     border-radius:9px;padding:13px 14px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--accent-ink)}
.report{position:fixed;left:0;right:0;bottom:66px;max-height:62vh;background:var(--surface);border-top:1px solid var(--line);
        box-shadow:0 -6px 18px rgba(0,0,0,.1);z-index:5;padding:12px 16px}
.report .in{max-width:52rem;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.report .hd{display:flex;justify-content:space-between;align-items:center}
.report h2{font:italic 800 15px/1 var(--font-h);margin:0}
.report .x{min-height:32px;min-width:32px;border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:8px;cursor:pointer}
.report p{font-size:12.5px;color:var(--faint);margin:0}
.report p b{color:var(--ok)}
#reportText{width:100%;min-height:160px;max-height:40vh;border:1px solid var(--line);border-radius:10px;background:var(--bg);
        color:var(--ink);font:12px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace;padding:10px;resize:vertical}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--bg);
       font-size:13px;padding:9px 14px;border-radius:9px;opacity:0;pointer-events:none;transition:all .2s;z-index:7;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%)}

@media (max-width:520px){
  .mk{padding:0 9px;font-size:12.5px}
  .plate{padding:18px 14px 14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* два блока верхнего уровня и раскрывающиеся разделы */
section.blk{margin-top:30px}
.blkh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;background:var(--accent-soft);border-left:4px solid var(--accent);border-radius:0 12px 12px 0}
.blkh .bi{font-size:22px;line-height:1}
.blkh h2{font:italic 800 24px/1.1 var(--font-h);letter-spacing:-.01em;margin:0;flex:1 1 auto;color:var(--ink)}
.blkl{color:var(--muted);font-size:14px;margin:10px 0 0}
details.sec{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
details.sec>summary{list-style:none;cursor:pointer;display:block;padding:12px 14px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec .bh{border-bottom:0;padding-bottom:0;flex-wrap:wrap}
details.sec .bh h2{font-size:17px;flex:1 1 12rem}
details.sec .chev{color:var(--faint);font-size:14px;transition:transform .15s}
details.sec[open] .chev{transform:rotate(90deg)}
details.sec[open]>summary{border-bottom:1px solid var(--line-soft)}
details.sec>.bnote{padding:0 14px}
details.sec>ol.steps{padding:0 14px;margin:0}
.stag{display:inline-block;font:700 11.5px/1 var(--font-b);color:var(--accent-ink);background:var(--accent-soft);border:1px solid transparent;border-radius:6px;padding:4px 7px;white-space:nowrap}
.bmeta .stag{color:var(--accent-ink);background:var(--accent-soft);border-color:transparent;padding:4px 7px}
.stag.s-bl{color:var(--muted);background:var(--sunken)}
.bmeta .stag.s-bl{color:var(--muted);background:var(--sunken)}
li.subh{padding:14px 0 4px;border-bottom:0;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:14px}
li.subh b{font:italic 800 15px/1.2 var(--font-h)}
li.subh .sm{flex-basis:100%;font-size:12.5px;color:var(--faint)}
li.subh + li.step{padding-top:8px}
.sessinfo{margin-top:12px}
.sessinfo .tip{margin-top:0}
.cards{grid-template-columns:1fr}
@media (min-width:700px){.cards{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="wrap" id="root"></div>

<div class="report" id="report" hidden>
  <div class="in">
    <div class="hd"><h2>Отчёт для копирования</h2><button class="x" id="reportClose" type="button" aria-label="Закрыть">✕</button></div>
    <p id="reportHint">Текст выделен. Зажми и «Копировать», потом вставь в чат.</p>
    <textarea id="reportText" readonly></textarea>
  </div>
</div>

<div class="dock">
  <div class="row">
    <input type="text" class="whoin" id="who" placeholder="Кто проверяет (имя)" autocomplete="name" maxlength="60">
    <button class="btn" id="copy" type="button">Отчёт</button>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ───────── данные ─────────
   Ключ отметки: <сессия>.<раздел>.<шаг>, например s1.scan.4. Ключи стабильные: новые шаги
   добавлять в конец раздела с новым номером, старые номера не переиспользовать. */
const ROLES = {
  M: { name: "Менеджер", hint: "аккаунт с полной админкой тестового бота: в /admin восемь разделов. Её выдаёт только Андрей, через /uat её не получить. На этом аккаунте /uat не запускайте: он заменит роли аккаунта на выбранную в списке и снимет админку." },
  D: { name: "Делегат", hint: "второй аккаунт: второй человек или ваш второй аккаунт (другой телефон, Телеграм на компьютере). Состояние ставит себе командой /uat." },
  V: { name: "Волонтёр", hint: "третий аккаунт со сканером. Если третьего человека нет, его шаги делает менеджер: у менеджера сканер тоже есть, только сначала просит выбрать город." },
  A: { name: "Все", hint: "" },
};
/* Кто сейчас что проверяет — правится руками при смене состава. */
const PEOPLE = [

    {id:"9", who:"M", do:"Накануне сессии: создайте вторую Google Форму, «Делегации вузов». Девять вопросов «Короткий ответ» строго в таком порядке и с такими названиями, буква в букву: «ФИО», «Возраст», «Ваша почта», «Название университета», «Направление обучения», «Бакалавриат или магистратура, номер курса», «Ник в телеграмме (через @)», «Ник в ВКонтакте (через @)», «Согласен(-на) на обработку персональных данных». Курс — именно короткий ответ, не список: в разделе делегаций туда пишут и «Магистратура, 1 курс», и «учусь заочно». Включите сбор ответов в таблицу, как у первой формы. Вкладку «UR REGS» в таблице стенда создавать не нужно: она уже есть, с шапкой как у выгрузки Насти.", exp:"Форма открывается по ссылке, таблица ответов существует. В таблице стенда есть вкладка «UR REGS»: A «ID», B «Время начала заполнения формы», C «Время создания», D–L — те же девять вопросов, M пустая, в P1 «всего (ЦА):». Если название вопроса в форме отличается от шапки хоть одной буквой, на шаге 5 раздела «Делегации вузов» бот покажет, что шапка не совпадает."},
    {id:"10", who:"M", do:"Накануне сессии: в обычном (личном) аккаунте Яндекса создайте Яндекс Форму с тремя вопросами «Ник в Telegram», «Вуз», «Курс». Заполните её один раз сами, со своим @юзернеймом. Потом «Ответы» → выгрузите ответы файлом XLSX и сохраните файл.", exp:"Ссылка на форму вида forms.yandex.ru/u/… и файл выгрузки с одним ответом. Нужно для шагов 9–13 раздела «Внешние формы»."},
  ]},

    {id:"5", who:"D", do:"Не отвечая, отправьте /start. Нажмите «🔄 Начать заново», потом «Нет, продолжить», потом «▶️ Продолжить с шага …».", exp:"На /start: «У тебя есть незаконченная анкета — что дальше?» с кнопками «▶️ Продолжить с шага N из M» и «🔄 Начать заново». На «Начать заново»: «Пропадут уже введённые ответы (N). Начать анкету заново?» с «Да, начать заново» / «Нет, продолжить». После «Продолжить» анкета на том же вопросе, ответы целы."},
    {id:"6", who:"D", do:"Дойдите до вопроса «Резюме». Напишите текст вместо кнопки, потом «📎 Загрузить файл» и пришлите файл .txt, потом пришлите PDF.", exp:"Три кнопки: «📎 Загрузить файл», «🔗 Дать ссылку», «🙅 У меня нет резюме». На текст: «Выбери способ кнопкой выше ⬆️». На .txt: «Принимаются только PDF или DOCX. Прикрепи файл ещё раз.». PDF принят. Если вместо трёх кнопок сразу просьба прикрепить файл, просто пришлите PDF и напишите об этом в заметке."},

    {id:"1", who:"D", do:"Дойдите до конца анкеты и посмотрите на сводку.", exp:"«Проверь свои ответы:» со всеми ответами строками «Вопрос: ответ», внизу две кнопки: «Всё верно» и «Изменить»."},
    {id:"2", who:"D", do:"Нажмите «Изменить». На первом вопросе напишите текст вместо кнопки, потом на каждом вопросе жмите «✅ Оставить».", exp:"Анкета НЕ начинается с нуля: каждый вопрос приходит как «Прошлый ответ: …» и «Оставить или изменить?» с кнопками «✅ Оставить» и «✏️ Изменить». На текст: «Нажми «✅ Оставить» или «✏️ Изменить».». После всех «Оставить» снова сводка с теми же ответами."},
    {id:"3", who:"D", do:"Нажмите «Всё верно».", exp:"«Поздравляем, твоя заявка принята!…» (или текст, который написал менеджер) и главное меню. Вторым сообщением «Приводи друзей в АЙСЕК» с кнопками «Хочу свою ссылку» и «Позже»."},
    {id:"4", who:"D", do:"Нажмите «Хочу свою ссылку».", exp:"Приходит ссылка вида https://t.me/…?start=amb_ЧИСЛО. Сохраните её: пригодится в разделе «Меню делегата, вопрос, FAQ, язык»."},
    {id:"5", who:"D", do:"Напишите боту любой текст. Потом нажмите «❓ Задать вопрос».", exp:"На текст: «✅ Анкета уже отправлена — мы её получили. Ответ придёт сюда, в чат.». На кнопку: «⏳ Твоя заявка на рассмотрении. Доступ откроется после одобрения.» Пока заявку не рассмотрели, спросить менеджера нельзя: так задумано."},

    {id:"2", who:"M", do:"«📋 Заявки» → «📋 Заявки».", exp:"Карточка «📋 Заявка 1/N · 🏙 Город», «👤 Имя (@ник)», ответы анкеты, строка «📎 Резюме: файлом (кнопка ниже)». Кнопки: «✅ Одобрить», «❌ Отклонить», «📎 Резюме», «🕓 История», «⏭ Пропустить», «✅ Одобрить все (N)»."},

    {id:"4", who:"D", do:"Посмотрите чат, потом нажмите любую кнопку меню.", exp:"«К сожалению, твоя заявка отклонена.», пустая строка, «тест отказа». На кнопку меню бот повторяет отказ понятными словами."},
    {id:"5", who:"D", do:"/uat → «📨 Заявка отправлена — ждёт проверки» → «Делегат — без ролей» → «✅ Сбросить и засеять» → /start. Скажите менеджеру, что заявка снова в очереди.", exp:"«Отправьте /start.», после /start «С возвращением! Ты уже зарегистрирован(а)…»."},
    {id:"6", who:"M", do:"«📋 Заявки» → «📋 Заявки» → «✅ Одобрить».", exp:"Всплывает «Одобрено», открывается следующая карточка или «✅ Заявок нет.»"},

  { key:"menu", title:"Меню одобренного, вопрос, FAQ, язык", time:"7 мин", need:"делегат + менеджер (ответ на вопрос)", steps:[
    {id:"1", who:"D", do:"Нажмите по очереди «ℹ️ Информация о форуме», «📅 Программа форума», «🗣 Спикеры», «📞 Контакты».", exp:"Информация со строками 🗓 / ⌚ / 📍 и кнопками «Дата и время», «Место проведения». Программа и спикеры: картинка или таблица либо «Программа форума ещё не загружена.» / «Список спикеров формируется и скоро появится здесь.». Контакты: текст с кнопками либо «Контакты пока не указаны. Обратитесь к организаторам.». Ни одна кнопка не молчит. Если какой-то кнопки в меню нет, напишите в заметке."},
    {id:"2", who:"D", do:"Нажмите «❓ Задать вопрос», потом на вопрос из списка, потом «← К вопросам».", exp:"Сначала не форма, а список: «Собрали ответы на частые вопросы — может, твой уже здесь:», кнопка с вопросом менеджера и внизу «Не нашёл ответ — спросить менеджера». Тап по вопросу открывает «❓ вопрос», ответ и кнопку «← К вопросам»."},

    {id:"4", who:"M", do:"В личке найдите «❓ Новый вопрос от …» и ответьте на него реплаем: «Сбор в 9:00 у главного входа».", exp:"В карточке «🧾 Вопрос #N» и подсказка «↩️ Ответьте reply'ем на это сообщение, чтобы отправить ответ.». Ответ ушёл без ошибки."},
    {id:"5", who:"D", do:"Дождитесь ответа.", exp:"«💬 Ответ от организаторов:» и текст «Сбор в 9:00 у главного входа»."},

    {id:"2", who:"D", do:"Откройте «Анкета» (если не открылась сама), ответьте на первый вопрос.", exp:"Наверху «Шаг 1 из M». После ответа у полосы прогресса пометка «Черновик сохранён»."},
    {id:"3", who:"D", do:"На возрасте впишите 5 и нажмите «Дальше». Потом 17.", exp:"Под вопросом подсказка «Число от 10 до 120, например «19».». С 5 мастер стоит и показывает «Укажи корректный возраст числом от 10 до 120.». С 17 уходит дальше."},
    {id:"4", who:"D", do:"На вопросе про город напечатайте «зззз», потом сотрите и напечатайте начало настоящего города, нажмите подсказку.", exp:"Под полем «Начни вводить — подскажем. Например: «спб», «вшэ», «политех».». На «зззз»: «Ничего не нашли по запросу «зззз»». Один тап по подсказке переводит на следующий вопрос."},
    {id:"5", who:"D", do:"На карточке «Образование» выключите тумблер наверху, выберите плитку, нажмите «Дальше». Вернитесь «Назад», включите тумблер обратно.", exp:"Тумблер «Сейчас учусь здесь» первый элемент карточки. После выключения две плитки: «Нет, завершил(а) обучение» и «Нет, не получал(а) образование»; пока ни одна не выбрана, «Дальше» не нажимается. С включённым тумблером вуз, курс и программа появляются внутри карточки."},
    {id:"6", who:"D", do:"На вопросе «Резюме» нажмите «📎 Загрузить файл» и выберите .txt, потом PDF.", exp:"Три кнопки: «📎 Загрузить файл», «🔗 Дать ссылку», «🙅 У меня нет резюме». На .txt: «Резюме принимается как PDF или DOCX — другой формат не подойдёт.». PDF грузится сразу и переводит дальше."},
    {id:"7", who:"D", do:"Закройте приложение крестиком посреди анкеты. Откройте снова.", exp:"Мастер открывается на том же шаге с теми же ответами, наверху «Черновик сохранён»."},
    {id:"8", who:"D", do:"Дойдите до обзора и нажмите «Отправить заявку», потом «На главную».", exp:"Обзор «Почти всё» / «Проверь перед отправкой» со строкой «N из M заполнено, K необязательных пропущено.». После отправки экран «Заявка принята»: «Спасибо! Мы всё получили — подробности пришли в чат с ботом.». В чат пришло «Поздравляем, твоя заявка принята!…». На главной плита «⏳ Анкета на проверке», плитка «Анкета» со значением «Новая», плиток «Задания» и «Монеты» пока нет."},
    {id:"9", who:"M", do:"«📋 Заявки» → «📋 Заявки» → «✅ Одобрить».", exp:"Всплывает «Одобрено». Делегату в чат пришло письмо об одобрении."},
    {id:"10", who:"D", do:"Откройте приложение, нажмите на плитку статуса (или «Анкета»).", exp:"Главный экран одобренного: плита «Твой баланс», раздел «Разделы», у «Анкета» значение «Одобрена». Экран статуса: «Заявка одобрена» / «Ты в деле, Имя!», при выключенной оплате «Ждём тебя <дата> в <город>.» и шаги «Следи за новостями в боте», «Позови друзей». Нет обрывков вроде «в .»."},
  ]},
  { key:"bcast", title:"Рассылки и опросы", time:"15 мин", need:"менеджер + делегат", steps:[
    {id:"1", who:"M", do:"«📢 Общение» → «📢 Рассылка».", exp:"«Выберите целевую аудиторию рассылки:» и кнопки «📢 Все пользователи», «📄 По файлу в проекте», «🚫 Не подписаны на канал», «📝 Не завершили регистрацию», «🎯 По фильтру», «🕓 Запланировать», «🗒 Последние рассылки», «⏰ Запланированные», «❌ Отмена»."},
    {id:"2", who:"M", do:"«📢 Все пользователи» → текст «Проверка: обычная» → «✅ Отправить N пользователям».", exp:"Перед отправкой копия сообщения и «Отправить это N пользователям?» с кнопками «✅ Отправить N пользователям», «❗ Отметить как важное», «❌ Отмена». После: «📨 Отправлено X из N…» с «⛔ Остановить», потом «Рассылка завершена. ✅ Отправлено …»."},
    {id:"3", who:"D", do:"Посмотрите рассылку и нажмите под ней «🔕 Не присылать сегодня».", exp:"Пришёл ровно текст менеджера, без шапки «Рассылка». Под ним кнопка «🔕 Не присылать сегодня». После нажатия всплывает «🔕 Хорошо, сегодня присылаю только важное. Вернуть — кнопка «🔔 Присылать всё».», кнопка стала «🔔 Присылать всё», текст рассылки на месте."},
    {id:"4", who:"M", do:"Ещё две рассылки всем: обычная «Проверка: обычная 2» и важная «Проверка: важное» (на подтверждении нажмите «❗ Отметить как важное»).", exp:"Кнопка стала «✅ Отмечено как важное». В отчёте обычной рассылки строка «🔕 Не отправлено (выключили уведомления на сегодня): 1»."},
    {id:"5", who:"D", do:"Посмотрите чат, отправьте /start, нажмите «❗ Важное». Потом под первой рассылкой нажмите «🔔 Присылать всё».", exp:"Пришла только «Проверка: важное», первая строка «❗ Важно», кнопки 🔕 под ней нет. В меню «❗ Важное» → «❗ Важные рассылки за сегодня:», время и текст. После «🔔 Присылать всё»: «🔔 Хорошо, снова присылаю все рассылки.»"},
    {id:"6", who:"M", do:"«📢 Рассылка» → «🎯 По фильтру» → «🏙 Город мероприятия» → «Санкт-Петербург…» → «📊 Показать и отправить» → «🕓 Запланировать» → время через 3 минуты в формате ДД.ММ.ГГГГ ЧЧ:ММ → текст «Проверка: по расписанию» → «🗓 Запланировать».", exp:"«🎯 Рассылка по фильтру», потом «Под фильтр попадает N пользователей.» с кнопками «📨 Отправить сейчас» / «🕓 Запланировать». На прошедшее время: «❌ Это время уже прошло. Введите будущую дату.». В конце «✅ Рассылка #N запланирована на … (по фильтру). Управление: /scheduled». В «⏰ Запланированные» она есть с кнопкой «❌ Отменить»."},
    {id:"7", who:"D", do:"В назначенную минуту посмотрите чат.", exp:"Пришла «Проверка: по расписанию»."},
    {id:"8", who:"M", do:"«📢 Рассылка» → «🗒 Последние рассылки» → карточка «Проверка: обычная 2» → «🗑 Удалить у получателей» → подтвердить.", exp:"«Сообщение удалится у N человек. Вернуть нельзя. Удалить?». После: карточка «🗑 Удалена у получателей.». У делегата сообщение исчезло молча."},
    {id:"9", who:"M", do:"«📢 Общение» → «📊 Опросы» → «➕ Новый опрос»: вопрос «Пиццу или суши?», варианты «Пиццу; Суши», «✅ Готово», «Дальше ➡️», «✅ Только одобренные», «🚀 Отправить сейчас». Делегат голосует; откройте опрос в списке.", exp:"Шаги подписаны «Шаг 1 из 4» … «Шаг 4 из 4», перед отправкой превью и «Кому: … — N чел.». Отчёт «📊 Опрос #N отправлен. ✅ Доставлено …». Делегату приходит обычный опрос, после голоса бот ничего не пишет. В карточке опроса счётчик голосов 1 и кнопки «⏹ Закрыть опрос», «📄 В таблицу»."},
  ]},
  { key:"past", title:"Делегат прошлого сезона", time:"5 мин", need:"менеджер меняет сезон стенда, делегат проверяет; в конце вернуть как было", steps:[
    {id:"1", who:"M", do:"«🎪 Событие» → «🎪 Событие/Медиа» → «🎉 Сезон события»: запишите текущее значение в 💬 и впишите новое, например «Тест 26/3».", exp:"Поле подтверждает новое значение."},
    {id:"2", who:"D", do:"Отправьте /start, нажмите «🚀 Обновить анкету». На первом вопросе «✏️ Изменить» и новый ответ, на остальных «✅ Оставить».", exp:"«С возвращением! Ты уже был(а) с нами на …», следом «Хочешь участвовать снова? Обновим анкету — прошлые ответы предложу оставить.» и кнопка «🚀 Обновить анкету». Каждый вопрос с «Прошлый ответ: …». Резюме: «У нас есть твоё резюме с прошлой регистрации. Оставить его или прислать новое?» с «📎 Оставить прошлое резюме» / «📤 Загрузить новое». В сводке первый ответ новый, остальные старые."},
    {id:"3", who:"M", do:"Верните «🎉 Сезон события» к записанному значению.", exp:"Поле снова показывает прежний сезон. Без этого следующие сессии пойдут по чужому сезону."},
  ]},
  { key:"ext", title:"Внешние формы (Google Форма)", time:"10 мин", need:"менеджер + делегат; Google Форма (пункт 8 подготовки) и личная Яндекс Форма с файлом выгрузки (пункт 10). Вход через Яндекс на тестовом боте не настроен: личная форма подключается без него", steps:[
    {id:"1", who:"M", do:"«📊 Данные» → «📝 Внешние формы».", exp:"Заголовок «📝 Внешние формы», строка «Доступ к Яндекс Формам не подключён», текст «Пока ни одной формы. Подключите форму — ответы будут сами попадать в карточки делегатов.», кнопки «➕ Подключить Яндекс Форму», «➕ Подключить Google Форму», «🔑 Войти через Яндекс», «🔑 Ключи приложения Яндекса»."},
    {id:"2", who:"M", do:"«➕ Подключить Яндекс Форму», затем «Отмена».", exp:"Бот просит ссылку на форму и пишет «Жду ссылку. Передумали — нажмите «Отмена».». Весь путь Яндекс Формы проходим в шагах 9–13, после Google Формы."},
    {id:"3", who:"M", do:"«➕ Подключить Google Форму». Дайте указанному в инструкции адресу доступ «Читатель» к таблице ответов вашей формы и пришлите ссылку на таблицу.", exp:"Инструкция «Как подключить Google Форму: 1. … 2. «Настройки доступа» → добавьте адрес … с ролью «Читатель». 3. Пришлите сюда ссылку на эту таблицу.» и «Жду ссылку. Передумали — нажмите «Отмена».». После ссылки «Ссылка принята.» и экран «📋 Название формы / Как найти человека среди делегатов: / Ник в Telegram — вопрос «…» / Телефон — …» с кнопками «✅ Верно», «✏️ Другой вопрос для ника», «✏️ Другой вопрос для телефона». Если доступ не дан: «Дайте доступ к таблице ответов для … с ролью «Читатель» и пришлите ссылку ещё раз»."},
    {id:"4", who:"M", do:"«✅ Верно» → «📋 Выбрать вкладку» → «➕ Новая вкладка «…»».", exp:"«✅ Форма подключена, подтянуто ответов: N.» и «Осталось выбрать вкладку для копии.». Экран «Куда складывать копию ответов? Лучше завести новую вкладку. …». После выбора «Вкладка создана». В таблице стенда появилась вкладка."},
    {id:"5", who:"D", do:"Заполните Google Форму, в поле ника впишите свой @юзернейм. Подождите до 5 минут.", exp:"Менеджеру пришло «📝 +1 ответ в «Название формы»»."},
    {id:"6", who:"M", do:"/find @ник делегата → «📝 Ответы форм».", exp:"В карточке строка «📝 Формы: Название ✓» и кнопка «📝 Ответы форм». Ответы приходят отдельным сообщением «📝 Название · дата / Анкета 1 из 1»."},
    {id:"7", who:"M", do:"«📢 Рассылка» → «🎯 По фильтру» → «📝 Внешняя форма» → ваша форма → «✅ Заполнил» → «📊 Показать и отправить» → «❌ Отмена».", exp:"«📝 Какая форма? Затем выберите, кому писать — заполнившим или нет.», потом «📝 «Название» — кому писать?» с «✅ Заполнил» / «❌ Не заполнил». В сводке «Внешняя форма = Название: заполнил», под фильтр попадает 1."},
    {id:"8", who:"M", do:"Карточка формы → «⏸ Поставить на паузу», потом «⛔ Отключить» → «⛔ Да, отключить».", exp:"Карточка: «Состояние: принимает ответы», «Ответов: 1», «Вкладка таблицы: …». На паузу: «Приём ответов на паузе.». Перед отключением «⛔ Отключить форму «Название»?» и «Новые ответы перестанут приниматься. Собранные 1 анкет останутся в боте и в таблице.». После: «Форма отключена. Собранное осталось.»"},
    {id:"9", who:"M", do:"«📊 Данные» → «📝 Внешние формы» → «➕ Подключить Яндекс Форму» → пришлите ссылку на личную Яндекс Форму из подготовки (пункт 10).", exp:"Бот объясняет, что форма в личном аккаунте (или что вход через Яндекс не подключён) и что ответы может присылать интеграция формы. Кнопки «📮 Это личная форма — ответы пришлёт интеграция» и «🔑 Войти через Яндекс»."},
    {id:"10", who:"M", do:"«📮 Это личная форма — ответы пришлёт интеграция» → «Оставить «Яндекс Форма»» (или пришлите своё название).", exp:"«✅ Форма подключена. Ответы будут приходить через интеграцию формы.» и список «Осталось: 1) «🔗 Адрес и инструкция» … 2) «📥 Загрузить старые ответы» … 3) выбрать вкладку для копии.» В карточке формы строка «Режим: личная форма — ответы присылает интеграция формы»."},
    {id:"11", who:"M", do:"«🔗 Адрес и инструкция». В Яндекс Форме: «Интеграции» → «API» → «Запрос JSON-RPC POST», вставьте адрес из бота и добавьте параметры: answer_id = переменная «ID ответа»; answers = «Ответы на вопросы» (все вопросы, формат JSON); created = «Время отправки ответа». Сохраните.", exp:"Инструкция в боте начинается со слов «Эта форма в личном аккаунте Яндекса — бот не может читать её сам, ответы присылает интеграция формы. Один раз настройте её:» и перечисляет те же параметры. Интеграция в форме сохранилась."},
    {id:"12", who:"D", do:"Заполните Яндекс Форму ещё раз, в поле ника ваш @юзернейм. Подождите минуту.", exp:"В карточке формы «Ответов» стало на 1 больше. В Яндекс Форме «Интеграции» → «Выполненные интеграции»: запрос со статусом «Успешно». Если в карточке написано «Последний запрос от Яндекса пришёл без ответов», значит параметр answers настроен не так."},
    {id:"13", who:"M", do:"Карточка формы → «🔑 Вопросы ника и телефона» → «✏️ Вопрос для ника» → «Ник в Telegram». Потом «📥 Загрузить старые ответы» → пришлите файл XLSX из подготовки документом.", exp:"Строки «Ник в Telegram — вопрос «Ник в Telegram»», «Телефон — не выбран». После файла «📥 Готово: добавлено N, уже были M, без ID ответа 0.» Ответ, который уже пришёл через интеграцию, не задвоился. /find @ник делегата показывает «📝 Формы»."},
  ]},
  { key:"deleg", title:"Делегации вузов", time:"25 мин", need:"менеджер + два делегата (два аккаунта с @юзернеймами; можно один аккаунт по очереди через /uat); Google Форма «Делегации вузов» из подготовки (пункт 9), подключённая в «📝 Внешние формы» так же, как форма в разделе «Внешние формы» (шаг 3 и «✅ Верно»; вкладку для копии на шаге 4 не выбирайте — лист для этой формы задаётся в шаге 5 раздела делегаций); вкладка «UR REGS» в таблице стенда уже создана; у делегата открывается приложение стенда; у менеджера — веб-дашборд стенда", steps:[
    {id:"1", who:"M", do:"«📋 Заявки» → «🏫 Делегации».", exp:"Заголовок «🏫 Делегации вузов». Если форма ещё не выбрана: «Форма делегаций не выбрана. Нажмите «📝 Выбрать форму» — список подключённых форм из «📝 Внешние формы».» и кнопка «📝 Выбрать форму». Если «Ни одна форма ещё не подключена»: сначала пройдите раздел «Внешние формы»."},
    {id:"2", who:"M", do:"«📝 Выбрать форму» → ваша Google Форма делегаций.", exp:"«Проверьте вопросы формы — по ним бот узнаёт делегата:» и строки «ФИО — вопрос «…»», «Вуз — вопрос «…»», «Курс — вопрос «…»», «Ник в Telegram — вопрос «…» (из настроек формы)». Кнопки «✅ Верно», «✏️ Другой вопрос для ФИО», «✏️ Другой вопрос для вуза», «✏️ Другой вопрос для курса»."},
    {id:"3", who:"M", do:"Если вопросы определены верно, нажмите «✅ Верно».", exp:"Всплывает «Вопросы сохранены, разбираю ответы формы…». Экран «🏫 Делегации вузов» со строкой «В форме: N · ЦА: N · не ЦА: N · проверить: N · зашли в бота: N · пришли: N» и строкой «⏸ Не включено — бот пока никого не одобряет и никому не пишет. …» и кнопками «✅ Включить делегации», «❔ Проверить курс (N)», «⏳ Не зашли (N)», «🏫 По вузам», «📋 Лист UR REGS», «🎮 Геймификация для делегатов: ☐», «📅 Отсечка ЦА: ДД.ММ.ГГГГ», «🎓 Курсы не ЦА: 1, 2», «✏️ Тексты делегату», «❓ Вопросы формы», «📝 Сменить форму»."},
    {id:"4", who:"M", do:"«🏫 По вузам».", exp:"«🏫 По вузам», по строке на вуз: «<вуз> — ЦА N · в боте N · пришли N», внизу «Всего вузов: N». Если ответов ещё нет: «Пока ни одного ответа ЦА в форме.»"},
    {id:"5", who:"M", do:"Вернитесь на экран делегаций → «📋 Лист UR REGS» → вкладка «UR REGS».", exp:"«🔍 Сверка с листом «UR REGS»»: «В листе строк: N», «Узнал по ID ответа: N», «Добавлю новых: N», «Шапка A–L: ✅ совпадает с вопросами формы», «Колонка M: ✅ свободна» (или «✅ уже «В боте»»). Кнопка «✅ Включить запись в «UR REGS»»."},
    {id:"6", who:"M", do:"«✅ Включить запись в «UR REGS»» → «✅ Да, включить». Затем на экране делегаций «✅ Включить делегации» → «✅ Включить».", exp:"Перед включением: «Бот начнёт писать в лист «UR REGS»: • обновит N строк (колонки D–M), • добавит N новых строк после последней заполненной, • покрасит не-ЦА серым, зелёные строки и колонки P и правее не тронет. Включить?». После: всплывает «Запись включена, в очереди N строк», на экране «📋 Лист: «UR REGS» · запись включена». Затем «🏫 Включить делегации?» с текстом «Бот одобрит N человек, которые уже есть в боте, и отправит им приветствие. …» (или «Сейчас в боте нет никого из ЦА этой формы. …»). После «✅ Включить» всплывает «Делегации включены — одобряю и пишу делегатам…», на экране строка «▶️ Включено — бот одобряет делегатов из формы и пишет им приветствие.» Пока не включено, делегаты в шагах 7–9 сообщения не получат."},
    {id:"7", who:"D", do:"Сначала заполните Google Форму делегаций: вуз «Тестовый университет», курс «Магистратура, 1 курс», в поле ника ваш @юзернейм. Подождите до 5 минут, потом /uat → «🆕 Новичок — анкеты нет» → /start.", exp:"Приходит «Привет! Ты в списке делегации Тестовый университет на форум Юлид в Москве 🎉 Анкету заполнять не нужно — заявка уже одобрена. Ниже меню участника: там будет QR на вход и все новости форума.» и обычное меню одобренного делегата. Вопросов анкеты нет. «🎟 Мой QR» открывает QR, если вход по QR включён."},
    {id:"8", who:"D", do:"Второй делегат (или тот же после /uat → «🆕 Новичок — анкеты нет»): пройдите анкету до сводки и отправьте её, заявка «на рассмотрении». Потом заполните Google Форму со своим @юзернеймом и подождите до 5 минут.", exp:"Приходит «Ты в списке делегации <вуз> — спасибо, что с нами! Заявка одобрена, меню участника ниже.» Заявка из «на рассмотрении» стала одобренной без решения менеджера."},
    {id:"9", who:"D", do:"Третий вариант: новичок нажимает /start и доходит до первых вопросов анкеты, но не отправляет её. Тогда заполните Google Форму со своим @юзернеймом и подождите до 5 минут.", exp:"Приходит «Привет! Ты в списке делегации <вуз> на форум Юлид в Москве 🎉 …». Незаконченная анкета сбрасывается, дальше обычное меню одобренного."},
    {id:"10", who:"M", do:"Подайте форму от тестера так, чтобы курс бот не распознал (например, курс «учусь заочно»). Подождите до 5 минут → экран «🏫 Делегации вузов» → «❔ Проверить курс (N)» → карточка человека.", exp:"Список «❔ Проверить курс (N)» и подпись «Нажмите на человека, чтобы решить.» В карточке «Вуз: …», «Курс как в форме: «учусь заочно»», «Ник: …» и кнопки «✅ ЦА», «🚫 Не ЦА». После «✅ ЦА» всплывает «Отмечено: ЦА — заявка одобрена» (если человек уже в боте) или «Отмечено: ЦА — человек ещё не заходил в бота, появится в «⏳ Не зашли»»."},
    {id:"11", who:"M", do:"Подайте форму с опечаткой в @юзернейме делегата → «⏳ Не зашли (N)» → «🔗 <ФИО> (@ник)» → перешлите сообщение делегата или пришлите его @ник → «✅ Привязать».", exp:"«⏳ Не зашли в бота (N)»: «ЦА по форме, но бот их не узнал по нику. Нажмите, чтобы привязать вручную.» После «🔗»: «Кого это? Пришлите @ник, Telegram ID или перешлите сообщение этого человека. Привязать можно только того, кто уже открывал бота.» Подтверждение: «Привязать <ФИО> (<вуз>) к …? Заявка будет одобрена без анкеты, человек получит сообщение и доступ к QR на вход.» После «✅ Привязать» всплывает «Привязано — заявка одобрена», делегату приходит приветствие."},
    {id:"12", who:"M", do:"«📢 Рассылка» → «🎯 По фильтру» → «🏫 Делегации» → «Делегация вуза» → «📊 Показать и отправить» → «❌ Отмена».", exp:"В выборе две кнопки «Делегация вуза» и «Не делегация»; в сводке «Делегация вуза = Делегация вуза», число получателей равно числу делегатов в боте. Кнопка «🏫 Вуз делегации» рядом отбирает один вуз из списка формы. Если делегатов в базе нет совсем: «Делегаций в базе пока нет — фильтровать не по чему.»"},
    {id:"13", who:"D", do:"Посмотрите главное меню и нажмите любую старую кнопку игры, если она осталась в клавиатуре. Потом менеджер: «🎮 Геймификация для делегатов: ☐» → ✅, делегат: /start.", exp:"Пока тумблер выключен, в меню нет «🪙 Мои монеты» и «🎯 Задания»; старая кнопка отвечает «Задания и монеты для делегаций вузов на этом форуме выключены. Всё остальное — программа, QR на вход, новости — работает как обычно.» После включения (всплывает «Геймификация для делегатов: включена») обе кнопки появляются в меню."},
    {id:"14", who:"D", do:"Выключите тумблер «🎮 Геймификация для делегатов» обратно (☐) и откройте приложение стенда делегатом вуза.", exp:"Главный экран, профиль, программа и вопросы открываются как обычно. «Задания» и «Монеты» не открываются и показывают «Задания и монеты для делегаций выключены». Включите тумблер (✅) и откройте «Задания» заново: список открылся."},
    {id:"15", who:"M", do:"В боте «📊 Данные» → «📊 Дашборд» → «🏫 Делегации» (появится ✅). Откройте веб-дашборд стенда, страница статистики.", exp:"На странице новый раздел «Делегации» в оглавлении и в списке: таблица «Вуз · ЦА в форме · В боте · Пришли», внизу строка «Всего». Тестовый вуз в таблице, ЦА ≥ 1 и «В боте» ≥ 1. Нажмите «🏫 Делегации» ещё раз (☐) и обновите страницу: раздела нет."},
    {id:"16", who:"M", do:"Откройте в Google-таблице стенда вкладку «UR REGS».", exp:"Строка делегата: ID ответа в A, ответы формы в D–L, в колонке M «✅ зашёл»; у не зашедшего «⏳ не заходил»; у не ЦА строка серая и в M «— не ЦА». Колонки P и правее не изменились."},
    {id:"17", who:"M", do:"В конце удалите тестовых делегатов командой /delete_user, верните «🎮 Геймификация для делегатов» в положение, как было до сессии, и нажмите «⏸ Выключить» на экране делегаций.", exp:"Тестеры пропали из «🏫 По вузам» и из таблицы дашборда; счётчик «В форме» не меняется: ответы формы остаются в боте."},
  ]},
  ]},

{ key:"s3", n:3, when:"вт 20.10 · 21:00 МСК", title:"Админка, статистика, игра", time:"≈90 мин", people:"2 человека",

  roles:["M","D"],
  setup:{ time:"10 мин", items:[

    {id:"3", who:"D", do:"/uat → «✅ Одобрен» → «Делегат — без ролей» → «✅ Сбросить и засеять» → /start.", exp:"«✅ Готово.», после /start меню одобренного делегата."},
    {id:"4", who:"M", do:"Откройте в телефоне раздел «Повторная проверка» внизу этой страницы и посмотрите, сколько там шагов: это ❌ из сессий 1 и 2. Оставьте на них последние 15 минут.", exp:"Раздел собрался сам. Если он пуст, значит ❌ не было."},
    {id:"5", who:"M", do:"Приготовьте PDF-файл (любой) для замены резюме и компьютер с браузером для доски статистики test.alekseev.info.", exp:""},
    {id:"6", who:"M", do:"Для «+N в чате» и переноса баллов: тестовый бот добавлен в чат делегатов стенда и чат привязан (если нет, попросите Андрея заранее); менеджер и делегат состоят в чате. Создайте Google-таблицу с вкладкой: колонки «Ник», «Задание 1 (#a)», «Задание 2 (#b)»; строки с @юзернеймом делегата (баллы 10 и 5) и с выдуманным ником @nobody_uat_test (баллы 3). Дайте таблице доступ «Читатель» для адреса, который бот покажет в шаге 10 раздела «Геймификация» (или откройте доступ по ссылке).", exp:"Чат и таблица готовы."},
  ]},
  sections:[
  { key:"card", title:"Карточка делегата /find", time:"10 мин", need:"менеджер + делегат", steps:[
    {id:"1", who:"M", do:"/find @ник делегата.", exp:"Карточка: ID, Имя, Username, «Статус: ✅ Одобрена», «Город: …», «Сезон: …». Кнопки «🔄 Перевыпустить QR», «🏙 Перевести в город», «↩️ Вернуть в ожидание», «✏️ Открыть правку после решения», «📎 Заменить резюме»."},
    {id:"2", who:"M", do:"«✏️ Открыть правку после решения» → оставьте «🔔 Сообщить делегату: ВКЛ» → «✅ Открыть правку».", exp:"«✏️ Открыть правку после решения?» и «Разрешение одноразовое — погаснет после первой применённой правки.». Делегату пришло сообщение, что анкету можно поправить."},
    {id:"3", who:"D", do:"По сообщению бота откройте правку, поменяйте один ответ, остальные оставьте, сохраните.", exp:"Каждый вопрос с «Прошлый ответ: …» и кнопками «✅ Оставить» / «✏️ Изменить». После сохранения бот подтверждает, что ответы обновлены. В /find у менеджера снова «✏️ Открыть правку после решения»: разрешение погасло."},
    {id:"4", who:"M", do:"/find → «↩️ Вернуть в ожидание» → «✅ Вернуть в ожидание». Потом «📋 Заявки» → «📋 Заявки» → «✅ Одобрить».", exp:"«↩️ Вернуть в ожидание модерации?», «Статус: … → ⏳ Ожидает модерации», «Что изменится: снимутся напоминания об оплате…, строка в таблице станет «Новая»…, QR-пропуск на форум перестанет пускать.». После возврата делегат на кнопку меню получает «⏳ Твоя заявка на рассмотрении…», заявка снова в очереди. После одобрения делегату письмо об одобрении."},
    {id:"5", who:"M", do:"«🏙 Перевести в город» → «Тюмень…» → «✅ Оставить статус (…)». Потом так же вернуть в «Санкт-Петербург…».", exp:"«🏙 В какой город перевести?» (только включённые города), экран «🏙 Перевод в другой город» со строками «Город: A → B», «Статус сейчас: …» и кнопками «✅ Оставить статус (…)» / «↩️ Вернуть на модерацию». Итог «✅ … переведён(а): город — …». В /find строка «Город» поменялась."},
    {id:"6", who:"M", do:"«📎 Заменить резюме» → пришлите PDF.", exp:"«📎 Заменить резюме» … «Пришлите новый файл резюме (PDF или DOCX) одним сообщением… Передумали — /cancel.» После файла «✅ Резюме делегата … заменено.»"},
    {id:"7", who:"D", do:"/uat → «🚫 Отклонён» → «Делегат — без ролей» → «✅ Сбросить и засеять». Менеджер: /find → «🔁 Разрешить повторную подачу» → «✅ Разрешить». Делегат подаёт анкету заново по сообщению бота.", exp:"У отклонённого в карточке «🔁 Разрешить повторную подачу». Текст «🔁 Разрешить повторную подачу?» и «Разрешение одноразовое — погаснет сразу после того, как делегат подаст анкету.». После подачи менеджеру приходит «🔁 Повторная подача анкеты!», в /find кнопка стала «🔁 Отозвать разрешение» или пропала."},
  ]},
  { key:"rules", title:"Правила автоотказа", time:"10 мин", need:"менеджер + делегат (новая анкета)", steps:[
    {id:"1", who:"M", do:"«📋 Заявки» → «🚫 Правила автоотказа».", exp:"Строка «Сейчас все правила выключены…» или «Сейчас правила работают.». Кнопки «➕ Новое правило», «✅ Включить все правила» / «🚫 Выключить все правила», «🤖 Автоотказы», «📊 Отчётность»."},
    {id:"2", who:"M", do:"«➕ Новое правило» → «🧩 Курс из списка».", exp:"Заготовки «🧩 Младше 18 на дату форума», «🧩 Курс из списка», «🧩 Нет резюме», «✏️ Своё правило». После выбора «Правило создано и выключено — включите его, когда проверите условия.» Карточка правила: «➕ условие в группу 1», «➕ новая группа (ИЛИ)», «↔ Действие: 🚫 Отклонять», «🏙 Город: …», треки, «✏ Имя правила», «✏ Текст отказа», «🔢 Сколько заявок попадёт», «✅ Включить», «📋 Скопировать в другой город», «🗑 Удалить»."},
    {id:"3", who:"M", do:"Откройте условие правила и оставьте в нём курсы 1 и 2. Нажмите «✏ Текст отказа» и впишите «Пока берём только старшие курсы, попробуй в следующем сезоне».", exp:"Условие собирается кнопками: «🧩 Условие — выберите вопрос анкеты» → «Выберите условие:» → «Отметьте варианты:» → «✅ Готово». Текст отказа сохранён, в нём нет слова «автоматически»."},
    {id:"4", who:"M", do:"«✅ Включить» → «✅ Всё равно включить». Если правила выключены разом, нажмите «✅ Включить все правила».", exp:"«✅ Включить правило?», «Под это правило сейчас попали бы N из M заявок. Это превью — уже поданные заявки не изменятся…», кнопки «✅ Всё равно включить» / «← Назад». После включения в карточке «🚫 Выключить»."},
    {id:"5", who:"D", do:"/uat → «🆕 Новичок — анкеты нет» → «Делегат — без ролей» → «✅ Сбросить и засеять» → /start → пройдите анкету, на вопросе про курс выберите 1.", exp:"Сразу после «Всё верно» приходит отказ с вашим текстом «Пока берём только старшие курсы…», без слова «автоматически». Менеджеру заявка в очередь не попадает."},
    {id:"6", who:"M", do:"«🚫 Правила автоотказа» → «🤖 Автоотказы» → «↩️ Вернуть: Имя» → «↩️ Да, вернуть».", exp:"В журнале строки «Всего / Страница» и заявка делегата. После возврата «Заявка возвращена на модерацию — делегат уведомлён.», делегату пришло «Ваша заявка возвращена на обычную модерацию — её пересмотрит менеджер.», заявка в очереди «📋 Заявки»."},
    {id:"7", who:"M", do:"Откройте правило → «🗑 Удалить» → подтвердить.", exp:"Правила нет в списке. Журнал «🤖 Автоотказы» при этом не пропал."},
  ]},
  { key:"roles", title:"Роли и доступы", time:"8 мин", need:"менеджер + делегат", steps:[

    {id:"2", who:"M", do:"«➕ Добавить менеджера» → перешлите боту любое сообщение делегата → «📊 Менеджер статистики» → город → «♾ Бессрочно».", exp:"«👥 Кого добавить менеджером? Пришлите одним сообщением: • пересланное сообщение от этого человека, • его @username, • или числовой telegram id.» → «Кого назначить: Имя (@ник)» → роль → «🌍 Все города» или город → «⏳ Срок действия роли». В списке появилась строка «➖ Имя — 📊 Менеджер статистики»."},

    {id:"4", who:"M", do:"В «👥 Роли и доступы» нажмите «➖ Имя — 📊 Менеджер статистики» и подтвердите.", exp:"Строка пропала. У делегата /admin больше не открывается, на доске после «Проверить доступ ещё раз» экран «Нет доступа» с кнопками «Открыть бота» и «Проверить доступ ещё раз»."},
    {id:"5", who:"M", do:"«✏️ Права роли: 🛂 Менеджер регистраций». Ничего не меняйте.", exp:"Галочки с человеческими подписями: «📋 Модерация заявок», «🧾 Модерация чеков», «🎮 Модерация геймификации», «📢 Рассылки», «⚙️ Настройки», «📊 Статистика», «✅ Отметки на форуме (чек-ин)», «📝 Одобрение на месте», «🔗 Ссылки с метками». Предупреждение «⚠️ Право «⚙️ Настройки» включает управление ролями — выдавайте его как равнозначное админскому.»"},

  { key:"stats", title:"Статистика", time:"8 мин", need:"менеджер с компьютером", steps:[

    {id:"2", who:"M", do:"Найдите блок «Вопросы делегатов» и блок «Геймификация».", exp:"«Всего вопросов / Ждут ответа / Отвечено / Среднее время ответа», «Кто отвечает». В «Геймификация»: «Участников», «Ждут проверки», «Одобрено», «Отклонено», «Сдач всего», «Коинов начислено». Цифры похожи на правду по тому, что вы делали на стенде."},

    sec.steps = sec.sources.flatMap(x => x.steps);
    sec.sessions = SESS_ORDER.filter(k => sec.sources.some(x => x.sess === k));

}

const quoteUi = s => {
  let out = "", depth = 0, buf = "";
  for (const ch of String(s)) {
    if (ch === "«") { if (depth === 0) { out += esc(buf); buf = ""; } else buf += ch; depth++; }
    else if (ch === "»" && depth > 0) { depth--; if (depth === 0) { out += '<q class="ui">' + esc(buf) + "</q>"; buf = ""; } else buf += ch; }
    else buf += ch;
  }
  out += esc(depth ? "«" + buf : buf);
  return out.replace(/ → /g, ' <span class="ar">→</span> ');
};

async function api(path, body){
  const r = await fetch(path, {
    method: body ? "POST" : "GET",
    headers: Object.assign({ "X-Code": CODE }, body ? { "Content-Type": "application/json" } : {}),
    body: body ? JSON.stringify(body) : undefined, cache: "no-store",
  });
  if (r.status === 403) { setSync("Нет доступа: откройте доску по ссылке из чата, в ней код.", "bad"); throw new Error("no_access"); }
  if (!r.ok) throw new Error("http " + r.status);
  return r.json();
}

    <div class="empty" id="empty" hidden>Под фильтр не попал ни один шаг. Нажмите «Все сессии», «Все роли» и «Любой статус».</div>
  </main>
  <footer class="end">✅ совпало с «Должно быть». ❌ не так: напишите, что увидели, и скриншот Андрею. ⏭ пропустили. Отметки общие, поэтому впишите имя внизу. В конце нажмите «Отчёт» и отправьте текст Андрею. Юлид · АЙСЕК · общая доска приёмки uat.alekseev.info · <a href="#s1">сессия 1</a> · <a href="#s2">сессия 2</a> · <a href="#s3">сессия 3</a> · <a href="#bl">без сессии</a></footer>`;

  for (const li of root.querySelectorAll("li.step")) page.nodes[li.dataset.key] = mkNode(li);
  for (const li of root.querySelectorAll("ol.pre li")) page.preNodes[li.dataset.key] = li;
  renderRe();
  setOpen(true);
  $("filters").addEventListener("click", e => {
    const b = e.target.closest(".chip"); if (!b) return;
    page.f[b.dataset.f] = b.dataset.v; local._f = page.f; save();
    if (b.dataset.f === "sess") history.replaceState(null, "", b.dataset.v ? "#" + b.dataset.v : location.pathname + location.search);
    setOpen(false); applyFilter(); paint();
    if (b.dataset.f === "sess") window.scrollTo(0, Math.max(0, $("bar").getBoundingClientRect().top + window.scrollY - 4));
  });
}
/* Разделы раскрыты, когда включён любой фильтр (так шаги сессии сразу на виду); без фильтра свёрнуты. */
function setOpen(initial){
  const any = page.f.sess || page.f.role || page.f.stat;
  for (const d of root.querySelectorAll("details.sec")) { if (initial && d.id === "sec-debt-" + RE_KEY) continue; d.open = !!any; }
}
function mkNode(li){
  const st = findStep(li.dataset.key);
  return { li, st, note: li.querySelector(".note"), by: li.querySelector(".by"), nb: li.querySelector(".nb"), btns: li.querySelectorAll(".mk[data-m]:not(.nb)") };
}
function findStep(key){ return STEP_INDEX[key] || (page && page.reList || []).find(x => x.key === key) || { key, num: key, who: "A", do: key, exp: "" }; }

function renderRe(){
  const list = reSteps();
  const sig = list.map(x => x.key).join("|");
  if (sig === page.reSig) return;
  const old = $("sec-debt-" + RE_KEY);
  const wasOpen = old ? old.open : false;
  page.reSig = sig; page.reList = list;
  for (const k of Object.keys(page.nodes)) if (k.startsWith("s3." + RE_KEY + ".")) delete page.nodes[k];
  $("rebox").innerHTML = reSectionHtml(list);
  const d = $("sec-debt-" + RE_KEY);
  d.open = wasOpen || !!(page.f.sess || page.f.role || page.f.stat);
  for (const li of $("rebox").querySelectorAll("li.step")) page.nodes[li.dataset.key] = mkNode(li);
  applyFilter();
}

/* ───────── отметки ───────── */
function push(key, s, note){
  const body = { key, s: s || "", note: note || "", who: (local._who || "").trim() };
  setSync("Сохраняю…", "");
  api("/api/step", body).then(st => { state = st; paint(); setSync("Общая доска · сохранено " + hhmm(), "ok"); })
    .catch(e => { if (e.message !== "no_access") { setSync("Нет связи: отметка не сохранилась, нажмите ещё раз", "bad"); toast("Не сохранилось: нет связи"); } });
}
const timers = {};
root.addEventListener("click", e => {
  const box = e.target.closest(".box");
  if (box) { togglePre(box.closest("li")); return; }
  const b = e.target.closest(".mk"); if (!b) return;
  const li = b.closest("li.step"); const key = li.dataset.key; const nd = page.nodes[key];
  const m = b.dataset.m;
  if (m === "note") { nd.note.hidden = !nd.note.hidden; if (!nd.note.hidden) nd.note.focus(); return; }
  if (!(local._who || "").trim()) toast("Впишите имя внизу в «Кто проверяет»: оно встанет рядом с отметкой");
  const v = (li.dataset.s === m) ? "" : m;
  li.dataset.s = v;
  if (v === "bad") { nd.note.hidden = false; nd.note.focus(); }
  state.steps[key] = { s: v, note: nd.note.value, who: local._who || "", at: "…" };
  paint(); push(key, v, nd.note.value);
});
root.addEventListener("keydown", e => {
  const box = e.target.closest(".box"); if (!box) return;
  if (e.key === " " || e.key === "Enter") { e.preventDefault(); togglePre(box.closest("li")); }
});
function togglePre(li){
  const key = li.dataset.key; const v = li.dataset.s === "ok" ? "" : "ok";
  li.dataset.s = v; state.steps[key] = { s: v, note: "", who: local._who || "", at: "…" };
  paint(); push(key, v, "");
}
root.addEventListener("input", e => {
  if (!e.target.classList.contains("note")) return;
  const li = e.target.closest("li.step"); const key = li.dataset.key;
  clearTimeout(timers[key]); timers[key] = setTimeout(() => push(key, li.dataset.s || "", e.target.value), 800);
});

/* Шаги, попавшие под фильтр сессии (роль и статус на счётчики не влияют). */
const inSess = (st, f) => !f.sess || st.sess === f.sess;
function paint(){
  if (!page) return;
  renderRe();
  const f = page.f;
  for (const key of Object.keys(page.nodes)) {
    const nd = page.nodes[key]; const c = cur(key); const v = (c && c.s) || "";
    nd.li.dataset.s = v;
    nd.btns.forEach(b => b.setAttribute("aria-pressed", b.dataset.m === v ? "true" : "false"));
    const note = (c && c.note) || "";
    if (document.activeElement !== nd.note) { nd.note.value = note; if (note || v === "bad") nd.note.hidden = false; }
    nd.nb.classList.toggle("has", !!note.trim());
    const by = c ? [c.who, c.at && c.at !== "…" ? c.at + " МСК" : ""].filter(Boolean).join(" · ") : "";
    nd.by.textContent = by ? (v === "ok" ? "✅ " : v === "bad" ? "❌ " : v === "skip" ? "⏭ " : "💬 ") + by : "";
    nd.by.hidden = !by;
  }
  for (const key of Object.keys(page.preNodes)) {
    const li = page.preNodes[key]; const c = cur(key); const v = (c && c.s) || "";
    li.dataset.s = v; li.querySelector(".box").setAttribute("aria-checked", v === "ok" ? "true" : "false");
  }
  const cntEl = (el, c) => { if (!el) return; el.textContent = c.total ? c.done + " / " + c.total + (c.bad ? " · ❌ " + c.bad : "") : ""; el.className = "cnt" + (c.bad ? " has-bad" : c.total && c.done === c.total ? " all" : ""); };
  const re = page.reList || [];
  const all = { ok: 0, bad: 0, skip: 0, done: 0, total: 0 };
  const parts = [];
  for (const blk of BLOCKS) {
    const bsteps = [];
    for (const sec of blk.sections) {
      const st = sec.steps.filter(x => inSess(x, f)); bsteps.push(...st);
      cntEl($("cnt-" + sec.id), counts(st));
    }
    if (blk.key === "debt") { const rs = re.filter(x => inSess(x, f)); bsteps.push(...rs); cntEl($("cnt-debt-" + RE_KEY), counts(rs)); }
    const c = counts(bsteps);
    cntEl($("cnt-blk-" + blk.key), c);
    for (const k of Object.keys(all)) all[k] += c[k];
    parts.push(blk.title + " " + c.done + "/" + c.total);
    const full = counts(blk.sections.flatMap(x => x.steps));
    $("bp-" + blk.key).innerHTML = `<b>${full.done}</b> из ${full.total} проверено${full.bad ? ` · <b style="color:var(--bad)">❌ ${full.bad}</b>` : ""}`;
    $("bt-" + blk.key).innerHTML = trackHtml(full);
    $("bw-" + blk.key).textContent = full.total && full.done === full.total ? "всё проверено" : "";
  }
  const label = f.sess ? SESS_TAG[f.sess] : "Все сессии";
  $("ptext").innerHTML = `${esc(label)}: проверено <b>${all.done}</b> из ${all.total}` + (all.bad ? ` · <b class="e">❌ ${all.bad}</b>` : "") + (all.skip ? ` · ⏭ ${all.skip}` : "");
  const pre = f.sess ? counts(S[f.sess].pre) : null;
  $("pright").textContent = pre && pre.total ? `подготовка ${pre.ok}/${pre.total}` : parts.join(" · ");
  $("ptrack").innerHTML = trackHtml(all);
  applyFilter();
}
function applyFilter(){
  if (!page) return;
  const f = page.f; let shown = 0;
  document.querySelectorAll("#filters .chip").forEach(b => b.setAttribute("aria-pressed", String((f[b.dataset.f] || "") === b.dataset.v)));
  for (const key of Object.keys(page.nodes)) {
    const nd = page.nodes[key]; const v = nd.li.dataset.s || "";
    const okSess = !f.sess || nd.li.dataset.sess === f.sess;
    const okRole = !f.role || nd.li.dataset.who === f.role || nd.li.dataset.who === "A";
    const okStat = !f.stat || (f.stat === "todo" ? !v : v === f.stat);
    nd.li.hidden = !(okSess && okRole && okStat); if (!nd.li.hidden) shown++;
  }
  for (const sub of root.querySelectorAll("li.subh")) {
    const vis = sub.parentElement.querySelectorAll("li.step:not([hidden])");
    sub.hidden = vis.length === 0;
  }
  for (const sec of root.querySelectorAll("details.sec")) {
    const steps = sec.querySelectorAll("li.step"); const vis = sec.querySelectorAll("li.step:not([hidden])");
    sec.hidden = steps.length > 0 && vis.length === 0;
  }
  for (const blk of root.querySelectorAll("section.blk")) {
    const secs = blk.querySelectorAll("details.sec"); const vis = blk.querySelectorAll("details.sec:not([hidden])");
    blk.hidden = secs.length > 0 && vis.length === 0;
  }
  for (const si of root.querySelectorAll(".sessinfo")) si.hidden = si.dataset.sess !== f.sess;
  $("empty").hidden = shown > 0 || !Object.keys(page.nodes).length;
}

/* ───────── маршрут ───────── */
/* #s1 / #s2 / #s3 / #bl — включить фильтр сессии (так ссылки старой доски остаются рабочими);
   #blk-… / #sec-… — прокрутить к блоку или разделу. */
function route(){
  if (!page) renderBoard();
  const h = location.hash.replace("#", "");
  if (S[h]) { page.f.sess = h; local._f = page.f; save(); setOpen(false); applyFilter(); paint(); window.scrollTo(0, Math.max(0, $("bar").getBoundingClientRect().top + window.scrollY - 4)); return; }
  const el = h ? document.getElementById(h) : null;
  if (el) { if (el.tagName === "DETAILS") el.open = true; el.scrollIntoView(); }
  paint();
}
window.addEventListener("hashchange", route);

const who = $("who");
who.value = local._who || "";
who.addEventListener("input", () => { local._who = who.value; save(); });

async function pull(){
  try {
    const st = await api("/api/state");
    if (st.v !== state.v) { state = st; paint(); }
    setSync("Общая доска · обновлено " + hhmm(), "ok");
  } catch (e) { if (e.message !== "no_access") setSync("Нет связи с доской, показываю последнее известное", "bad"); }
}
route();
pull();
setInterval(pull, 5000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) pull(); });

/* ───────── отчёт ───────── */
const LABEL = { ok: "✅ ок", bad: "❌ не так", skip: "⏭ пропуск" };
function buildReport(){
  const f = page ? page.f : { sess: "" };
  const head = ["ПРИЁМКА ЮЛИД '26 · тестовый бот @YouLead_test_bot · общая доска uat.alekseev.info",
    "Отчёт собран: " + new Date().toLocaleString("ru-RU") + (local._who ? " · " + local._who : "")];
  const lines = [];
  const re = (page && page.reList) || [];
  const scope = f.sess ? SESS_TAG[f.sess].toUpperCase() : "ВСЕ СЕССИИ";
  const all = counts(ALL_STEPS.filter(st => inSess(st, f)).concat(re.filter(st => inSess(st, f))));
  lines.push("\n" + scope + " (" + all.done + " из " + all.total + ", ❌ " + all.bad + ", ⏭ " + all.skip + ")");
  const sessList = f.sess ? [S[f.sess]] : SESSIONS;
  for (const s of sessList) {
    const pre = s.pre.filter(it => { const st = cur(it.key); return !(st && st.s === "ok"); });
    if (pre.length && pre.length < s.pre.length) lines.push("  Не отмечено в подготовке (" + SESS_SHORT[s.key] + "): " + pre.map(it => it.id).join(", "));
  }
  for (const blk of BLOCKS) {
    const secs = blk.sections.map(sec => ({ n: blk.pre + sec.n, title: sec.title, steps: sec.steps }));
    if (blk.key === "debt") secs.push({ n: "Д" + (blk.sections.length + 1), title: "Повторная проверка", steps: re });
    const out = [];
    for (const sec of secs) {
      const steps = sec.steps.filter(st => inSess(st, f));
      if (!steps.length) continue;
      out.push("Раздел " + sec.n + ". " + sec.title);
      for (const st of steps) {
        const c2 = cur(st.key);
        const mark = c2 && c2.s ? "[" + LABEL[c2.s] + "]" : "[не сделано]";
        const by = c2 && c2.who ? " · " + c2.who : "";
        out.push("  " + st.num + (f.sess ? "" : " (" + SESS_SHORT[st.sess] + ")") + " " + mark + " " + st.do + by);
        const n = c2 && (c2.note || "").trim();
        if (n) out.push("      заметка: " + n.replace(/\n/g, "\n      "));
      }
    }
    if (out.length) { lines.push("\nБЛОК «" + blk.title.toUpperCase() + "»"); lines.push(...out); }
  }
  return head.concat(lines).join("\n");
}
const report = $("report"), reportText = $("reportText");
$("copy").addEventListener("click", async () => {
  const text = buildReport();
  reportText.value = text; report.hidden = false;
  const hint = $("reportHint");
  try { await navigator.clipboard.writeText(text); hint.innerHTML = "<b>Скопировано.</b> Вставьте в чат Андрею. Если не вставляется, выделите текст ниже и копируйте вручную."; }
  catch (_) { hint.textContent = "Выделите текст ниже, зажмите и «Копировать», потом вставьте в чат."; }
  reportText.focus(); reportText.select();
});
$("reportClose").addEventListener("click", () => { report.hidden = true; });
</script>
</body></html>
