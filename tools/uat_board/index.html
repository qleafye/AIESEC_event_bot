<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Приёмка Юлид '26 · долг и новое</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Raleway:ital,wght@1,800&display=swap">
<style>
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --sunken:#EAEEF5;
  --ink:#151A21; --muted:#56606E; --faint:#8A93A1;
  --line:#DCE2EB; --line-soft:#E8ECF3;
  --accent:#037EF3; --accent-ink:#0163C0; --accent-soft:#E3F0FE;
  --warm:#F48924; --warm-soft:#FDEBD9;
  --ok:#12855A; --ok-soft:#E1F3EA; --bad:#CF3A24; --bad-soft:#FBE7E3; --skip:#8A6A00; --skip-soft:#FFF3CC;
  --role-m:#0163C0; --role-m-soft:#E3F0FE; --role-d:#B85C00; --role-d-soft:#FDEBD9; --role-v:#5B3FB8; --role-v-soft:#ECE6FA;
  --shadow:0 1px 2px rgba(21,26,33,.06);
  --font-h:"Raleway","Segoe UI",system-ui,sans-serif;
  --font-b:"Lato","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161C; --surface:#1A1F27; --sunken:#151A21;
  --ink:#E9EDF3; --muted:#A3ADBB; --faint:#7C8695;
  --line:#2A323D; --line-soft:#232A34;
  --accent:#4FA6F7; --accent-ink:#8CC5FA; --accent-soft:#16283C;
  --warm:#F9A44C; --warm-soft:#3A2812;
  --ok:#4FBF8E; --ok-soft:#142A22; --bad:#F0705A; --bad-soft:#2E1A17; --skip:#F0C24B; --skip-soft:#3A3114;
  --role-m:#8CC5FA; --role-m-soft:#16283C; --role-d:#F9A44C; --role-d-soft:#3A2812; --role-v:#B9A6F0; --role-v-soft:#261D3F;
  --shadow:0 1px 2px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --bg:#12161C; --surface:#1A1F27; --sunken:#151A21;
  --ink:#E9EDF3; --muted:#A3ADBB; --faint:#7C8695;
  --line:#2A323D; --line-soft:#232A34;
  --accent:#4FA6F7; --accent-ink:#8CC5FA; --accent-soft:#16283C;
  --warm:#F9A44C; --warm-soft:#3A2812;
  --ok:#4FBF8E; --ok-soft:#142A22; --bad:#F0705A; --bad-soft:#2E1A17; --skip:#F0C24B; --skip-soft:#3A3114;
  --role-m:#8CC5FA; --role-m-soft:#16283C; --role-d:#F9A44C; --role-d-soft:#3A2812; --role-v:#B9A6F0; --role-v-soft:#261D3F;
  --shadow:0 1px 2px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.5;
     -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;padding:0 0 96px;overflow-wrap:anywhere}
.wrap{max-width:52rem;margin:0 auto;padding:0 16px}
a{color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font-family:inherit}
[hidden]{display:none!important}

/* шапка */
header.top{padding:16px 0 0}
.plate{position:relative;overflow:hidden;background:var(--accent) url("/pattern.webp") -162px -324px / 1368px auto no-repeat;color:#fff;border-radius:18px;padding:22px 18px 18px}
.plate .eyebrow{color:#FFE1C2}
.eyebrow{font:700 11px/1 var(--font-b);letter-spacing:.14em;text-transform:uppercase;color:var(--warm)}
h1{font:italic 800 clamp(26px,7vw,40px)/1.04 var(--font-h);letter-spacing:-.02em;margin:10px 0 8px;text-wrap:balance;color:#fff}
.plate .lede{color:rgba(255,255,255,.9);margin:0;max-width:44rem}
.plate .meta{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:12px;font-size:14px;color:rgba(255,255,255,.85)}
.plate .meta b{color:#fff;font-weight:700}
.back{display:inline-block;margin:14px 0 0;font:700 13px/1 var(--font-b);color:var(--accent-ink);text-decoration:none}
.back:hover{text-decoration:underline}
.warn{display:flex;gap:12px;align-items:flex-start;margin:14px 0 0;padding:12px 14px;
      background:var(--bad-soft);border-left:3px solid var(--bad);border-radius:0 6px 6px 0}
.warn p{margin:0;font-size:14px}
.warn b{color:var(--bad)}
.tip{margin:12px 0 0;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.tip h2,.info summary h2{font:italic 800 15px/1.2 var(--font-h);margin:0 0 6px;color:var(--ink)}
.tip p{margin:0;font-size:14px;color:var(--muted)}
.tip.people p{margin-top:10px;color:var(--ink)}.tip.people p:first-of-type{margin-top:0}
.tip.people ul{margin:4px 0 0;padding-left:20px;font-size:14px;color:var(--muted)}.tip.people li{margin:3px 0}
.tip p + p{margin-top:6px}
.tip b{color:var(--ink)}
code,.tip code{font:700 13.5px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink);background:var(--sunken);border-radius:5px;padding:1px 5px}
.tip ul{margin:6px 0 0;padding-left:20px;font-size:14px;color:var(--muted)}
.tip li + li{margin-top:4px}

/* карточки сессий */
.cards{display:grid;gap:12px;margin-top:16px}
.card{display:block;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.card:hover{border-color:var(--accent)}
.card .ey{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.card .ey .eyebrow{color:var(--accent)}
.card .ey .when{font-size:13px;color:var(--faint);font-variant-numeric:tabular-nums}
.card h2{font:italic 800 20px/1.15 var(--font-h);margin:6px 0 4px;letter-spacing:-.01em;text-wrap:balance}
.card p{margin:0;color:var(--muted);font-size:14px}
.card .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip-s{font-size:12px;font-weight:700;color:var(--muted);background:var(--sunken);border-radius:6px;padding:3px 8px}
.card .prog{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.card .prog .t{flex:1}
.card.bl{border-style:dashed}
.card.done{border-color:var(--ok)}
.track{display:flex;height:6px;background:var(--sunken);border-radius:99px;overflow:hidden}
.track i{display:block;height:100%;width:0;transition:width .25s ease}
.track .t-ok{background:var(--ok)}.track .t-bad{background:var(--bad)}.track .t-skip{background:var(--skip)}

/* полоса прогресса сессии + фильтры */
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 6px;border-bottom:1px solid var(--line)}
.bar .pt{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;margin-bottom:6px}
.bar .pt b{color:var(--ink)}
.bar .pt .e{color:var(--bad)}
.sync{font-size:12px;color:var(--faint);margin-top:6px}
.sync.ok{color:var(--ok)}
.sync.bad{color:var(--bad)}
.under{padding-top:8px}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:30px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:99px;
      font:700 12.5px/1 var(--font-b);padding:7px 11px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.chip.r-M[aria-pressed="true"]{background:var(--role-m-soft);border-color:var(--role-m);color:var(--role-m)}
.chip.r-D[aria-pressed="true"]{background:var(--role-d-soft);border-color:var(--role-d);color:var(--role-d)}
.chip.r-V[aria-pressed="true"]{background:var(--role-v-soft);border-color:var(--role-v);color:var(--role-v)}
.filters .sep{flex-basis:100%;height:0}

/* блоки */
.info{margin:14px 0 0;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.info summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;align-items:center;gap:10px}
.info summary::-webkit-details-marker{display:none}
.info summary .ic{font-size:18px;line-height:1}
.info summary h2{margin:0;flex:1}
.info summary .tm{font-size:12.5px;color:var(--faint);white-space:nowrap}
.info summary::after{content:"▸";color:var(--faint);font-size:14px;transition:transform .15s}
.info[open] summary::after{transform:rotate(90deg)}
.info .ib{padding:0 14px 12px;font-size:14px;color:var(--muted)}
.info .ib p{margin:0 0 8px}
.info .ib b{color:var(--ink)}
.info.stuck{border-color:var(--warm)}
.info.stuck summary .ic{color:var(--warm)}
.roles{display:grid;gap:8px;margin:4px 0 10px}
.role{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:start;padding:10px 12px;background:var(--sunken);border-radius:10px}
.role p{margin:0;font-size:13.5px;color:var(--muted)}
.role p b{color:var(--ink)}
.who{display:inline-block;font:700 11px/1 var(--font-b);letter-spacing:.04em;text-transform:uppercase;border-radius:6px;padding:4px 7px;white-space:nowrap}
.who.M{color:var(--role-m);background:var(--role-m-soft)}
.who.D{color:var(--role-d);background:var(--role-d-soft)}
.who.V{color:var(--role-v);background:var(--role-v-soft)}
.who.A{color:var(--muted);background:var(--sunken)}

/* чек-лист «Перед началом» */
ol.pre{list-style:none;margin:0;padding:0}
ol.pre li{display:grid;grid-template-columns:auto auto 1fr;gap:6px 10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line-soft)}
ol.pre li:last-child{border-bottom:0}
.box{width:24px;height:24px;border:1.5px solid var(--line);border-radius:7px;cursor:pointer;display:grid;place-items:center;
     font:700 13px/1 var(--font-b);color:transparent;margin-top:1px;background:var(--surface)}
ol.pre li[data-s="ok"] .box{background:var(--ok);border-color:var(--ok);color:#fff}
ol.pre li[data-s="ok"] .do{color:var(--muted)}
ol.pre .txt p{margin:0}
ol.pre .do{font-weight:700;color:var(--ink);font-size:14px}
ol.pre .exp{color:var(--muted);font-size:13.5px;margin-top:2px}

/* разделы и шаги */
section.block{margin-top:28px}
.bh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding-bottom:8px;border-bottom:2px solid var(--ink)}
.bn{font:italic 800 13px/1 var(--font-h);letter-spacing:.06em;color:var(--accent);font-variant-numeric:tabular-nums}
.bh h2{font:italic 800 20px/1.15 var(--font-h);letter-spacing:-.01em;margin:0;flex:1 1 auto;text-wrap:balance}
.bt{font-size:13px;color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap}
.cnt{font:700 12px/1 var(--font-b);color:var(--muted);background:var(--sunken);border-radius:6px;padding:5px 8px;font-variant-numeric:tabular-nums}
.cnt.all{color:var(--ok);background:var(--ok-soft)}
.cnt.has-bad{color:var(--bad);background:var(--bad-soft)}
.bmeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;font-size:12.5px}
.bmeta span{color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:3px 8px}
.bmeta span.opt{color:var(--skip);border-color:var(--skip);background:var(--skip-soft)}
.bnote{color:var(--muted);font-size:14px;margin:10px 0 0}
.bnote b{color:var(--ink)}
.soon{margin-top:10px;padding:14px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);font-size:14px;background:var(--surface)}

ol.steps{list-style:none;margin:6px 0 0;padding:0}
li.step{padding:14px 0;border-bottom:1px solid var(--line-soft)}
li.step:last-child{border-bottom:0}
.sh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px}
.id{font:700 12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--faint);font-variant-numeric:tabular-nums}
.pair{font-size:11.5px;font-weight:700;color:var(--warm);background:var(--warm-soft);border-radius:6px;padding:3px 7px}
.txt p{margin:0}
.txt .do{font-weight:700}
.txt .exp{color:var(--muted);font-size:14px;margin-top:4px}
.txt .exp::before{content:"Должно появиться: ";color:var(--faint);font-weight:700}
li.step[data-s="ok"] .txt .do{color:var(--muted)}
q.ui{quotes:none;display:inline;background:var(--sunken);border-radius:5px;padding:1px 5px;font-weight:700;color:var(--ink);font-size:.95em}
.exp q.ui{font-weight:700;color:var(--ink)}
.ar{color:var(--faint)}
.ctl{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.mk{min-height:40px;border:1px solid var(--line);background:var(--surface);border-radius:9px;cursor:pointer;
    font:700 13px/1 var(--font-b);color:var(--muted);padding:0 11px;display:inline-flex;align-items:center;gap:5px}
.mk:hover{border-color:var(--accent)}
.mk.nb{width:40px;justify-content:center;padding:0;font-size:16px}
.mk.nb.has{border-color:var(--accent);background:var(--accent-soft)}
li.step[data-s="ok"] .mk.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
li.step[data-s="bad"] .mk.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
li.step[data-s="skip"] .mk.skip{background:var(--skip-soft);border-color:var(--skip);color:var(--skip)}
.note{width:100%;margin-top:8px;font:400 14px/1.45 var(--font-b);color:var(--ink);background:var(--sunken);
      border:1px solid var(--line);border-radius:8px;padding:9px 10px;resize:vertical;min-height:62px}
.note::placeholder{color:var(--faint)}
.by{font-size:12px;color:var(--faint);margin-top:5px;font-variant-numeric:tabular-nums}
.empty{margin:20px 0;padding:14px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);text-align:center}

footer.end{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);color:var(--faint);font-size:13px}

/* низ: имя + отчёт */
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
      padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:6;box-shadow:0 -4px 14px rgba(0,0,0,.06)}
.dock .row{max-width:52rem;margin:0 auto;display:flex;gap:8px;align-items:center}
.whoin{flex:1 1 120px;min-width:0;font:400 14px/1 var(--font-b);color:var(--ink);background:var(--bg);
     border:1px solid var(--line);border-radius:9px;padding:12px 10px}
.btn{font:700 14px/1 var(--font-b);color:#fff;background:var(--accent);border:1px solid var(--accent);
     border-radius:9px;padding:13px 14px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--accent-ink)}
.report{position:fixed;left:0;right:0;bottom:66px;max-height:62vh;background:var(--surface);border-top:1px solid var(--line);
        box-shadow:0 -6px 18px rgba(0,0,0,.1);z-index:5;padding:12px 16px}
.report .in{max-width:52rem;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.report .hd{display:flex;justify-content:space-between;align-items:center}
.report h2{font:italic 800 15px/1 var(--font-h);margin:0}
.report .x{min-height:32px;min-width:32px;border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:8px;cursor:pointer}
.report p{font-size:12.5px;color:var(--faint);margin:0}
.report p b{color:var(--ok)}
#reportText{width:100%;min-height:160px;max-height:40vh;border:1px solid var(--line);border-radius:10px;background:var(--bg);
        color:var(--ink);font:12px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace;padding:10px;resize:vertical}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--bg);
       font-size:13px;padding:9px 14px;border-radius:9px;opacity:0;pointer-events:none;transition:all .2s;z-index:7;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%)}

@media (max-width:520px){
  .mk{padding:0 9px;font-size:12.5px}
  .plate{padding:18px 14px 14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* два блока верхнего уровня и раскрывающиеся разделы */
section.blk{margin-top:30px}
.blkh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;background:var(--accent-soft);border-left:4px solid var(--accent);border-radius:0 12px 12px 0}
.blkh .bi{font-size:22px;line-height:1}
.blkh h2{font:italic 800 24px/1.1 var(--font-h);letter-spacing:-.01em;margin:0;flex:1 1 auto;color:var(--ink)}
.blkl{color:var(--muted);font-size:14px;margin:10px 0 0}
details.sec{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
details.sec>summary{list-style:none;cursor:pointer;display:block;padding:12px 14px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec .bh{border-bottom:0;padding-bottom:0;flex-wrap:wrap}
details.sec .bh h2{font-size:17px;flex:1 1 12rem}
details.sec .chev{color:var(--faint);font-size:14px;transition:transform .15s}
details.sec[open] .chev{transform:rotate(90deg)}
details.sec[open]>summary{border-bottom:1px solid var(--line-soft)}
details.sec>.bnote{padding:0 14px}
details.sec>ol.steps{padding:0 14px;margin:0}
.stag{display:inline-block;font:700 11.5px/1 var(--font-b);color:var(--accent-ink);background:var(--accent-soft);border:1px solid transparent;border-radius:6px;padding:4px 7px;white-space:nowrap}
.bmeta .stag{color:var(--accent-ink);background:var(--accent-soft);border-color:transparent;padding:4px 7px}
.stag.s-bl{color:var(--muted);background:var(--sunken)}
.bmeta .stag.s-bl{color:var(--muted);background:var(--sunken)}
li.subh{padding:14px 0 4px;border-bottom:0;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:14px}
li.subh b{font:italic 800 15px/1.2 var(--font-h)}
li.subh .sm{flex-basis:100%;font-size:12.5px;color:var(--faint)}
li.subh + li.step{padding-top:8px}
.sessinfo{margin-top:12px}
.sessinfo .tip{margin-top:0}
.cards{grid-template-columns:1fr}
@media (min-width:700px){.cards{grid-template-columns:1fr 1fr}}

/* отметка агента-тестировщика, «только руками» и блок «Регресс» */
.handtag{font-size:11.5px;font-weight:700;color:var(--role-v);background:var(--role-v-soft);border-radius:6px;padding:3px 7px;white-space:nowrap}
.agent{font-size:12px;color:var(--accent-ink);margin-top:5px;font-variant-numeric:tabular-nums}
.agent .an{color:var(--faint)}
.bar .left{font-size:13px;color:var(--muted);margin:-2px 0 6px;font-variant-numeric:tabular-nums}
.bar .left b{color:var(--ink)}
details.reg{margin:10px 14px 12px;background:var(--sunken);border:1px solid var(--line-soft);border-radius:10px}
details.reg>summary{list-style:none;cursor:pointer;padding:10px 12px;font:700 13px/1.3 var(--font-b);color:var(--muted);display:flex;align-items:center;gap:8px}
details.reg>summary::-webkit-details-marker{display:none}
details.reg>summary::after{content:"▸";margin-left:auto;color:var(--faint);transition:transform .15s}
details.reg[open]>summary::after{transform:rotate(90deg)}
details.reg>ol.steps{padding:0 12px}

/* ───── вкладки по людям, «Как начать», «Сначала это» ───── */
.who.O{color:var(--role-v);background:var(--role-v-soft)}
.info.start{border-color:var(--accent)}
.info.start summary .ic{color:var(--accent)}
ol.how{margin:4px 0 8px;padding:0;list-style:none;counter-reset:how}
ol.how li{counter-increment:how;position:relative;padding:9px 0 9px 36px;border-bottom:1px solid var(--line-soft);font-size:14.5px;line-height:1.5;color:var(--ink)}
ol.how li:last-child{border-bottom:0}
ol.how li::before{content:counter(how);position:absolute;left:0;top:9px;width:26px;height:26px;border-radius:99px;background:var(--accent);color:#fff;font:700 13px/26px var(--font-b);text-align:center}
ol.how a{font-weight:700}
.info.start .who-today{margin:10px 0 4px;color:var(--ink)}
.info.start ul{margin:4px 0 0;padding-left:20px;font-size:14px;color:var(--muted)}
.info.start ul li{margin:3px 0}
.tabs{display:flex;gap:6px;margin-bottom:6px}
.tab{flex:1 1 0;min-width:0;min-height:48px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);border-radius:12px;
     font:700 14px/1.15 var(--font-b);padding:5px 3px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.tab small{font:700 11.5px/1 var(--font-b);color:var(--faint);font-variant-numeric:tabular-nums}
.tab[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.tab.t-D[aria-pressed="true"]{background:var(--role-d-soft);border-color:var(--role-d);color:var(--role-d)}
.tab.t-M[aria-pressed="true"]{background:var(--role-m-soft);border-color:var(--role-m);color:var(--role-m)}
.tab.t-O[aria-pressed="true"]{background:var(--role-v-soft);border-color:var(--role-v);color:var(--role-v)}
.tab[aria-pressed="true"] small{color:inherit}
.bar .pt{font-size:14px}
.tabnote{margin:10px 0 0;padding:10px 12px;font-size:13.5px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:10px}
.tabnote:empty{display:none}
.pick{margin:20px 0;padding:18px 14px;border:2px dashed var(--accent);border-radius:12px;color:var(--ink);text-align:center;background:var(--accent-soft)}
.info.more{margin-top:10px}
.sutag{font-size:11.5px;font-weight:700;color:var(--role-v);background:var(--role-v-soft);border-radius:6px;padding:3px 7px}
.seclab{display:none;font-size:11.5px;font-weight:700;color:var(--muted);background:var(--sunken);border-radius:6px;padding:3px 7px}
#topol .seclab{display:inline-block}
details.topgrp{border-color:var(--warm)}
details.topgrp .bn{font-size:18px;font-style:normal}
li.step.cue{padding:6px 0 6px 10px;border-left:3px solid var(--line);opacity:.8}
li.step.cue .ctl,li.step.cue .exp,li.step.cue .note,li.step.cue .by,li.step.cue .agent,li.step.cue .id,li.step.cue .handtag,li.step.cue .pair,li.step.cue .sutag{display:none}
li.step.cue .txt .do{font-weight:400;font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mk{min-height:44px}
@media (max-width:520px){
  .tab{font-size:13px}
  .ctl .mk{flex:1 1 auto;justify-content:center}
  .ctl .mk.nb{flex:0 0 44px}
}

.info.start .lead{margin:0 0 10px;color:var(--ink);font-size:14.5px}
.person{margin:12px 0;padding:12px 12px 4px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface)}
.person h3,h3.common{font:italic 800 16px/1.25 var(--font-h);margin:0 0 6px;color:var(--ink)}
h3.common{margin-top:16px}
.person.p-D{border-color:var(--role-d);background:var(--role-d-soft)}
.person.p-M{border-color:var(--role-m);background:var(--role-m-soft)}
.person.p-O{border-color:var(--role-v);background:var(--role-v-soft);padding-bottom:8px}
.person p{margin:0;color:var(--ink);font-size:14px}
.person ol.how li{border-bottom-color:rgba(128,128,128,.25)}
.tog{font-size:11.5px;font-weight:700;color:var(--ok);background:var(--ok-soft);border-radius:6px;padding:3px 7px;white-space:nowrap}
.tog.show{display:inline-block}
.syncw,.syncs{margin:6px 0 0;padding:8px 10px;border-radius:8px;font-size:13.5px;font-weight:700}
.syncw{background:var(--skip-soft);color:var(--skip);border-left:3px solid var(--skip)}
.syncs{background:var(--accent-soft);color:var(--accent-ink);border-left:3px solid var(--accent)}
li.step.cue .syncw,li.step.cue .syncs{display:none}
.tab .pn{font-weight:700;color:inherit;opacity:.85}
</style>
</head>
<body>
<div class="wrap" id="root"></div>

<div class="report" id="report" hidden>
  <div class="in">
    <div class="hd"><h2>Отчёт для копирования</h2><button class="x" id="reportClose" type="button" aria-label="Закрыть">✕</button></div>
    <p id="reportHint">Текст выделен. Зажми и «Копировать», потом вставь в чат.</p>
    <textarea id="reportText" readonly></textarea>
  </div>
</div>

<div class="dock">
  <div class="row">
    <input type="text" class="whoin" id="who" placeholder="Кто проверяет (имя)" autocomplete="name" maxlength="60">
    <button class="btn" id="copy" type="button">Отчёт</button>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>

  V: { name: "Волонтёр", hint: "третий аккаунт со сканером. Если третьего человека нет, его шаги делает менеджер: у менеджера сканер тоже есть, только сначала просит выбрать город." },
  O: { name: "Владелец", hint: "аккаунт с полным доступом (суперадмин): его выдаёт только Андрей." },
  A: { name: "Все", hint: "" },

const STUCK = [
  "Бот завис или вы потерялись: делегат пишет боту /start, менеджер пишет /admin.",
  "Не помогло: напишите Андрею в Телеграм, @qleafye (https://t.me/qleafye). Приложите скриншот экрана бота и номер шага с этой страницы.",
  "Шаг не получается: нажмите «⏭ Пропуск» и идите дальше. Не ждите ответа, вернётесь к нему позже.",
  "Бот молчит на /uat: вас нет в списке тестеров. Напишите Андрею свой @юзернейм.",

  "Пропали права менеджера после /uat: значит /uat запустили на аккаунте менеджера. Напишите Андрею, он вернёт.",

const SESSIONS = [
{ key:"s1", n:1, when:"вт 06.10 · 21:00 МСК", title:"День форума", time:"≈90 мин", people:"2–3 человека (можно одному с двумя аккаунтами)",
  lede:"Всё, что понадобится на площадке: QR-пропуск делегату, сканер у волонтёра на входе и на сессиях, отказы и предупреждения, регистрация на месте у стойки, SOS, программа и приглашение волонтёров ссылкой. Город проверки — Санкт-Петербург, его форум на стенде «идёт сегодня».",

    {id:"acc", who:"A", do:"Аккаунты на эту сессию. Менеджер: /uat не трогает, нужна полная админка от Андрея. Делегат: /uat → «🎟 Одобрен на форум — с QR-пропуском» → «Санкт-Петербург…» → «Делегат — без ролей» (пункт 4). Волонтёр, если вас трое: /uat → «🆕 Новичок — анкеты нет» → «🎗 Волонтёр входа (сканер)» → «Санкт-Петербург…» (пункт 5). Вы одна или один с двумя аккаунтами: первый аккаунт менеджер, второй делегат, шаги волонтёра делает менеджер.", exp:"Каждый знает, какой аккаунт за кого. В разделах «Отказы на входе» и «Регистрация на месте» делегат ещё несколько раз переставит себя через /uat: так задумано, шаги пишут, что выбрать."},
    {id:"2", who:"A", do:"За 10 минут до начала пришлите Андрею (@qleafye) свои @юзернеймы в Телеграме: он добавит вас в список тех, кому отвечает /uat.", exp:"Андрей ответил, что добавил. До этого бот на /uat молчит."},

    {id:"4", who:"M", do:"Ещё раз «📤 Разослать QR сейчас — Санкт-Петербург…».", exp:"Всплывает «Отправлять некому — все одобренные уже получили QR.» Ничего не ушло."},
    {id:"5", who:"M", do:"Вверху /admin выберите «🌍 Все города», потом нажмите по очереди: «📋 Заявки» → «✅ Отметки на форуме» → «📤 Разослать QR сейчас — Москва…».", exp:"Всплывает «Форум этого города 30.10.2026 — рассылать QR рано. Он уйдёт сам накануне вечером; вручную — не раньше чем накануне форума.» Ничего не ушло."},

    {id:"3", who:"D", do:"Нажмите по очереди: «Не нашёл ответ — спросить менеджера» → пришлите стикер → напишите «Тестовый вопрос: во сколько сбор?».", exp:"«Напиши свой вопрос, и мы передадим его организаторам.» с кнопкой «Отмена». На стикер: «Пожалуйста, отправь вопрос текстом.». На текст: «Твой вопрос отправлен!» и меню."},
    {id:"4", who:"M", do:"В личке найдите «❓ Новый вопрос от …» и ответьте на него через «Ответить»: «Сбор в 9:00 у главного входа».", exp:"В карточке «🧾 Вопрос #N» и подсказка «↩️ Ответьте reply'ем на это сообщение, чтобы отправить ответ.». Ответ ушёл без ошибки."},
    {id:"5", who:"D", do:"Дождитесь ответа.", exp:"«💬 Ответ от организаторов:» и текст «Сбор в 9:00 у главного входа»."},
    {id:"6", who:"D", do:"Нажмите «🔗 Моя реферальная ссылка», потом «👥 Мои приглашённые».", exp:"«Отправь эту ссылку друзьям, чтобы пригласить их на форум!» и ссылка. Приглашённые: «Пока никто не зарегистрировался по твоей ссылке.» и та же ссылка."},

  { key:"app", title:"Приложение: анкета и главный экран", time:"12 мин", need:"делегат + менеджер (одобрить)", steps:[
    {id:"1", who:"D", do:"Напишите боту /uat и нажмите по очереди: «🆕 Новичок — анкеты нет» → «Делегат — без ролей» → «✅ Сбросить и засеять» → /start → «🇷🇺 Русский» → кнопка «📱 Заполнить в приложении».", exp:"При первом запуске экран «Привет!» со слоганом «Делаешь задания — получаешь монеты.», заголовком «Как это работает» и кнопкой «Погнали». После него главный экран с ОДНОЙ плиткой «Анкета» либо сразу первый вопрос анкеты. Нижних вкладок в приложении нет: так задумано."},
    {id:"2", who:"D", do:"Откройте «Анкета» (если не открылась сама), ответьте на первый вопрос.", exp:"Наверху «Шаг 1 из M». После ответа у полосы прогресса пометка «Черновик сохранён»."},
    {id:"3", who:"D", do:"На возрасте впишите 5 и нажмите «Дальше». Потом 17.", exp:"Под вопросом подсказка «Число от 10 до 120, например «19».». С 5 мастер стоит и показывает «Укажи корректный возраст числом от 10 до 120.». С 17 уходит дальше."},
    {id:"4", who:"D", do:"На вопросе про город напечатайте «зззз», потом сотрите и напечатайте начало настоящего города, нажмите подсказку.", exp:"Под полем «Начни вводить — подскажем. Например: «спб», «вшэ», «политех».». На «зззз»: «Ничего не нашли по запросу «зззз»». Один тап по подсказке переводит на следующий вопрос."},
    {id:"5", who:"D", do:"На карточке «Образование» выключите переключатель наверху, выберите плитку, нажмите «Дальше». Вернитесь «Назад», включите переключатель обратно.", exp:"Переключатель «Сейчас учусь здесь» первый элемент карточки. После выключения две плитки: «Нет, завершил(а) обучение» и «Нет, не получал(а) образование»; пока ни одна не выбрана, «Дальше» не нажимается. С включённым переключательом вуз, курс и программа появляются внутри карточки."},
    {id:"6", who:"D", do:"На вопросе «Резюме» нажмите «📎 Загрузить файл» и выберите .txt, потом PDF.", exp:"Три кнопки: «📎 Загрузить файл», «🔗 Дать ссылку», «🙅 У меня нет резюме». На .txt: «Резюме принимается как PDF или DOCX — другой формат не подойдёт.». PDF грузится сразу и переводит дальше."},
    {id:"7", who:"D", do:"Закройте приложение крестиком посреди анкеты. Откройте снова.", exp:"Мастер открывается на том же шаге с теми же ответами, наверху «Черновик сохранён»."},
    {id:"8", who:"D", do:"Дойдите до обзора и нажмите «Отправить заявку», потом «На главную».", exp:"Обзор «Почти всё» / «Проверь перед отправкой» со строкой «N из M заполнено, K необязательных пропущено.». После отправки экран «Заявка принята»: «Спасибо! Мы всё получили — подробности пришли в чат с ботом.». В чат пришло «Поздравляем, твоя заявка принята!…». На главной плита «⏳ Анкета на проверке», плитка «Анкета» со значением «Новая», плиток «Задания» и «Монеты» пока нет."},
    {id:"9", who:"M", do:"Нажмите по очереди: «📋 Заявки» → «📋 Заявки» → «✅ Одобрить».", exp:"Всплывает «Одобрено». Делегату в чат пришло письмо об одобрении."},
    {id:"10", who:"D", do:"Откройте приложение, нажмите на плитку статуса (или «Анкета»).", exp:"Главный экран одобренного: плита «Твой баланс», раздел «Разделы», у «Анкета» значение «Одобрена». Экран статуса: «Заявка одобрена» / «Ты в деле, Имя!», при выключенной оплате «Ждём тебя <дата> в <город>.» и шаги «Следи за новостями в боте», «Позови друзей». Нет обрывков вроде «в .»."},
  ]},
  { key:"bcast", title:"Рассылки и опросы", time:"15 мин", need:"менеджер + делегат", steps:[
    {id:"1", who:"M", do:"Нажмите по очереди: «📢 Общение» → «📢 Рассылка».", exp:"«Выберите целевую аудиторию рассылки:» и кнопки «📢 Все пользователи», «📄 По файлу в проекте», «🚫 Не подписаны на канал», «📝 Не завершили регистрацию», «🎯 По фильтру», «🕓 Запланировать», «🗒 Последние рассылки», «⏰ Запланированные», «❌ Отмена»."},
    {id:"2", who:"M", do:"Нажмите по очереди: «📢 Все пользователи» → текст «Проверка: обычная» → «✅ Отправить N пользователям».", exp:"Перед отправкой копия сообщения и «Отправить это N пользователям?» с кнопками «✅ Отправить N пользователям», «❗ Отметить как важное», «❌ Отмена». После: «📨 Отправлено X из N…» с «⛔ Остановить», потом «Рассылка завершена. ✅ Отправлено …»."},

    {id:"4", who:"M", do:"Ещё две рассылки всем: обычная «Проверка: обычная 2» и важная «Проверка: важное» (на подтверждении нажмите «❗ Отметить как важное»).", exp:"Кнопка стала «✅ Отмечено как важное». В отчёте обычной рассылки строка «🔕 Не отправлено (выключили уведомления на сегодня): 1»."},
    {id:"5", who:"D", do:"Посмотрите чат, отправьте /start, нажмите «❗ Важное». Потом под первой рассылкой нажмите «🔔 Присылать всё».", exp:"Пришла только «Проверка: важное», первая строка «❗ Важно», кнопки 🔕 под ней нет. В меню «❗ Важное» → «❗ Важные рассылки за сегодня:», время и текст. После «🔔 Присылать всё»: «🔔 Хорошо, снова присылаю все рассылки.»"},
    {id:"6", who:"M", do:"Нажмите по очереди: «📢 Рассылка» → «🎯 По фильтру» → «🏙 Город мероприятия» → «Санкт-Петербург…» → «📊 Показать и отправить» → «🕓 Запланировать» → время через 3 минуты в формате ДД.ММ.ГГГГ ЧЧ:ММ → текст «Проверка: по расписанию» → «🗓 Запланировать».", exp:"«🎯 Рассылка по фильтру», потом «Под фильтр попадает N пользователей.» с кнопками «📨 Отправить сейчас» / «🕓 Запланировать». На прошедшее время: «❌ Это время уже прошло. Введите будущую дату.». В конце «✅ Рассылка #N запланирована на … (по фильтру). Управление: /scheduled». В «⏰ Запланированные» она есть с кнопкой «❌ Отменить»."},
    {id:"7", who:"D", do:"В назначенную минуту посмотрите чат.", exp:"Пришла «Проверка: по расписанию»."},
    {id:"8", who:"M", do:"Нажмите по очереди: «📢 Рассылка» → «🗒 Последние рассылки» → карточка «Проверка: обычная 2» → «🗑 Удалить у получателей» → подтвердить.", exp:"«Сообщение удалится у N человек. Вернуть нельзя. Удалить?». После: карточка «🗑 Удалена у получателей.». У делегата сообщение исчезло молча."},
    {id:"9", who:"M", do:"Нажмите по очереди: «📢 Общение» → «📊 Опросы» → «➕ Новый опрос»: вопрос «Пиццу или суши?», варианты «Пиццу; Суши», «✅ Готово», «Дальше ➡️», «✅ Только одобренные», «🚀 Отправить сейчас». Делегат голосует; откройте опрос в списке.", exp:"Шаги подписаны «Шаг 1 из 4» … «Шаг 4 из 4», перед отправкой превью и «Кому: … — N чел.». Отчёт «📊 Опрос #N отправлен. ✅ Доставлено …». Делегату приходит обычный опрос, после голоса бот ничего не пишет. В карточке опроса счётчик голосов 1 и кнопки «⏹ Закрыть опрос», «📄 В таблицу»."},
  ]},
  { key:"past", title:"Делегат прошлого сезона", time:"5 мин", need:"менеджер меняет сезон стенда, делегат проверяет; в конце вернуть как было", steps:[

    {id:"3", who:"O", do:"Верните «🎉 Сезон события» к записанному значению.", exp:"Поле снова показывает прежний сезон. Без этого следующие сессии пойдут по чужому сезону."},

  { key:"ext", title:"Внешние формы (Google Форма)", time:"10 мин", need:"менеджер + делегат; Google Форма (пункт 8 подготовки) и личная Яндекс Форма с файлом выгрузки (пункт 10). Вход через Яндекс на тестовом боте не настроен: личная форма подключается без него", steps:[

    {id:"2", who:"M", do:"Нажмите по очереди: «➕ Подключить Яндекс Форму», затем «Отмена».", exp:"Бот просит ссылку на форму и пишет «Жду ссылку. Передумали — нажмите «Отмена».». Весь путь Яндекс Формы проходим в шагах 9–13, после Google Формы."},
    {id:"3", who:"M", hand:true, do:"Нажмите «➕ Подключить Google Форму». Дайте указанному в инструкции адресу доступ «Читатель» к таблице ответов вашей формы и пришлите ссылку на таблицу.", exp:"Инструкция «Как подключить Google Форму: 1. … 2. «Настройки доступа» → добавьте адрес … с ролью «Читатель». 3. Пришлите сюда ссылку на эту таблицу.» и «Жду ссылку. Передумали — нажмите «Отмена».». После ссылки «Ссылка принята.» и экран «📋 Название формы / Как найти человека среди делегатов: / Ник в Telegram — вопрос «…» / Телефон — …» с кнопками «✅ Верно», «✏️ Другой вопрос для ника», «✏️ Другой вопрос для телефона». Если доступ не дан: «Дайте доступ к таблице ответов для … с ролью «Читатель» и пришлите ссылку ещё раз»."},
    {id:"4", who:"M", hand:true, do:"Нажмите по очереди: «✅ Верно» → «📋 Выбрать вкладку» → «➕ Новая вкладка «…»».", exp:"«✅ Форма подключена, подтянуто ответов: N.» и «Осталось выбрать вкладку для копии.». Экран «Куда складывать копию ответов? Лучше завести новую вкладку. …». После выбора «Вкладка создана». В таблице тестового бота появилась вкладка."},
    {id:"5", who:"D", hand:true, do:"Заполните Google Форму, в поле ника впишите свой @юзернейм. Подождите до 5 минут.", exp:"Менеджеру пришло «📝 +1 ответ в «Название формы»»."},
    {id:"6", who:"M", hand:true, do:"Напишите боту /find @ник делегата → «📝 Ответы форм».", exp:"В карточке строка «📝 Формы: Название ✓» и кнопка «📝 Ответы форм». Ответы приходят отдельным сообщением «📝 Название · дата / Анкета 1 из 1»."},
    {id:"7", who:"M", hand:true, do:"Нажмите по очереди: «📢 Рассылка» → «🎯 По фильтру» → «📝 Внешняя форма» → ваша форма → «✅ Заполнил» → «📊 Показать и отправить» → «❌ Отмена».", exp:"«📝 Какая форма? Затем выберите, кому писать — заполнившим или нет.», потом «📝 «Название» — кому писать?» с «✅ Заполнил» / «❌ Не заполнил». В сводке «Внешняя форма = Название: заполнил», под фильтр попадает 1."},
    {id:"8", who:"M", hand:true, do:"Карточка формы → «⏸ Поставить на паузу», потом «⛔ Отключить» → «⛔ Да, отключить».", exp:"Карточка: «Состояние: принимает ответы», «Ответов: 1», «Вкладка таблицы: …». На паузу: «Приём ответов на паузе.». Перед отключением «⛔ Отключить форму «Название»?» и «Новые ответы перестанут приниматься. Собранные 1 анкет останутся в боте и в таблице.». После: «Форма отключена. Собранное осталось.»"},
    {id:"9", who:"M", hand:true, do:"Нажмите по очереди: «📊 Данные» → «📝 Внешние формы» → «➕ Подключить Яндекс Форму» → пришлите ссылку на личную Яндекс Форму из подготовки (пункт 10).", exp:"Бот объясняет, что форма в личном аккаунте (или что вход через Яндекс не подключён) и что ответы может присылать интеграция формы. Кнопки «📮 Это личная форма — ответы пришлёт интеграция» и «🔑 Войти через Яндекс»."},
    {id:"10", who:"M", hand:true, do:"Нажмите по очереди: «📮 Это личная форма — ответы пришлёт интеграция» → «Оставить «Яндекс Форма»» (или пришлите своё название).", exp:"«✅ Форма подключена. Ответы будут приходить через интеграцию формы.» и список «Осталось: 1) «🔗 Адрес и инструкция» … 2) «📥 Загрузить старые ответы» … 3) выбрать вкладку для копии.» В карточке формы строка «Режим: личная форма — ответы присылает интеграция формы»."},
    {id:"11", who:"M", hand:true, do:"Нажмите «🔗 Адрес и инструкция». В Яндекс Форме: «Интеграции» → «API» → «Запрос JSON-RPC POST», вставьте адрес из бота и добавьте параметры: answer_id = переменная «ID ответа»; answers = «Ответы на вопросы» (все вопросы, формат JSON); created = «Время отправки ответа». Сохраните.", exp:"Инструкция в боте начинается со слов «Эта форма в личном аккаунте Яндекса — бот не может читать её сам, ответы присылает интеграция формы. Один раз настройте её:» и перечисляет те же параметры. Интеграция в форме сохранилась."},
    {id:"12", who:"D", hand:true, do:"Заполните Яндекс Форму ещё раз, в поле ника ваш @юзернейм. Подождите минуту.", exp:"В карточке формы «Ответов» стало на 1 больше. В Яндекс Форме «Интеграции» → «Выполненные интеграции»: запрос со статусом «Успешно». Если в карточке написано «Последний запрос от Яндекса пришёл без ответов», значит параметр answers настроен не так."},
    {id:"13", who:"M", hand:true, do:"Карточка формы → «🔑 Вопросы ника и телефона» → «✏️ Вопрос для ника» → «Ник в Telegram». Потом «📥 Загрузить старые ответы» → пришлите файл XLSX из подготовки документом.", exp:"Строки «Ник в Telegram — вопрос «Ник в Telegram»», «Телефон — не выбран». После файла «📥 Готово: добавлено N, уже были M, без ID ответа 0.» Ответ, который уже пришёл через интеграцию, не задвоился. /find @ник делегата показывает «📝 Формы»."},
  ]},
  { key:"deleg", title:"Делегации вузов", time:"25 мин", need:"менеджер + два делегата (два аккаунта с @юзернеймами; можно один аккаунт по очереди через /uat); Google Форма «Делегации вузов» из подготовки (пункт 9), подключённая в «📝 Внешние формы» так же, как форма в разделе «Внешние формы» (шаг 3 и «✅ Верно»; вкладку для копии на шаге 4 не выбирайте — лист для этой формы задаётся в шаге 5 раздела делегаций); вкладка «UR REGS» в таблице стенда уже создана; у делегата открывается приложение стенда; у менеджера — веб-дашборд стенда", steps:[
    {id:"1", who:"M", do:"Нажмите по очереди: «📋 Заявки» → «🏫 Делегации».", exp:"Заголовок «🏫 Делегации вузов». Если форма ещё не выбрана: «Форма делегаций не выбрана. Нажмите «📝 Выбрать форму» — список подключённых форм из «📝 Внешние формы».» и кнопка «📝 Выбрать форму». Если «Ни одна форма ещё не подключена»: сначала пройдите раздел «Внешние формы»."},
    {id:"2", who:"M", hand:true, do:"Нажмите по очереди: «📝 Выбрать форму» → ваша Google Форма делегаций.", exp:"«Проверьте вопросы формы — по ним бот узнаёт делегата:» и строки «ФИО — вопрос «…»», «Вуз — вопрос «…»», «Курс — вопрос «…»», «Ник в Telegram — вопрос «…» (из настроек формы)». Кнопки «✅ Верно», «✏️ Другой вопрос для ФИО», «✏️ Другой вопрос для вуза», «✏️ Другой вопрос для курса»."},
    {id:"3", who:"M", hand:true, do:"Если вопросы определены верно, нажмите «✅ Верно».", exp:"Всплывает «Вопросы сохранены, разбираю ответы формы…». Экран «🏫 Делегации вузов» со строкой «В форме: N · ЦА: N · не ЦА: N · проверить: N · зашли в бота: N · пришли: N» и строкой «⏸ Не включено — бот пока никого не одобряет и никому не пишет. …» и кнопками «✅ Включить делегации», «❔ Проверить курс (N)», «⏳ Не зашли (N)», «🏫 По вузам», «📋 Лист UR REGS», «🎮 Геймификация для делегатов: ☐», «📅 Отсечка ЦА: ДД.ММ.ГГГГ», «🎓 Курсы не ЦА: 1, 2», «✏️ Тексты делегату», «❓ Вопросы формы», «📝 Сменить форму»."},
    {id:"4", who:"M", hand:true, do:"Нажмите «🏫 По вузам».", exp:"«🏫 По вузам», по строке на вуз: «<вуз> — ЦА N · в боте N · пришли N», внизу «Всего вузов: N». Если ответов ещё нет: «Пока ни одного ответа ЦА в форме.»"},
    {id:"5", who:"M", hand:true, do:"Вернитесь на экран делегаций → «📋 Лист UR REGS» → вкладка «UR REGS».", exp:"«🔍 Сверка с листом «UR REGS»»: «В листе строк: N», «Узнал по ID ответа: N», «Добавлю новых: N», «Шапка A–L: ✅ совпадает с вопросами формы», «Колонка M: ✅ свободна» (или «✅ уже «В боте»»). Кнопка «✅ Включить запись в «UR REGS»»."},
    {id:"6", who:"M", hand:true, do:"Нажмите по очереди: «✅ Включить запись в «UR REGS»» → «✅ Да, включить». Затем на экране делегаций «✅ Включить делегации» → «✅ Включить».", exp:"Перед включением: «Бот начнёт писать в лист «UR REGS»: • обновит N строк (колонки D–M), • добавит N новых строк после последней заполненной, • покрасит не-ЦА серым, зелёные строки и колонки P и правее не тронет. Включить?». После: всплывает «Запись включена, в очереди N строк», на экране «📋 Лист: «UR REGS» · запись включена». Затем «🏫 Включить делегации?» с текстом «Бот одобрит N человек, которые уже есть в боте, и отправит им приветствие. …» (или «Сейчас в боте нет никого из ЦА этой формы. …»). После «✅ Включить» всплывает «Делегации включены — одобряю и пишу делегатам…», на экране строка «▶️ Включено — бот одобряет делегатов из формы и пишет им приветствие.» Пока не включено, делегаты в шагах 7–9 сообщения не получат."},
    {id:"7", who:"D", hand:true, do:"Сначала заполните Google Форму делегаций: вуз «Тестовый университет», курс «Магистратура, 1 курс», в поле ника ваш @юзернейм. Подождите до 5 минут, потом /uat → «🆕 Новичок — анкеты нет» → /start.", exp:"Приходит «Привет! Ты в списке делегации Тестовый университет на форум Юлид в Москве 🎉 Анкету заполнять не нужно — заявка уже одобрена. Ниже меню участника: там будет QR на вход и все новости форума.» и обычное меню одобренного делегата. Вопросов анкеты нет. «🎟 Мой QR» открывает QR, если вход по QR включён."},
    {id:"8", who:"D", hand:true, do:"Второй делегат (или тот же после /uat → «🆕 Новичок — анкеты нет»): пройдите анкету до сводки и отправьте её, заявка «на рассмотрении». Потом заполните Google Форму со своим @юзернеймом и подождите до 5 минут.", exp:"Приходит «Ты в списке делегации <вуз> — спасибо, что с нами! Заявка одобрена, меню участника ниже.» Заявка из «на рассмотрении» стала одобренной без решения менеджера."},
    {id:"9", who:"D", hand:true, do:"Третий вариант: новичок нажимает /start и доходит до первых вопросов анкеты, но не отправляет её. Тогда заполните Google Форму со своим @юзернеймом и подождите до 5 минут.", exp:"Приходит «Привет! Ты в списке делегации <вуз> на форум Юлид в Москве 🎉 …». Незаконченная анкета сбрасывается, дальше обычное меню одобренного."},
    {id:"10", who:"M", hand:true, do:"Подайте форму от тестера так, чтобы курс бот не распознал (например, курс «учусь заочно»). Подождите до 5 минут → экран «🏫 Делегации вузов» → «❔ Проверить курс (N)» → карточка человека.", exp:"Список «❔ Проверить курс (N)» и подпись «Нажмите на человека, чтобы решить.» В карточке «Вуз: …», «Курс как в форме: «учусь заочно»», «Ник: …» и кнопки «✅ ЦА», «🚫 Не ЦА». После «✅ ЦА» всплывает «Отмечено: ЦА — заявка одобрена» (если человек уже в боте) или «Отмечено: ЦА — человек ещё не заходил в бота, появится в «⏳ Не зашли»»."},
    {id:"11", who:"M", hand:true, do:"Подайте форму с опечаткой в @юзернейме делегата → «⏳ Не зашли (N)» → «🔗 <ФИО> (@ник)» → перешлите сообщение делегата или пришлите его @ник → «✅ Привязать».", exp:"«⏳ Не зашли в бота (N)»: «ЦА по форме, но бот их не узнал по нику. Нажмите, чтобы привязать вручную.» После «🔗»: «Кого это? Пришлите @ник, Telegram ID или перешлите сообщение этого человека. Привязать можно только того, кто уже открывал бота.» Подтверждение: «Привязать <ФИО> (<вуз>) к …? Заявка будет одобрена без анкеты, человек получит сообщение и доступ к QR на вход.» После «✅ Привязать» всплывает «Привязано — заявка одобрена», делегату приходит приветствие."},
    {id:"12", who:"M", do:"Нажмите по очереди: «📢 Рассылка» → «🎯 По фильтру» → «🏫 Делегации» → «Делегация вуза» → «📊 Показать и отправить» → «❌ Отмена».", exp:"В выборе две кнопки «Делегация вуза» и «Не делегация»; в сводке «Делегация вуза = Делегация вуза», число получателей равно числу делегатов в боте. Кнопка «🏫 Вуз делегации» рядом отбирает один вуз из списка формы. Если делегатов в базе нет совсем: «Делегаций в базе пока нет — фильтровать не по чему.»"},
    {id:"13", who:"D", do:"Посмотрите главное меню и нажмите любую старую кнопку игры, если она осталась в клавиатуре. Потом менеджер: «🎮 Геймификация для делегатов: ☐» → ✅, делегат: /start.", exp:"Пока переключатель выключен, в меню нет «🪙 Мои монеты» и «🎯 Задания»; старая кнопка отвечает «Задания и монеты для делегаций вузов на этом форуме выключены. Всё остальное — программа, QR на вход, новости — работает как обычно.» После включения (всплывает «Геймификация для делегатов: включена») обе кнопки появляются в меню."},
    {id:"14", who:"D", do:"Выключите переключатель «🎮 Геймификация для делегатов» обратно (☐) и откройте приложение тестового бота делегатом вуза.", exp:"Главный экран, профиль, программа и вопросы открываются как обычно. «Задания» и «Монеты» не открываются и показывают «Задания и монеты для делегаций выключены». Включите переключатель (✅) и откройте «Задания» заново: список открылся."},
    {id:"15", who:"M", do:"В боте «📊 Данные» → «📊 Дашборд» → «🏫 Делегации» (появится ✅). Откройте веб-дашборд тестового бота, страница статистики.", exp:"На странице новый раздел «Делегации» в оглавлении и в списке: таблица «Вуз · ЦА в форме · В боте · Пришли», внизу строка «Всего». Тестовый вуз в таблице, ЦА ≥ 1 и «В боте» ≥ 1. Нажмите «🏫 Делегации» ещё раз (☐) и обновите страницу: раздела нет."},
    {id:"16", who:"M", hand:true, do:"Откройте в Google-таблице тестового бота вкладку «UR REGS».", exp:"Строка делегата: ID ответа в A, ответы формы в D–L, в колонке M «✅ зашёл»; у не зашедшего «⏳ не заходил»; у не ЦА строка серая и в M «— не ЦА». Колонки P и правее не изменились."},
    {id:"17", who:"M", do:"В конце удалите тестовых делегатов командой /delete_user, верните «🎮 Геймификация для делегатов» в положение, как было до сессии, и нажмите «⏸ Выключить» на экране делегаций.", exp:"Тестеры пропали из «🏫 По вузам» и из таблицы дашборда; счётчик «В форме» не меняется: ответы формы остаются в боте."},
  ]},
  ]},

{ key:"s3", n:3, when:"вт 20.10 · 21:00 МСК", title:"Админка, статистика, игра", time:"≈90 мин", people:"2 человека",
  lede:"Разделы менеджера, карточка делегата, роли и доступы, доска статистики, геймификация и амбассадоры. В конце повторная проверка всего, что в первых двух сессиях было отмечено ❌: этот раздел собирается сам.",
  roles:["M","D"],
  setup:{ time:"10 мин", items:[
    {id:"1", who:"A", do:"Откройте доску по ссылке с кодом, впишите имя внизу. За 10 минут до начала пришлите Андрею (@qleafye) свои @юзернеймы для /uat.", exp:"Андрей ответил, что добавил."},
    {id:"acc", who:"A", do:"Аккаунты на эту сессию. Менеджер: /uat не трогает, нужна полная админка от Андрея. Делегат: /uat → «✅ Одобрен» → «Делегат — без ролей» (пункт 3). В разделе «Роли и доступы» делегат получит роль через админку менеджера, а не через /uat.", exp:"Каждый знает, какой аккаунт за кого."},
    {id:"2", who:"M", do:"@YouLead_test_bot → /admin.", exp:"Разделы «🎪 Событие», «📝 Анкета», «📋 Заявки», «💳 Оплата», «📢 Общение», «🎮 Геймификация», «📊 Данные», «🔧 Управление». Если нет, напишите Андрею: нужны права."},
    {id:"3", who:"D", do:"/uat → «✅ Одобрен» → «Делегат — без ролей» → «✅ Сбросить и засеять» → /start.", exp:"«✅ Готово.», после /start меню одобренного делегата."},
    {id:"4", who:"M", do:"Откройте в телефоне раздел «Повторная проверка» внизу этой страницы и посмотрите, сколько там шагов: это ❌ из сессий 1 и 2. Оставьте на них последние 15 минут.", exp:"Раздел собрался сам. Если он пуст, значит ❌ не было."},
    {id:"5", who:"M", do:"Приготовьте PDF-файл (любой) для замены резюме и компьютер с браузером для доски статистики test.alekseev.info.", exp:""},
    {id:"6", who:"M", do:"Для «+N в чате» и переноса баллов: тестовый бот добавлен в чат делегатов тестового бота и чат привязан (если нет, попросите Андрея заранее); менеджер и делегат состоят в чате. Создайте Google-таблицу с вкладкой: колонки «Ник», «Задание 1 (#a)», «Задание 2 (#b)»; строки с @юзернеймом делегата (баллы 10 и 5) и с выдуманным ником @nobody_uat_test (баллы 3). Дайте таблице доступ «Читатель» для адреса, который бот покажет в шаге 10 раздела «Геймификация» (или откройте доступ по ссылке).", exp:"Чат и таблица готовы."},
  ]},
  sections:[
  { key:"card", title:"Карточка делегата /find", time:"10 мин", need:"менеджер + делегат", steps:[
    {id:"1", who:"M", do:"Напишите боту /find @ник делегата.", exp:"Карточка: ID, Имя, Username, «Статус: ✅ Одобрена», «Город: …», «Сезон: …». Кнопки «🔄 Перевыпустить QR», «🏙 Перевести в город», «↩️ Вернуть в ожидание», «✏️ Открыть правку после решения», «📎 Заменить резюме»."},
    {id:"2", who:"M", do:"Нажмите по очереди: «✏️ Открыть правку после решения» → оставьте «🔔 Сообщить делегату: ВКЛ» → «✅ Открыть правку».", exp:"«✏️ Открыть правку после решения?» и «Разрешение одноразовое — погаснет после первой применённой правки.». Делегату пришло сообщение, что анкету можно поправить."},
    {id:"3", who:"D", do:"По сообщению бота откройте правку, поменяйте один ответ, остальные оставьте, сохраните.", exp:"Каждый вопрос с «Прошлый ответ: …» и кнопками «✅ Оставить» / «✏️ Изменить». После сохранения бот подтверждает, что ответы обновлены. В /find у менеджера снова «✏️ Открыть правку после решения»: разрешение погасло."},
    {id:"4", who:"M", do:"/find → «↩️ Вернуть в ожидание» → «✅ Вернуть в ожидание». Потом «📋 Заявки» → «📋 Заявки» → «✅ Одобрить».", exp:"«↩️ Вернуть в ожидание модерации?», «Статус: … → ⏳ Ожидает модерации», «Что изменится: снимутся напоминания об оплате…, строка в таблице станет «Новая»…, QR-пропуск на форум перестанет пускать.». После возврата делегат на кнопку меню получает «⏳ Твоя заявка на рассмотрении…», заявка снова в очереди. После одобрения делегату письмо об одобрении."},
    {id:"5", who:"M", do:"Нажмите по очереди: «🏙 Перевести в город» → «Тюмень…» → «✅ Оставить статус (…)». Потом так же вернуть в «Санкт-Петербург…».", exp:"«🏙 В какой город перевести?» (только включённые города), экран «🏙 Перевод в другой город» со строками «Город: A → B», «Статус сейчас: …» и кнопками «✅ Оставить статус (…)» / «↩️ Вернуть на модерацию». Итог «✅ … переведён(а): город — …». В /find строка «Город» поменялась."},
    {id:"6", who:"M", do:"Нажмите по очереди: «📎 Заменить резюме» → пришлите PDF.", exp:"«📎 Заменить резюме» … «Пришлите новый файл резюме (PDF или DOCX) одним сообщением… Передумали — /cancel.» После файла «✅ Резюме делегата … заменено.»"},

    {id:"2", who:"O", do:"Запомните текущий тип события. «📝 Анкета» → «🎛 Тип события (пресет)» → «🎤 Конференция». Потом «🎪 Событие» → «🎭 Тип события».", exp:"Всплывает «Пресет применён: 🎤 Конференция / Тип события: Конференция». В «🎭 Тип события» отмечено ✅ «Конференция». Пресет «🏛 Форум» ставит тип «Форум»."},

  { key:"ambui0910", title:"Амбассадоры: подписи входа и отбора, «🚀 Первая настройка»", time:"10 мин", need:"менеджер; для шага 3 — приложение тестового бота; в конце верните тумблеры как были", steps:[
    {id:"1", who:"M", do:"Нажмите по очереди: «🤝 Амбассадоры» → «🚪 Вход и лимит» → смените способ входа (подтверждение можно отменить). Откройте пустой список «🙋 Кандидаты» и экран «🙅 Отказать всем».", exp:"Везде кнопка делегата называется «Хочу свою ссылку»: в подтверждении «Кнопка «Хочу свою ссылку» и ответ «да»…», в пустом списке «…когда делегаты нажмут «Хочу свою ссылку»…», в «Отказать всем» «кнопки «Хочу свою ссылку» у них не будет», в подсказках «Способ входа» и «Мест в команде»."},
    {id:"2", who:"M", do:"Нажмите по очереди: «🎮 Геймификация» → «🤝 Отбор амбассадоров: ❌ Выкл» → включите. Потом верните как было.", exp:"Всплывает «🤝 Отбор включён. Сейчас: ⚡ Сразу по кнопке, мест: без лимита. Чтобы брать людей вручную — «🤝 Амбассадоры» → «🚪 Вход и лимит».» (если отбор уже выбран: «Сейчас: 🗳 Отбор менеджером, мест: N. …»)."},
    {id:"3", who:"O", hand:true, do:"Приложение → «🚀 Первая настройка». Посмотрите шаг «🎭 Тип события» и шаг «🤖 Описание бота». Впишите в описание тестовую строку, потом верните прежний текст.", exp:"На шаге типа события объяснено, чем отличаются «Форум», «Конференция» и «Форум СкиллАп». Шаг «🤖 Описание бота» с двумя полями (описание до /start и строка «О боте») и подсказкой «В @BotFather остаётся только аватар». После сохранения описание бота в Телеграме меняется без перезапуска."},
    {id:"4", who:"M", do:"Выключите «🤝 Отбор амбассадоров» и откройте «🎮 Геймификация». Зайдите в «💰 Баллы и приватность» и нажмите «← Назад».", exp:"Видны «🌊 Волны», «🎓 Ступени амбассадоров», «💰 Баллы и приватность», «🚫 Исключения из зачёта», «📎 Закрепить приглашённого» и тексты амбассадоров. «🚪 Вход и лимит» и «🙋 Кандидаты» нет. «← Назад» возвращает в «🎮 Геймификация»."},
    {id:"5", who:"M", do:"Откройте подсказку «🚪 Как становятся амбассадорами».", exp:"«⚡ Сразу по кнопке — делегат жмёт «Хочу свою ссылку» и сразу попадает в команду. Ответ «да» на вопрос анкеты в этом режиме в команду не принимает — после анкеты делегат увидит ту же кнопку.» Подтверждение переключения на «⚡ Сразу» говорит то же."},
    {id:"6", who:"M", do:"Найдите тексты «🔗 Реферальная ссылка: текст», «👥 Приглашённые: заголовок списка», «👥 Приглашённые: пусто».", exp:"Они в группе «🤝 Амбассадоры» после текстов волн, в «🎮 Геймификации» их нет. У делегата экран «Моя ссылка» не изменился."},

  { key:"enroll0910", title:"Запись на сессии: настройка и выбор делегата", time:"35 мин", need:"менеджер + делегат Москвы + третий аккаунт как второй делегат Москвы (шаги 15 и 18): /uat → «🎟 Одобрен на форум — с QR-пропуском» → «Москва…» → «🎗 Волонтёр входа (сканер)». В конце верните дату закрытия и снимите лимиты", steps:[
    {id:"1", who:"M", do:"Нажмите по очереди: «📋 Заявки» → «🎪 Форум: функции» → «Москва…». Найдите строку «📅 Запись на сессии», нажмите «📅 Настройки записи» → «❌ Выкл → ✅ Вкл».", exp:"В хабе строка «📅 Запись на сессии: ❌ Выкл». Экран «📅 Запись на сессии — Москва…» с объяснением «Делегаты сами выбирают сессии своих треков…». После нажатия «Запись на сессии: ✅ Вкл», кнопка стала «✅ Вкл → ❌ Выкл»."},
    {id:"2", who:"M", do:"Нажмите по очереди: «⏳ Закрыть запись: не задано» → пришлите «завтра». Потом пришлите «28.10.2026 23:59».", exp:"Подсказка «Когда закрыть запись — по местному времени города, формат ДД.ММ.ГГГГ ЧЧ:ММ. Пример: 28.10.2026 23:59». Слово «завтра» бот не принимает и снова просит дату в этом формате. После правильной даты в «📅 Настройки записи» строка «Запись закрывается: 28.10.2026 23:59» и кнопка «⏳ Закрыть запись: 28.10.2026 23:59»."},
    {id:"3", who:"M", do:"Нажмите по очереди: «🧭 Треки» → «➕ Добавить» → «Карьера». Так же добавьте «Бизнес» и «Креативные индустрии». Нажмите на трек и подвиньте его «⬆️ Выше» / «⬇️ Ниже».", exp:"Пустой список пишет «Треков пока нет. Добавьте первый, например «Карьера»…». Потом в списке три трека, порядок меняется кнопками."},
    {id:"4", who:"M", do:"Нажмите по очереди: «← Запись на сессии» → «🎯 Компетенции» → «➕ Добавить»: «Лидерство», «Коммуникация», «Аналитика».", exp:"Пустой список пишет «Компетенций пока нет. Добавьте первую, например «Лидерство»…». Потом в списке три компетенции."},
    {id:"5", who:"M", do:"Вверху /admin выберите «Москва…», потом нажмите по очереди: «🎪 Событие» → «🗓 Программа форума» → день форума (если дня нет — «📅 Другой день»). Заведите сессии: «Открытие» 09:00-09:45; «Сессия A», «Сессия B», «Сессия C» на 10:00-11:00 в разных залах; «Сессия D» 10:30-12:00. Если фото программы Москвы ещё нет, загрузите любое.", exp:"В дне пять сессий. На предупреждение «В зале … уже …» отвечайте «🔁 Выбрать другой зал»."},
    {id:"6", who:"M", do:"Откройте «Сессия A» → «🧭 Запись и треки». Выберите трек и отметьте одну-две компетенции. То же для B, C и D (треки разные). У «Открытие» ничего не меняйте.", exp:"Экран «🧭 Запись и треки — Сессия A»: «Трек определяет, на какие сессии можно записаться. Без трека сессия общая (пленарка) — записи на неё нет.», у выбранного трека ✅, компетенции с ☐ / ☑, «🔒 Запись закрыта: нет», «👥 Лимит мест: без лимита». У «Открытие» отмечено «✅ Без трека — общая сессия». В карточке сессии строки «🧭 Трек: …», «🎯 Компетенции: …», «📅 Запись: …»."},
    {id:"7", who:"D", do:"Напишите боту /uat и нажмите по очереди: «📨 Заявка на форум — ждёт проверки» → «Москва…» → «Делегат — без ролей» → «✅ Сбросить и засеять» → /start → «📅 Запись на сессии».", exp:"«Запись на сессии откроется, когда твою заявку одобрят.»"},
    {id:"8", who:"D", do:"Напишите боту /uat и нажмите по очереди: «🎟 Одобрен на форум — с QR-пропуском» → «Москва…» → «Делегат — без ролей» → «✅ Сбросить и засеять» → /start → «📅 Запись на сессии».", exp:"Сначала фото программы. Потом «Выбери трек — его сессии будут отмечены первыми. Можно смешать треки и выбрать сессии из разных.», кнопки треков, «🔀 Смешать треки» и «🗓 Моё расписание»."},
    {id:"9", who:"D", do:"Нажмите трек, который стоит у «Сессия A». Выберите «Сессия A».", exp:"«<день>, 10:00–12:00. Выбери одну сессию:». Сессия вашего трека стоит первой со ⭐. После нажатия «✅ Сессия A», появилась кнопка «✖️ Снять выбор», внизу «Дальше ➡️»."},
    {id:"10", who:"D", do:"В этом же слоте нажмите «Сессия B» → «Оставить как было». Потом снова «Сессия B» → «Да, поменять».", exp:"«Ты уже записан на «Сессия A» в это время. Поменять на «Сессия B»?». После «Оставить как было» отмечена A, после «Да, поменять» отмечена B."},
    {id:"11", who:"D", do:"Нажмите «✖️ Снять выбор».", exp:"В слоте ничего не отмечено ✅."},
    {id:"12", who:"D", do:"Выберите «Сессия A» → «Дальше ➡️» до конца → «✅ Подтвердить».", exp:"«🗓 Моё расписание»: «09:00–09:45 Открытие (для всех)» и выбранная сессия, кнопки «✏️ Изменить» и «✅ Подтвердить». После подтверждения сверху «Готово, расписание подтверждено! Поменять выбор можно до 28.10.2026 23:59.»"},
    {id:"13", who:"D", do:"Откройте ссылку https://t.me/YouLead_test_bot?start=sessions.", exp:"Тот же экран выбора трека, что из меню."},
    {id:"14", who:"M", do:"Нажмите по очереди: «Сессия B» → «🧭 Запись и треки» → «🔒 Запись закрыта: нет». Делегат открывает слот 10:00 и нажимает «Сессия B». Потом верните запись.", exp:"Кнопка стала «🔒 Запись закрыта: да». У делегата «Сессия B · 🔒 запись закрыта», по нажатию «Запись на «Сессия B» закрыта — выбери другую сессию.»"},
    {id:"15", who:"M", do:"Нажмите по очереди: «Сессия C» → «🧭 Запись и треки» → «👥 Лимит мест» → «1». Третий аккаунт записывается на C. Делегат открывает слот 10:00 и нажимает C. Потом «♾ Без лимита».", exp:"Бот спрашивает «Сколько мест на этой сессии? Пришлите число. Например: 30». У делегата «Сессия C · 🔒 мест нет», по нажатию «На «Сессия C» мест больше нет — выбери другую сессию.» «♾ Без лимита» снимает ограничение («Лимит снят.»)."},
    {id:"16", who:"M", do:"Нажмите по очереди: «📅 Настройки записи» → «⏳ Закрыть запись» → «01.10.2026 00:00». Делегат нажимает «📅 Запись на сессии». Потом верните «28.10.2026 23:59».", exp:"У делегата сразу «🗓 Моё расписание» и «Запись на сессии закрылась 01.10.2026 00:00. Расписание можно посмотреть, а менять уже нельзя.» Кнопок «✏️ Изменить» и «✅ Подтвердить» нет."},
    {id:"17", who:"M", hand:true, do:"Нажмите по очереди: «🗓 Программа форума» → «📋 Записи на сессии». Нажмите замок у одной сессии и ещё раз. Потом нажмите на «Сессия A» и на сессию, где никого нет.", exp:"«Записались: N чел., подтвердили расписание: M», строки вида «10:00 Карьера · Сессия A — 1». Замок закрывает и открывает запись (у закрытой 🔒 в начале строки). По «Сессия A» приходит файл «Записанные на «Сессия A»: 1 чел.», в Excel кириллица читается. По пустой: «На эту сессию пока никто не записан.»"},
    {id:"18", who:"M", do:"Третий аккаунт перезаписывается на «Сессия A» (теперь там двое). «Сессия A» → «✏ Время» → «10:15-11:15». Потом «🧭 Запись и треки» → «👥 Лимит мест» → «1». В конце верните время 10:00-11:00 и «♾ Без лимита».", exp:"Про время: «Записано 2 … — они останутся записаны, но время изменится: 10:00–11:00 → 10:15–11:15.» и кнопка «✅ Да, изменить время». Про лимит: «Записано 2 …, а лимит 1: новых записей не будет, текущие записи останутся. Поставить такой лимит?» и «✅ Да, поставить»."},
  ]},

  { key:"quiz0910", title:"Тест компетенций", time:"25 мин", need:"менеджер + делегат Москвы. Компетенции из раздела записи уже заведены. В конце выключите тест, если он в Москве не нужен", steps:[
    {id:"1", who:"M", do:"Нажмите по очереди: «📋 Заявки» → «🎪 Форум: функции» → «Москва…» → «🧭 Тест компетенций».", exp:"«🧭 Тест компетенций — Москва…», «Вопросов: 0 · Уровней: 0», «Тест выключен · пересдача запрещена», «Считать: в %», «Добавьте вопросы или загрузите их из таблицы.»"},
    {id:"2", who:"M", do:"Нажмите по очереди: «📥 Загрузить из таблицы» → «📥 Шаблон». Заполните 3 вопроса по 3 варианта: в третьей колонке компетенции Москвы, в четвёртой баллы от 0 до 5. Пришлите файл → «✅ Применить».", exp:"Приходит файл-образец с двумя вопросами и подписью «Заполните и пришлите файлом.». На свой файл: «В файле: 3 вопроса, 9 вариантов.», «Будет заменено: 0 вопросов, 0 вариантов.» и «Заменить вопросы теста? Старые вопросы и варианты пропадут, уровни останутся.». После применения «✅ Тест обновлён: 3 вопроса»."},
    {id:"3", who:"M", do:"Снова «📥 Загрузить из таблицы». Пришлите файл, где у одной строки пустая колонка с вариантом. Потом файл с компетенцией, которой в Москве нет.", exp:"Первый: «В файле есть ошибки, ничего не заменено:» и «Строка N: не указан вариант ответа. Впишите его во вторую колонку.», кнопки «✅ Применить» нет. Второй: «Неизвестные компетенции: … Баллы по ним не сохранятся — сначала заведите их в списке компетенций.». Применять не нужно: «← Отмена»."},
    {id:"4", who:"M", do:"Нажмите по очереди: «📊 Уровни» → «➕ Уровень»: «Начальный» от 0, «Средний» от 40, «Сильный» от 75 (описание «-»). Вернитесь «← К тесту» → «❌ Тест выключен → включить».", exp:"Бот спрашивает «Название уровня. Например: Базовый», потом порог и «Описание уровня — его увидит делегат.». В списке «Начальный — от 0%», «Средний — от 40%», «Сильный — от 75%». Тест: «✅ Тест включён → выключить»."},
    {id:"5", who:"M", do:"Нажмите по очереди: «❓ Вопросы» → «➕ Вопрос» → любой текст, вариантов не добавляйте. Выключите тест и включите снова. Потом удалите этот вопрос и включите тест.", exp:"«Нельзя включить: у вопроса 4 «…» нет вариантов ответа. Добавьте хотя бы один вариант или удалите вопрос.» После удаления тест включается."},
    {id:"6", who:"D", do:"Напишите боту /uat и нажмите по очереди: «📨 Заявка на форум — ждёт проверки» → «Москва…» → «Делегат — без ролей» → «✅ Сбросить и засеять» → /start → «🧭 Тест».", exp:"«Тест откроется, когда твою заявку одобрят.»"},
    {id:"7", who:"D", do:"Напишите боту /uat и нажмите по очереди: «🎟 Одобрен на форум — с QR-пропуском» → «Москва…» → «Делегат — без ролей» → «✅ Сбросить и засеять» → /start → «🧭 Тест» → «▶️ Начать тест». Ответьте на первый вопрос.", exp:"«Вопрос 1 из 3», текст вопроса и варианты кнопками. После ответа «Вопрос 2 из 3»."},
    {id:"8", who:"D", do:"Нажмите «🧭 Тест» ещё раз → «▶️ Начать тест». Если Андрей рядом, пусть до этого перезапустит тестового бота.", exp:"«Продолжаем с вопроса 2 из 3.» и второй вопрос. После перезапуска так же."},
    {id:"9", who:"M", do:"Пока делегат на втором вопросе, загрузите тот же файл ещё раз → «✅ Применить». Делегат отвечает на открытый вопрос.", exp:"В предпросмотре «Незавершённых попыток: 1 — начнутся заново.». У делегата «Мы обновили тест — начнём сначала.» и «Вопрос 1 из 3»."},
    {id:"10", who:"D", do:"Ответьте на все вопросы. Нажмите «📅 Выбрать сессии».", exp:"«Твой результат по компетенциям:» и строки вида «Лидерство — Средний» (где порог не набран: «пока без уровня»). «📅 Выбрать сессии» открывает выбор трека записи."},
    {id:"11", who:"D", do:"Снова «🧭 Тест».", exp:"Сразу тот же результат: пересдача выключена."},
    {id:"12", who:"M", do:"Нажмите по очереди: «📊 Уровни» → «Средний» → «✏️ Порог» → «10». Делегат снова открывает «🧭 Тест». В конце верните 40.", exp:"Уровни у делегата пересчитаны по новым порогам."},
    {id:"13", who:"M", do:"Нажмите по очереди: «📈 Статистика», потом «🔗 Ссылка на тест». Делегат открывает ссылку.", exp:"«📈 Статистика теста», «Начали: N, закончили: M» и уровни по компетенциям. Ссылка «https://t.me/YouLead_test_bot?start=quiz» с подсказкой, что её можно вставить в текст рассылки. У делегата открывается тест (его результат)."},
  ]},
  { key:"bcast0910", title:"Рассылка текущему сезону и проверка подстановок", time:"15 мин", need:"менеджер с правом рассылок. Рассылки не отправляйте: смотрим только экраны с числом получателей", steps:[
    {id:"1", who:"M", do:"Нажмите по очереди: «📢 Рассылка» → «🎯 По фильтру».", exp:"В условиях уже стоит «Текущий сезон (…)». «👥 Включить прошлые сезоны» убирает условие, «🎯 Только текущий сезон» возвращает."},
    {id:"2", who:"M", do:"Нажмите по очереди: «📢 Рассылка» → «📢 Все пользователи» → любой текст → дойдите до подтверждения и не отправляйте.", exp:"Если в базе есть делегаты прошлого сезона: строка «из них прошлого сезона: N» и кнопка «🎯 Только текущий сезон». После неё «Остался только текущий сезон», получателей меньше."},
    {id:"3", who:"M", do:"Нажмите по очереди: «🎯 По фильтру» → «📅 Записан на сессию…» → «Москва…» → день → «Сессия A». Потом отдельно «🚫 Не записался ни на одну» и «🧭 Не прошёл тест».", exp:"Условие «Записан на «Сессия A» (…)», получателей столько, сколько записано на A. «🚫 Не записался ни на одну сессию (…)» и «🧭 Не прошёл тест (…)» дают ожидаемые числа; делегаты без города в анкете тоже попадают."},
    {id:"4", who:"M", do:"Нажмите по очереди: «📅 Настройки записи» → «✏️ Тексты» → «расписание подтверждено» → пришлите «Готово, расписание подтверждено!» (без даты).", exp:"«Пропала {deadline} — в сообщении не будет: дата закрытия записи.» и «Сохранить всё равно?», кнопки «Сохранить всё равно» и «✏️ Исправить». Нажмите «✏️ Исправить»."},
    {id:"5", who:"M", do:"Пришлите «Готово, расписание подтверждено! Поменять выбор можно до {dedline}.» → «Исправить на {deadline}».", exp:"«Не знаю {dedline} — может, {deadline}?», кнопки «Исправить на {deadline}» и «Оставить как есть». После исправления текст сохранён с {deadline}."},
    {id:"6", who:"M", do:"Посмотрите сообщение после сохранения. В конце снова откройте этот текст и пришлите «-».", exp:"«Так увидит делегат:» и текст с подставленной датой вместо {deadline}. После «-» текст снова стандартный."},
  ]},
  { key:"sec", title:"Права и границы городов", time:"10 мин", need:"менеджер города (роль через /uat «🎪 Менеджер форума» с городом) + делегат другого города", steps:[

  { key:"chat", title:"Учёт чата делегатов и рейтинг", time:"10 мин", need:"менеджер + тестовая группа, куда можно добавить бота администратором", steps:[

    {id:"2", who:"M", do:"Нажмите по очереди: «🔧 Управление» → «🏆 Рейтинг чата» → режим «🪙 По правилам города» → «📣 Когда и что публиковать» → предпросмотр.", exp:"Режимы «📈 По формуле активности» / «🪙 По правилам города». В режиме правил суммы: «🪙 Комментарий под постом», «🪙 Ценный комментарий», «🪙 Привёл друга» и другие. Предпросмотр: «Так пост будет выглядеть в чате.» Публикация спрашивает «Опубликовать рейтинг в чат «…»?»."},

    {id:"2", who:"M", do:"Нажмите по очереди: «🔧 Управление» → включите «📊 Итоги дня менеджерам», в «🔧 Система» посмотрите «📊 Итоги дня: во сколько».", exp:"Переключатель «📊 Итоги дня менеджерам: ❌ Выкл → ✅ Вкл», время по умолчанию 21:00. В назначенное время менеджерам «📊 Итоги дня, ДД.ММ — Город» со строками «📋 Заявки: новых … · одобрено … · отклонено … · ждут …». Ждать не обязательно: ⏭ и заметка."},

    {id:"3", who:"M", do:"Нажмите по очереди: «💰 Баллы и приватность» → «🙈 Скрывать имена приглашённых» переключите и верните.", exp:"Кнопки «💰 Баллов за приглашённого: N», «🙈 Скрывать имена приглашённых: да/нет», «🏅 Имена в рейтинге волны: да/нет». У делегата в «👥 Мои приглашённые» имена скрыты или показаны соответственно."},
