  { key:"owner0910", title:"Решения владельца 09.10: пресет СкиллАп, «✏️ Изменить анкету», амбассадоры", time:"35 мин", need:"менеджер (суперадмин) + делегат + третий аккаунт как приглашённый (шаг 13). В начале запишите в 💬, как стоят «✏️ Правка анкеты делегатом», «🤝 Отбор амбассадоров», способ входа и «💰 Баллов за приглашённого» — в последнем шаге всё вернуть", steps:[
    {id:"1", who:"O", do:"Приложение → «⚙️ Настройки» → «🎪 Событие» → «🎭 Тип события» → выберите «Форум СкиллАп». Прочитайте предупреждение и не сохраняйте.", exp:"«Пресет «СкиллАп» включит анкету направлений/стека/резюме, пропуск вопроса «Откуда узнал» по реф-ссылке, предложение личной ссылки в конце анкеты, догонялку и другие настройки события.», дальше «Награды амбассадорам пресет не обещает и ступени не включает — настройте сами:» и два пункта: где текст предложения ссылки и где ступени. Про разбор резюме, 21 ноября и 14.11 ничего нет."},
    {id:"1b", who:"O", do:"То же в боте: /admin → «📝 Анкета» → «🎛 Тип события (пресет)» → «🎓 Форум СкиллАп». Если в шапке выбран город, сначала переключите на «🌍 Все города». Прочитайте подтверждение и нажмите «← Отмена» — в тестовом боте пресет не применяйте.", exp:"Вместо списка «Включатся: …» — заголовок «🎓 Форум СкиллАп» и тот же текст, что в приложении на шаге 1: «Пресет «СкиллАп» включит анкету направлений/стека/резюме…», «Награды амбассадорам пресет не обещает и ступени не включает — настройте сами:», два пункта и «Применить?». Под текстом кнопки «✅ Применить» и «← Отмена». После «Отмены» снова список пресетов, переключатели вопросов не изменились."},
    {id:"2", who:"O", do:"Пройдите по путям из предупреждения. В приложении: «🔧 Управление» → «🎨 Приложение». В боте: «🤝 Амбассадоры» (или «🎮 Геймификация», если отбор выключен) → «🎓 Ступени амбассадоров».", exp:"В приложении есть поле «🎁 Текст предложения реф-ссылки». На экране ступеней есть кнопки «🪜 Лестница ступеней» и «🎓 Программа: …». Тип события и ступени в тестовом боте не изменились."},
    {id:"3", who:"O", do:"Нажмите по очереди: «📋 Заявки» → нажимайте кнопку «✏️ Правка анкеты делегатом: …», пока она не начнётся со «всегда можно».", exp:"Подпись показывает текущее положение и следующее: «✏️ Правка анкеты делегатом: всегда можно → только до решения»."},
    {id:"4", who:"D", do:"Напишите боту /uat и нажмите по очереди: «✅ Одобрен» → «Делегат — без ролей» → «✅ Сбросить и засеять», потом /start.", exp:"В главном меню есть кнопка «✏️ Изменить анкету»."},
    {id:"5", who:"D", do:"Нажмите «✏️ Изменить анкету». На первом вопросе с прошлым ответом нажмите «✏️ Изменить», потом «Отмена» → «Да, отменить».", exp:"Открывается правка анкеты, как по ссылке от менеджера: «Прошлый ответ: … Оставить или изменить?» с кнопками «✅ Оставить» и «✏️ Изменить» (может сначала спросить город). После отмены «Регистрация отменена. Чтобы начать заново, отправь /start.» и меню; заявка осталась одобренной."},
    {id:"6", who:"O", do:"Нажмите по очереди: «📋 Заявки» → кнопку «✏️ Правка анкеты делегатом» дважды, до «нельзя». Делегат /start не отправляет.", exp:"Подпись «✏️ Правка анкеты делегатом: нельзя → всегда можно»."},
    {id:"7", who:"D", do:"Нажмите «✏️ Изменить анкету» на старой клавиатуре, которая осталась с шага 5.", exp:"«Изменить анкету сейчас нельзя. Если нужно что-то поправить — напишите менеджеру мероприятия.» Меню обновилось, кнопки «✏️ Изменить анкету» в нём нет."},
    {id:"8", who:"O", do:"Нажмите по очереди: «🎪 Событие» → «🔘 Кнопки меню».", exp:"Строка «✅ ✏️ Изменить анкету (сейчас скрыта: правка анкеты запрещена — «📋 Заявки» → «✏️ Правка анкеты делегатом»)». Если в шапке выбран город, после названия кнопки ещё «(своё)» или «(как везде)»."},
    {id:"9", who:"O", do:"Переключите правку на «только до решения». Делегат: /start, потом /uat → «📨 Заявка отправлена — ждёт проверки» → «Делегат — без ролей» → «✅ Сбросить и засеять» → /start.", exp:"Одобренному кнопки «✏️ Изменить анкету» нет: решение по нему уже принято. С заявкой на проверке кнопка есть."},
    {id:"10", who:"O", do:"Выключите «🤝 Отбор амбассадоров» («🎮 Геймификация» → «🤝 Отбор амбассадоров») и посмотрите «🎮 Геймификация». Нажмите на любую строку вида «── … ──».", exp:"Сразу после «🎯 Задания» строка «── 🤝 Амбассадоры ──», под ней «🌊 Волны», «🎓 Ступени амбассадоров», «💰 Баллы и приватность», «🚫 Исключения из зачёта», «📎 Закрепить приглашённого», тексты амбассадоров, потом «── 🎮 Проверка и монеты ──» и остальные кнопки геймификации. На нажатие всплывает «Это подзаголовок — кнопки группы под ним.»"},
    {id:"11", who:"O", do:"Включите отбор и откройте раздел «🤝 Амбассадоры» в /admin. Там «🚪 Вход и лимит» → способ входа «🗳 Отбор менеджером» (через «✅ Переключить: …»). Потом «💰 Баллы и приватность» → «💰 Баллов за приглашённого: …» → 10.", exp:"Раздел разбит подзаголовками: «── Общее ──» (💰 Баллы и приватность, 🚫 Исключения из зачёта, 📎 Закрепить приглашённого, ⚙️ Тексты и настройки), «── Команда и волны ──» (🚪 Вход и лимит, 🙋 Кандидаты и команда, 🌊 Волны), «── Ступени ──» (🎓 Ступени амбассадоров). На экране баллов «💰 Баллов за одобренного приглашённого: 10 (0 — выключено)»."},
    {id:"12", who:"D", do:"Напишите боту /uat и нажмите по очереди: «✅ Одобрен» → «Делегат — без ролей» → «✅ Сбросить и засеять». «🔗 Моя реферальная ссылка» → «Хочу свою ссылку». Ссылку отправьте третьему аккаунту. Если делегат уже в команде, сначала «Перестать быть амбассадором».", exp:"Ссылка вида …?start=amb_… и строка «🕓 Твоя заявка в команду амбассадоров рассматривается.» Делегат стал кандидатом."},
    {id:"13", who:"D", do:"С третьего аккаунта: /uat → «🆕 Новичок — анкеты нет» → «✅ Сбросить и засеять», открыть ссылку делегата, пройти анкету до «Всё верно». Менеджер одобряет эту заявку.", exp:"У третьего: «Отлично, ты пришёл по приглашению друга. Начинаем регистрацию.» Заявка одобрена. У делегата-кандидата в «🪙 Мои монеты» → «📜 История» строки за приглашённого нет: кандидату баллы пока не идут."},
    {id:"14", who:"M", do:"Нажмите по очереди: «🙋 Кандидаты и команда» → фильтр «🙋 Кандидаты» → карточка делегата → «✅ Взять».", exp:"В карточке «Привёл по ссылке: 1 · прошли отбор: 1». После «Взять»: «Взят. Место за ним — …» (или «Взят. Место за ним.», если мест без лимита)."},
    {id:"15", who:"D", do:"Нажмите по очереди: «🔗 Моя реферальная ссылка», потом «🪙 Мои монеты» → «📜 История».", exp:"«🎁 Ты в команде амбассадоров…» и «💰 Баллы за приглашённых: 10». В истории одна строка «За приглашённых до вступления: 1» на +10. Второй раз эти баллы не начисляются: кнопки «✅ Взять» у него больше нет."},
    {id:"16", who:"O", do:"Нажмите по очереди: «💰 Баллы и приватность» → «💰 Баллов за приглашённого» → 0. Потом «🌊 Волны» → «➕ Новая волна» → даты «сегодня; через 14 дней» в формате ДД.ММ.ГГГГ через «;» → «⏭ Без текста» → «✅ Создать».", exp:"В карточке волны строка «⚠️ Баллов за приглашённого — 0: в рейтинге волны считаются только задания, приглашённые в него не попадут. Задайте баллы, если волна про то, кто больше приведёт.» Первая кнопка карточки — «💰 Задать баллы»."},
    {id:"17", who:"O", do:"Нажмите «💰 Задать баллы» → «💰 Баллов за приглашённого: 0» → 10. Вернитесь в «🌊 Волны» → карточку этой волны.", exp:"«💰 Задать баллы» открывает экран «🤝 Амбассадоры → 💰 Баллы и приватность». После 10 в карточке волны нет ни предупреждения, ни кнопки «💰 Задать баллы». Если в тестовом боте есть волна с заданиями: при нуле баллов на экране «▶️ Запустить волну» то же предупреждение и кнопка «💰 Задать баллы» между «▶️ Да, запустить» и «← Отмена»; «▶️ Да, запустить» не нажимайте."},
    {id:"18", who:"O", do:"Удалите тестовую волну («🗑 Удалить» → «🗑 Да, удалить»). Верните из 💬 «💰 Баллов за приглашённого», способ входа, «🤝 Отбор амбассадоров» и «✏️ Правка анкеты делегатом».", exp:"Волны нет, настройки как до раздела."},
  ]},
  { key:"chat1010", title:"Анкета в чате: правки после прокликивания 09–10.10", time:"25 мин", need:"делегат (новый аккаунт через /uat) + менеджер для шага 9", note:"Уже проверено тестировщиком, повторять не нужно: город форума виден после выбора и в сводке; тексты анкеты (подсказка поиска, «Выбери от 1 до 2.», «Такой даты нет…»); ответ на текст после отправки анкеты; ответ на /admin без прав; шапка /admin без списка команд; подписи кнопок меню; «🎭 Тип события» → «Форум СкиллАп». Ниже только то, что ещё не смотрели.", steps:[
    {id:"1", who:"D", do:"Напишите боту /uat и нажмите по очереди: «🆕 Новичок — анкеты нет» → «Делегат — без ролей» → «✅ Сбросить и засеять», потом /start. Пройдите анкету до экрана «Проверь свои ответы:», но «Всё верно» не нажимайте. Отправьте /start и нажмите «▶️ Продолжить с шага N из N».", exp:"Перед этим бот показывает «У тебя есть незаконченная анкета — что дальше?» с кнопками «▶️ Продолжить с шага N из N» и «🔄 Начать заново». После «Продолжить» снова приходит сводка «Проверь свои ответы:» с кнопками «Всё верно» / «Изменить». Бот не переспрашивает ни образование, ни резюме, файл заново грузить не нужно."},
    {id:"2", who:"D", do:"Снова /start → «🔄 Начать заново».", exp:"«Пропадут уже введённые ответы (N). Начать анкету заново?». N не больше числа вопросов в анкете (раньше показывало лишнее, например 18 при 14 вопросах). Нажмите «Нет, продолжить»: ответы целы."},
    {id:"3", who:"D", do:"В новой анкете на вопросе про ВУЗ нажмите на подсказку-совпадение. На вопросе с несколькими вариантами отметьте два и нажмите «Готово».", exp:"После нажатия кнопки в переписке остаётся строка «✅ <то, что выбрали>». В мультивыборе по такой строке на каждый выбранный вариант. Раньше кнопки просто пропадали, и выбранного нигде не было видно."},
    {id:"4", who:"D", do:"Дойдите до вопроса про резюме (последний в анкете).", exp:"Приходит вопрос и отдельным сообщением «👇 Выбери способ:» с кнопками способов. Нижней клавиатуры предыдущего вопроса (например «Да!» / «Пока нет») больше нет."},
    {id:"5", who:"D", do:"Доведите анкету до сводки «Проверь свои ответы:» и пришлите боту любой текст, например «когда ответ».", exp:"«Нажми «Всё верно», чтобы отправить анкету, или «Изменить», чтобы поправить ответы.» с теми же кнопками «Всё верно» / «Изменить». Ответы на месте. Раньше бот молчал."},
    {id:"6", who:"D", do:"На сводке нажмите «Изменить». Если в анкете был вопрос, который вы пропустили («Пропустить» или «-»), обратите внимание на него.", exp:"Первым приходит «Давай поправим ответы — пройдём по ним по очереди.», а не «Отлично, начинаем регистрацию.». Согласие на обработку данных второй раз не просят, если вы уже его давали. Дальше по каждому вопросу «Прошлый ответ: … Оставить или изменить?» с кнопками «✅ Оставить» / «✏️ Изменить». У пропущенного вопроса (например, телефона) «Прошлый ответ: не указан», а не новый вопрос с нуля."},
    {id:"7", who:"D", do:"В режиме правки нажимайте «✅ Оставить» до конца, потом «Всё верно».", exp:"Приходит та же сводка, потом «Поздравляем, твоя заявка принята!…»."},
    {id:"8", who:"D", do:"Напишите боту /uat и нажмите по очереди: «🆕 Новичок — анкеты нет» → «Делегат — без ролей» → «✅ Сбросить и засеять», /start. Если вместе с выбором языка пришли кнопки городов, нажмите город, не выбирая язык.", exp:"Сначала должен быть выбор языка «Выберите язык анкеты / Choose the form language». При тапе по городу до языка всплывает «Сначала выберите язык анкеты / Choose the form language first», кнопки городов пропадают, остаётся экран языка. После выбора языка выбор города идёт обычным путём. Если города и язык пришли не вместе, шаг пропустите (⏭): так бывает не всегда."},
    {id:"9", who:"M", do:"Делегат подаёт новую анкету до «Всё верно». Менеджер: «📋 Заявки» → «❌ Отклонить» → причина «тест отказа». Делегат отправляет /start.", exp:"Делегат видит «Твоя заявка в этом сезоне отклонена. Это не навсегда: анкету можно поправить и подать заново 👇» и кнопку «🚀 Обновить анкету». Нет слов «С возвращением! Ты уже был(а) с нами на …» и кода сезона вроде «Yl-test-2»."},
  ]},
  { key:"mod1010", title:"Админка: очередь заявок, настройка кнопками, имя и аватар бота, поиск, таблица, ответы на вопросы", time:"30 мин", need:"менеджер (суперадмин) + делегат для шагов 13–14; для шага 1 в очереди должно быть минимум две заявки в ожидании. Имя и аватар бота на стенде меняйте только в шагах 5 и 8, если готовы вернуть как было", steps:[
    {id:"1", who:"M", do:"Нажмите по очереди: «📋 Заявки» → «⏭ Пропустить» на каждой карточке, пока не пропустите все.", exp:"Вместо «Заявок нет» приходит «⏭ Пропущено: N — они всё ещё ждут решения.» и кнопка «🔁 Показать пропущенные (N)». После её нажатия карточки возвращаются в очередь."},
    {id:"2", who:"O", do:"В шапке /admin выберите один город. «⚙️ Настройки» → «🎪 Событие» → «🎭 Тип события».", exp:"Строка «Общая настройка (одна на все города)», строка «Сейчас: Форум (по умолчанию)» (или текущий тип) и те же кнопки, что в «🌍 Все города»: «Форум», «Конференция», «Вручную», «Форум СкиллАп». Снизу «Выберите вариант кнопкой ниже.» Печатать название типа не нужно. Ничего не нажимайте, «← Назад»."},
    {id:"3", who:"O", do:"Переключите шапку на «🌍 Все города» и снова откройте «🎭 Тип события».", exp:"Над кнопками есть строка «Сейчас: …» (тип или «Форум (по умолчанию)», пока тип не выбирали вручную), у текущего варианта ✅."},
    {id:"4", who:"O", do:"Нажмите по очереди: «🎪 Событие» → «🖼 Аватар бота».", exp:"«Пришлите фото — бот спросит подтверждение и только после него поставит фото аватаром в Telegram. Лучше квадратное, главное — по центру: Telegram обрежет картинку до круга.» «Отправляйте именно как фото, не файлом.» Кнопки «🗑 Убрать аватар» и «← Назад»."},
    {id:"5", who:"O", hand:true, do:"Пришлите любое фото (как фото, не файлом).", exp:"«Поставить это фото аватаром бота?» с кнопками «✅ Да, поставить» и «← Отмена». Сразу ничего не меняется. Нажмите «← Отмена»: аватар прежний. Если готовы менять аватар тестового бота, нажмите «✅ Да, поставить»: «✅ Аватар бота обновлён. У людей в Telegram он сменится в течение пары минут.»"},
    {id:"6", who:"O", do:"Снова «🎪 Событие» → «🖼 Аватар бота», потом сразу /admin, потом пришлите фото.", exp:"Ожидание фото сбросилось: фото не превращается в аватар и вопроса «Поставить это фото…» нет."},
    {id:"7", who:"O", do:"Нажмите по очереди: «🎪 Событие» → «🤖 Имя бота». Прочитайте экран, имя не меняйте: сразу /admin, потом пришлите любой текст, например «проверка».", exp:"На экране пример «Юлид’26 · регистрация», «До 64 символов», «Применяется сразу после сохранения», «Если очистить поле, имя в Telegram останется последним заданным». После /admin и текста «проверка» имя бота в шапке чата не изменилось."},
    {id:"8", who:"O", hand:true, do:"Если готовы менять имя в тестовом боте: «🤖 Имя бота» → пришлите новое, например «Юлид тест · проверка». Прежнее имя запишите в 💬 до начала.", exp:"Бот отвечает, что имя применено. В шапке чата с ботом в Telegram оно сменилось (иногда через минуту). Верните прежнее имя тем же путём. Если Telegram отказал, бот пишет, через сколько попробовать снова, и настройка не сохраняется. Нет готовности менять имя тестового бота: ⏭."},
    {id:"9", who:"O", do:"Нажмите по очереди: «🔧 Управление» → «🔎 Найти настройку». Напишите слово «аватар».", exp:"Одна кнопка «🖼 Аватар бота · …» (после точки — название раздела). Нажмите её: откроется экран аватара. Раньше бот отвечал «Не нашёл»."},
    {id:"9b", who:"O", do:"Нажмите «🔎 Искать другое» и напишите «роли».", exp:"Есть кнопка «👥 Роли и доступы · …», и она открывает свой экран."},
    {id:"9c", who:"O", do:"Нажмите «🔎 Искать другое» и напишите «таблица».", exp:"Есть кнопка «🔗 Какая таблица · …», и она открывает свой экран."},
    {id:"10", who:"O", do:"Нажмите по очереди: «🔎 Найти настройку» → «имя бота», затем набор букв без смысла, например «ыыыы».", exp:"На «имя бота» кнопка «🤖 Имя бота · …». На набор букв: «Не нашёл. Попробуйте другое слово, например «оплата» или «приветствие».»"},
    {id:"11", who:"O", do:"Нажмите по очереди: «📊 Данные» → «🔗 Какая таблица».", exp:"«🔗 Google-таблица события», ссылка «эту таблицу», строка «Задана при установке бота.» или «Задана здесь, в боте.», адрес, которому нужен доступ «Редактор». Кнопки «✏️ Указать другую таблицу» и «← Назад»."},
    {id:"12", who:"O", do:"Нажмите «✏️ Указать другую таблицу».", exp:"«Пришлите ссылку на Google-таблицу события…»"},
    {id:"12b", who:"O", do:"Пришлите слово «привет» (не ссылку).", exp:"«Не понял, что это за таблица. Пришлите ссылку из адресной строки браузера…»"},
    {id:"12c", who:"O", do:"Нажмите «Отмена».", exp:"Таблица осталась прежней. Ссылку на настоящую таблицу не присылайте: бот её переключит."},
    {id:"13", who:"D", do:"Одобренный делегат (/uat → «✅ Одобрен» → «Делегат — без ролей» → «✅ Сбросить и засеять») → «❓ Задать вопрос» → «Не нашёл ответ — спросить менеджера» → текст «Тестовый вопрос: во сколько сбор?».", exp:"«Твой вопрос отправлен!»"},
    {id:"14", who:"M", do:"Найдите «❓ Новый вопрос от …» и ответьте на него через «Ответить» «Сбор в 9:00 у главного входа». Сразу после этого ответьте тем же через «Ответить» ещё раз.", exp:"После первого ответа: «✅ Ответ отправлен пользователю.» Делегату пришло «💬 Ответ от организаторов:» и текст. На второй ответ: «✅ Ответ на этот вопрос уже отправлен — повторять не нужно.» (или «⏳ Ответ уже отправляется — дождитесь подтверждения, повторять не нужно.», если успели сразу). Делегат получил ответ один раз, не два."},
  ]},
  { key:"app1010", title:"Приложение: анкета после прокликивания 09–10.10", time:"20 мин", need:"делегат; приложение тестового бота включено. После проверки состояние с аккаунта снимите через /uat", steps:[
    {id:"1", who:"D", do:"Напишите боту /uat и нажмите по очереди: «🆕 Новичок — анкеты нет» → «Делегат — без ролей» → «✅ Сбросить и засеять», /start → «📱 Заполнить в приложении». На шаге согласия нажмите «Дальше» без галочки.", exp:"Над галочкой текст согласия, если менеджер его задал (с абзацами). Без галочки: «Чтобы продолжить, поставь галочку согласия.» (на «ты», а не «Нужно подтвердить согласия — вернитесь…»). С галочкой «Дальше» пускает."},
    {id:"2", who:"D", do:"На вопросе про город форума нажмите на город. Найдите кнопку, которая ведёт к следующему вопросу. На шаге телефона введите «abc».", exp:"Кнопка называется «Дальше» (скринридер читает её так же, а не текстом вопроса). На «abc»: «Укажи номер телефона цифрами, можно с плюсом впереди, например «+79161234567».» Про кнопку «Пропустить» в ошибке ничего нет."},
    {id:"3", who:"D", hand:true, do:"Дойдите до даты рождения (если она есть у выбранного города). Введите цифры «15032007» подряд, потом поправьте одну цифру в середине.", exp:"Поле обычное текстовое, а не календарь: точки ставятся сами, получается «15.03.2007». Курсор при правке в середине не прыгает в конец. Подсказка «ДД.ММ.ГГГГ» сходится с тем, что можно ввести."},
    {id:"4", who:"D", do:"Посмотрите подпись вопроса про ожидания над полем, в списке вопросов и в сводке.", exp:"«💬 Ожидания», без скобок «(общие)»."},
    {id:"5", who:"D", hand:true, do:"Дойдите до длинного вопроса про резюме.", exp:"Вопрос стоит под плитой обычным текстом с переносами строк, не гигантским курсивом. Нумерованный список «1. 2. 3.» не склеен в одну строку."},
    {id:"6", who:"D", do:"Резюме: «Загрузить файл», выберите файл .txt.", exp:"«Резюме принимается как PDF или DOCX — другой формат не подойдёт.»"},
    {id:"7", who:"D", do:"Нажмите «Написать текстом» (до загрузки файла или после неудачной загрузки), напишите пару предложений, «Дальше». На шагах впереди глядите на строку «Впереди ещё вопросов: N».", exp:"Ошибка «Файл резюме ещё не загрузился» после смены на текст исчезает. Строка «Впереди ещё вопросов: N» считает все оставшиеся вопросы до конца анкеты, а не только часть."},
    {id:"8", who:"D", do:"На сводке «Проверь перед отправкой» посмотрите строки, потом «Отправить заявку».", exp:"В сводке есть «Город форума: …». Резюме показано текстом. Заявка уходит: «Заявка принята», вверху экрана нет красной плашки ошибки прошлых шагов. В «📋 Заявки» у менеджера заявка с резюме текстом, без пустой второй заявки и без «Файл» без файла."},
    {id:"9", who:"D", do:"Резюме без чата с ботом: аккаунт, который ни разу не нажимал /start у бота (или заблокировал бота), открывает приложение по ссылке и пытается загрузить файл. Шаг только если такой аккаунт есть.", exp:"«Чтобы загрузить файл, открой чат с ботом и нажми /start — или напиши о себе текстом.» вместо общего «Не удалось загрузить файл». Если аккаунта нет, поставьте ⏭."},
    {id:"10", who:"D", do:"Напишите боту /uat и нажмите по очереди: «🆕 Новичок — анкеты нет» → «Делегат — без ролей» → «✅ Сбросить и засеять». Потом напишите /start.", exp:"Первым приходит выбор языка «Выберите язык анкеты / Choose the form language»."},
    {id:"10b", who:"D", do:"Нажмите «🇬🇧 English», потом кнопку открытия анкеты в приложении и дойдите до шага согласия.", exp:"Текст согласия по-английски (перевод, который задал менеджер). Если перевода нет — показан русский текст. Некому проверять — поставьте ⏭."},
  ]},
  { key:"pts1010", title:"Баллы вместо монет и слово по числу", time:"12 мин", need:"менеджер (суперадмин) + делегат; в конце баланс вернуть как был", steps:[
    {id:"1", who:"D", do:"Напишите боту /uat и нажмите по очереди: «✅ Одобрен» → «Делегат — без ролей» → «✅ Сбросить и засеять», /start. Посмотрите главное меню.", exp:"Кнопка называется «🪙 Мои баллы», не «🪙 Мои монеты». Если осталась старая клавиатура с прежней подписью, нажмите /start, чтобы обновить."},
    {id:"2", who:"M", do:"Начислите делегату по одному разу, глядя на каждый результат: «/coins @ник +1 тест», потом «/coins @ник +1 тест», потом «/coins @ник +3 тест», потом «/coins @ник +16 тест».", exp:"Делегату приходит уведомление, число и слово согласованы: «+1 балл», «+3 балла» (не «+1 баллов»)."},
    {id:"3", who:"D", do:"После каждого начисления нажимайте «🪙 Мои баллы».", exp:"Первая строка: «🪙 Баланс: 1 балл», затем «2 балла», «5 баллов», «21 балл». Ниже «Место в общем рейтинге: N из M». «📜 История» показывает строки начислений."},
    {id:"4", who:"D", do:"Нажмите по очереди: «🪙 Мои баллы» → «🏆 Рейтинг».", exp:"В тексте рейтинга слово «баллов» стоит в форме, подходящей к числу; слов «монет» и «коинов» нет."},
    {id:"5", who:"D", do:"Откройте приложение («📱 Приложение») → раздел с баллами и рейтинг.", exp:"На плите баланса слово согласуется с числом: «1 балл», «2 балла», «5 баллов», в рейтинге «… баллов до N-го места». Слов «монеты» и «коины» нет."},
    {id:"8", who:"M", do:"Начислите делегату баллы четыре раза подряд, по одному: /coins @ник +1 тест, ещё раз +1 тест, потом +3 тест, потом +16 тест. Если вы уже делали это выше, повторять не нужно.", exp:"После каждой команды делегату приходит уведомление. Всего четыре начисления."},
    {id:"8b", who:"D", do:"Откройте приложение и посмотрите на главном экране строку «Баллы» в списке разделов.", exp:"Справа подпись «4 операции» (а не «4 операций»)."},
    {id:"6", who:"M", do:"Просмотрите экраны «🎮 Геймификация», «🎯 Задания» и дашборд (кнопка «🌐 Открыть дашборд» под /stats).", exp:"Везде «баллы», нигде «монеты» или «коины». Слова, которые менеджер сам написал в своих текстах, не считаются."},
    {id:"7", who:"M", do:"Верните баланс: «/coins @ник -21 тест».", exp:"Баланс делегата снова как до проверки."},
    {id:"9", who:"D", do:"Откройте главный экран приложения снова.", exp:"Теперь после возврата баланса у строки «Баллы» подпись «5 операций». После одной операции было бы «1 операция»."},
  ]},
  { key:"wiz1010", title:"Мастер «🚀 Первая настройка»", time:"10 мин", need:"владелец с полным доступом (его выдаёт только Андрей)", steps:[
    {id:"1", who:"O", do:"Нажмите по очереди: «🔧 Управление» → «🚀 Первая настройка».", exp:"Заголовок «🚀 Первая настройка», строка «N из M готово» и список шагов. У каждого шага значок: ✅ готово, ⬜ ещё нет, ℹ️ подсказка без полей. Среди шагов «🎭 Тип события», «🤖 Имя и описание бота», «🎪 Информация о событии», «📞 Контакты оргкомитета», «💬 Приветствие», «📋 Главное меню»."},
    {id:"2", who:"O", do:"Нажмите на шаг «🎪 Информация о событии».", exp:"Вверху «Шаг N из M» и название шага, ниже пояснение и список полей вида «• 🗓 Дата — не задано». Под ним кнопки полей с ⬜ или ✅. Внизу кнопки «← Назад», «Дальше →» и «📋 Все шаги»."},
    {id:"3", who:"O", do:"Нажмите кнопку поля «📍 Место» (с ⬜ или ✅) и пришлите «Тестовая площадка».", exp:"Открывается обычный экран правки поля, бот принимает значение. После сохранения вы снова в том же шаге мастера, а у «📍 Место» стоит ✅ и «задано»."},
    {id:"4", who:"O", do:"Нажмите «📋 Все шаги» и откройте шаг «📋 Главное меню».", exp:"Список кнопок меню со словами «задано» или «не задано» и кнопка «🔘 Кнопки меню»."},
    {id:"5", who:"O", do:"Нажмите «🔘 Кнопки меню», потом «← Назад».", exp:"Открывается обычный экран «🔘 Кнопки меню». По «← Назад» вы возвращаетесь в шаг мастера «📋 Главное меню», а не в общий список /admin."},
    {id:"6", who:"O", do:"Откройте шаг «🎨 Оформление приложения». Если такого шага в списке нет, поставьте ⏭.", exp:"Поля подписаны «(в приложении)», внизу подсказка «Это поле настраивается в приложении: «Настройки» → поиск по названию.»"},
    {id:"7", who:"O", do:"Нажмите «Дальше →» до конца списка шагов и вернитесь в «📋 Все шаги».", exp:"Последний шаг без кнопки «Дальше →». В списке «N из M готово» выросло на число шагов, которые вы закрыли."},
  ]},
  { key:"info1010", title:"«ℹ️ Информация о форуме» у делегата", time:"8 мин", need:"менеджер + делегат", steps:[
    {id:"1", who:"M", do:"В самом верху /admin выберите город делегата и нажмите «🎪 Событие». Посмотрите поля «🗓 Дата», «⌚ Время», «📍 Место» и «🗓 Дата начала форума». Запишите в 💬, что в них стоит сейчас.", exp:"Поля видны. Прежние значения записаны: в конце вы их вернёте."},
    {id:"1b", who:"M", do:"Очистите «🗓 Дата», «⌚ Время» и «📍 Место»: в каждое пришлите «-». В «🗓 Дата начала форума» пришлите дату форума, например 10.10.2026.", exp:"Каждое поле подтверждает новое значение."},
    {id:"2", who:"D", do:"Нажмите «ℹ️ Информация о форуме».", exp:"Заголовок «Информация о мероприятии» и строка «🗓 Дата: 10.10.2026». Надписи «Информация о мероприятии пока заполняется» нет. Под текстом кнопки «Дата и время» и «Место проведения»."},
    {id:"3", who:"M", do:"В «🎪 Событие» нажмите «⌚ Время» и пришлите «10:00».", exp:"Бот подтверждает новое значение."},
    {id:"3b", who:"M", do:"Нажмите «📍 Место» и пришлите «Тестовая площадка».", exp:"Бот подтверждает новое значение."},
    {id:"4", who:"D", do:"Снова нажмите «ℹ️ Информация о форуме».", exp:"Строки «🗓 Дата: …», «⌚ Время: 10:00» и «📍 Место: Тестовая площадка». Если в боте включены города, добавляется «🏙 Город: …»."},
    {id:"5", who:"M", do:"Верните прежние значения полей «🗓 Дата», «⌚ Время», «📍 Место» и «🗓 Дата начала форума», которые вы записали в первом шаге.", exp:"Поля такие же, как до проверки."},
  ]},
  { key:"uni1010", title:"Вуз в Анкете 2.0: поиск по общей базе", time:"10 мин", need:"владелец + делегат (новый аккаунт)", steps:[
    {id:"1", who:"O", do:"Нажмите «📝 Анкета». Если кнопка «🆕 Новая анкета» показывает «Старая анкета → Новая анкета», нажмите её. Запишите в 💬, как было.", exp:"Новая анкета включена: кнопка теперь предлагает вернуться на «Старая анкета»."},
    {id:"2", who:"O", do:"В том же разделе «📝 Анкета» найдите место, где раньше была кнопка «🏫 ВУЗ: …».", exp:"Вместо кнопки серая строка «🏫 В Анкете 2.0 вуз ищется по общей базе вузов». Нажатие на неё ничего не меняет."},
    {id:"3", who:"O", do:"Откройте группу настроек «📝 Регистрация» в разделе «📝 Анкета» и поищите «🏫 Список ВУЗов».", exp:"Кнопки «🏫 Список ВУЗов» нет, вместо неё та же серая строка «🏫 В Анкете 2.0 вуз ищется по общей базе вузов»."},
    {id:"4", who:"D", do:"Напишите боту /uat и нажмите по очереди: «🆕 Новичок — анкеты нет» → «Делегат — без ролей» → «✅ Сбросить и засеять». Потом напишите /start.", exp:"Бот отвечает «✅ Готово.» и после /start начинает анкету."},
    {id:"4b", who:"D", do:"Заполняйте анкету до вопроса про вуз.", exp:"Под вопросом подсказка «Начни вводить название — подскажем. Подойдёт и сокращение.» Если подсказки нет, напишите об этом в заметке."},
    {id:"5", who:"D", do:"Напишите первые буквы вуза, например «политех».", exp:"Бот пишет «Нашли — выбери:» и показывает кнопки с подходящими вузами."},

    else if (ch === "»" && depth > 0) { depth--; if (depth === 0) { out += '<q class="ui">' + esc(buf) + "</q>"; buf = ""; } else buf += ch; }

};

    + (sec.opt ? '<span class="opt">если останется время</span>' : "");
  const tags = sec.sessions.map(tagHtml).join("");
  let body = "";
  if (sec.merged) {
    body = sec.sources.map(src => `<ol class="steps"><li class="subh" data-src="${esc(src.src)}"><b>${esc(src.title)}</b> ${tagHtml(src.sess)}<span class="sm">⏱ ${esc(src.time)}${src.need ? " · 👥 " + esc(src.need) : ""}</span></li>${src.steps.map(st => stepHtml(st, false)).join("")}</ol>`).join("");
  } else {
    body = `<ol class="steps">${sec.steps.map(st => stepHtml(st, false)).join("")}</ol>`;
  }
  return `<details class="sec" id="sec-${esc(sec.id)}" data-sec="${esc(sec.id)}">
  <summary><div class="bh"><span class="bn">${sec.n}</span><h2>${esc(sec.title)}</h2><span class="cnt" id="cnt-${esc(sec.id)}"></span><span class="chev" aria-hidden="true">▸</span></div>
  <div class="bmeta">${tags}${meta}</div></summary>
  ${sec.note ? `<p class="bnote">${quoteUi(sec.note)}</p>` : ""}
  ${body}
  ${sec.sources ? `<details class="reg" id="reg-${esc(sec.id)}" hidden><summary>🤖 Уже проверено — можно пропустить (<span id="regn-${esc(sec.id)}">0</span>)</summary><ol class="steps" id="regol-${esc(sec.id)}"></ol></details>` : ""}
  </details>`;
}
function reSectionHtml(list){

}

/* Раскрыт первый раздел вкладки, где ещё остались неотмеченные шаги; остальные свёрнуты — это оглавление. */
function autoOpen(){

  const first = Array.from(root.querySelectorAll("#secs > details.sec")).find(d => !d.hidden &&
    d.querySelector("li.step:not([hidden]):not(.cue):not([data-reg='1']):not([data-s='ok']):not([data-s='bad']):not([data-s='skip'])"));
  if (first) first.open = true;
  $("sec-top").open = true;
}
function mkNode(li){
  const st = findStep(li.dataset.key);
  li._idx = st.idx;
  return { li, st, home: li.parentElement, sw: li.querySelector(".syncw"), ss: li.querySelector(".syncs"), tg: li.querySelector(".tog"), ag: li.querySelector(".agent"), note: li.querySelector(".note"), by: li.querySelector(".by"), nb: li.querySelector(".nb"), btns: li.querySelectorAll(".mk[data-m]:not(.nb)") };
}
function findStep(key){ return STEP_INDEX[key] || (page && page.reList || []).find(x => x.key === key) || { key, num: key, who: "A", do: key, exp: "" }; }

function renderRe(){
  const list = reSteps();
  const sig = list.map(x => x.key).join("|");
  if (sig === page.reSig) return;
  const old = $("sec-debt-" + RE_KEY);
  const wasOpen = old ? old.open : false;
  page.reSig = sig; page.reList = list;
  list.forEach((x, i) => { x.idx = 100000 + i; });
  for (const k of Object.keys(page.nodes)) if (k.startsWith("s3." + RE_KEY + ".")) delete page.nodes[k];
  $("rebox").innerHTML = reSectionHtml(list);
  const d = $("sec-debt-" + RE_KEY);
  d.open = wasOpen;
  for (const li of $("rebox").querySelectorAll("li.step")) page.nodes[li.dataset.key] = mkNode(li);
  applyFilter();
}

/* ───────── отметки ───────── */
function push(key, s, note){
  const body = { key, s: s || "", note: note || "", who: (local._who || "").trim() };
  setSync("Сохраняю…", "");
  api("/api/step", body).then(st => { state = st; paint(); setSync("Общая доска · сохранено " + hhmm(), "ok"); })
    .catch(e => { if (e.message !== "no_access") { setSync("Нет связи: отметка не сохранилась, нажмите ещё раз", "bad"); toast("Не сохранилось: нет связи"); } });
}
const timers = {};
root.addEventListener("click", e => {
  const box = e.target.closest(".box");
  if (box) { togglePre(box.closest("li")); return; }
  const b = e.target.closest(".mk"); if (!b) return;

/* Шаги, попавшие под фильтр сессии. */
const inSess = (st, f) => !f.sess || st.sess === f.sess;
/* Шаг с отметкой агента (кроме «только руками») уходит в «Уже проверено» в конце своего раздела;
   то, что в боте ни разу не проверяли, поднимается в «Сначала это». Узлы переносятся, а не
   пересоздаются: заметки и отметки людей целы. */
function placeLi(li, ol){
  const next = Array.from(ol.children).find(c => c._idx > li._idx);
  ol.insertBefore(li, next || null);
}
function placeSteps(){
  const topOl = $("topol");
  for (const sec of SECTIONS) {
    const ol = $("regol-" + sec.id); if (!ol) continue;
    for (const st of sec.steps) {
      const nd = page.nodes[st.key]; if (!nd) continue;
      const reg = verified(st);
      const top = !reg && isTop(st);
      const target = reg ? ol : top ? topOl : nd.home;
      nd.li.dataset.reg = reg ? "1" : "";
      if (nd.li.parentElement !== target && document.activeElement !== nd.note) placeLi(nd.li, target);
    }
  }
}
/* Шаги, которые людям ещё надо пройти на вкладке (без «уже проверено»). */
function humanSteps(tab, f, re){
  return ALL_STEPS.concat(re).filter(st => st.tab === tab && inSess(st, f) && !verified(st));
}
/* Точки ожидания: в одном разделе соседние шаги разных людей идут друг за другом, значит первый
   пишет второму «готово», а второй ждёт. Шаги «уже проверено» не считаются. */
function computeSync(){
  const map = {};
  for (const sec of SECTIONS) for (const src of sec.sources) {
    const seq = src.steps.filter(st => !verified(st));
    seq.forEach((st, i) => {
      const p = seq[i - 1], nx = seq[i + 1];
      map[st.key] = { w: p && p.tab !== st.tab ? p.tab : "", s: nx && nx.tab !== st.tab ? nx.tab : "" };
    });
  }
  return map;
}
const waitTxt = t => t === "O" ? "⏸ Подождите, пока Андрей напишет «готово». Андрея нет на связи: поставьте ⏭ и идите дальше." : "⏸ Подождите, пока " + TABS[t].person + " напишет «готово»";
const sayTxt = t => "📣 Когда сделаете, напишите " + TABS[t].dat + " «готово»";
function paint(){
  if (!page) return;
  renderRe();
  placeSteps();
  const sync = computeSync();
  const f = page.f;
  for (const key of Object.keys(page.nodes)) {
    const nd = page.nodes[key]; const c = cur(key); const v = (c && c.s) || "";
    nd.li.dataset.s = v;
    nd.btns.forEach(b => b.setAttribute("aria-pressed", b.dataset.m === v ? "true" : "false"));
    const note = (c && c.note) || "";
    if (document.activeElement !== nd.note) { nd.note.value = note; if (note || v === "bad") nd.note.hidden = false; }
    nd.nb.classList.toggle("has", !!note.trim());
    const by = c ? [c.who, c.at && c.at !== "…" ? c.at + " МСК" : ""].filter(Boolean).join(" · ") : "";
    nd.by.textContent = by ? (v === "ok" ? "✅ " : v === "bad" ? "❌ " : v === "skip" ? "⏭ " : "💬 ") + by : "";
    nd.by.hidden = !by;
    const sy = sync[key] || { w: "", s: "" };
    if (nd.sw) { nd.sw.hidden = !sy.w; nd.sw.textContent = sy.w ? waitTxt(sy.w) : ""; }
    if (nd.ss) { nd.ss.hidden = !sy.s; nd.ss.textContent = sy.s ? sayTxt(sy.s) : ""; }
    if (nd.tg) nd.tg.hidden = !(sy.w || sy.s || nd.st.pair);
    const a = agentOf(key);
    if (nd.ag) {
      nd.ag.hidden = !a;
      if (a) nd.ag.innerHTML = "🤖 " + esc(a.at || "") + " · " + esc(a.c || "") + (a.note ? ' <span class="an">· ' + esc(a.note) + "</span>" : "") + (nd.st.hand ? ' <span class="an">· людям всё равно пройти руками</span>' : "");
    }
  }
  for (const key of Object.keys(page.preNodes)) {
    const li = page.preNodes[key]; const c = cur(key); const v = (c && c.s) || "";
    li.dataset.s = v; li.querySelector(".box").setAttribute("aria-checked", v === "ok" ? "true" : "false");
  }
  const cntEl = (el, c) => { if (!el) return; el.textContent = c.total ? c.done + " / " + c.total + (c.bad ? " · ❌ " + c.bad : "") : ""; el.className = "cnt" + (c.bad ? " has-bad" : c.total && c.done === c.total ? " all" : ""); };
  const re = page.reList || [];
  for (const k of Object.keys(TABS)) {
    const c = counts(humanSteps(k, f, re));
    $("tc-" + k).textContent = c.total ? c.done + " из " + c.total : "—";
    document.querySelector(`.tab[data-tab="${k}"]`).setAttribute("aria-pressed", String(f.tab === k));
  }
  const mine = f.tab ? humanSteps(f.tab, f, re) : [];
  for (const sec of SECTIONS) cntEl($("cnt-" + sec.id), counts(sec.steps.filter(x => x.tab === f.tab && inSess(x, f) && !verified(x))));
  cntEl($("cnt-debt-" + RE_KEY), counts(re.filter(x => x.tab === f.tab && inSess(x, f))));
  cntEl($("cnt-top"), counts(ALL_STEPS.filter(x => x.tab === f.tab && inSess(x, f) && !verified(x) && isTop(x))));
  const c = counts(mine);
  if (!f.tab) {
    $("ptext").innerHTML = "Выберите вкладку: <b>Делегат</b>, <b>Менеджер</b> или <b>Владелец</b>";
    $("pright").textContent = "";
    $("ptrack").innerHTML = trackHtml({ ok: 0, bad: 0, skip: 0, total: 1 });
    $("tabnote").textContent = "";
  } else {
    const leftMin = Math.ceil(mine.filter(x => !marked(x)).reduce((a, x) => a + (x.min || 1), 0));
    $("ptext").innerHTML = `Пройдено <b>${c.done}</b> из ${c.total}` + (c.total > c.done ? ` · осталось ~${leftMin} мин` : " · всё пройдено") + (c.bad ? ` · <b class="e">❌ ${c.bad}</b>` : "");
    const pre = f.sess ? counts(S[f.sess].pre) : null;
    $("pright").textContent = pre && pre.total ? `подготовка ${pre.ok}/${pre.total}` : (f.sess ? SESS_TAG[f.sess] : "");
    $("ptrack").innerHTML = trackHtml(c);
    $("tabnote").innerHTML = "<b>" + esc(TABS[f.tab].title) + ".</b> " + esc(TABS[f.tab].note);
  }
  applyFilter();
}
function applyFilter(){
  if (!page) return;
  const f = page.f; let shown = 0;
  document.querySelectorAll("#filters .chip").forEach(b => b.setAttribute("aria-pressed", String((f[b.dataset.f] || "") === b.dataset.v)));
  $("pick").hidden = !!f.tab;
  for (const key of Object.keys(page.nodes)) {
    const nd = page.nodes[key]; const v = nd.li.dataset.s || "";
    const okSess = !f.sess || nd.li.dataset.sess === f.sess;
    const okTab = !!f.tab && nd.li.dataset.tab === f.tab;
    const okStat = !f.stat || (f.stat === "todo" ? !v : v === f.stat);
    const cue = !!f.tab && f.cues === "1" && !okTab && okSess && nd.li.dataset.reg !== "1" && !nd.li.closest("#topol") && !nd.li.closest("#rebox");
    nd.li.classList.toggle("cue", cue);
    nd.li.hidden = !((okTab && okSess && okStat) || cue);
    if (!nd.li.hidden && !cue) shown++;
  }
  const real = "li.step:not([hidden]):not(.cue)";
  for (const sub of root.querySelectorAll("li.subh")) sub.hidden = sub.parentElement.querySelectorAll(real).length === 0;
  for (const sec of root.querySelectorAll("details.sec")) {
    const steps = sec.querySelectorAll("li.step"); const vis = sec.querySelectorAll(real);
    sec.hidden = (steps.length > 0 || sec.id === 'sec-top' || sec.id === 'sec-debt-re') && vis.length === 0;
    const rg = sec.querySelector("details.reg");
    if (rg) {
      const n = rg.querySelectorAll(real).length;
      rg.hidden = n === 0;
      const sp = rg.querySelector("span[id^='regn-']"); if (sp) sp.textContent = n;
    }
  }
  $("empty").hidden = shown > 0 || !f.tab;
}

/* ───────── маршрут ───────── */
/* #s1 / #s2 / #s3 / #bl — включить фильтр сессии (так ссылки старой доски остаются рабочими);
   #blk-… / #sec-… — прокрутить к разделу. */
function route(){
  if (!page) renderBoard();
  const h = location.hash.replace("#", "");
  if (S[h]) { page.f.sess = h; local._f = page.f; save(); applyFilter(); paint(); autoOpen(); window.scrollTo(0, Math.max(0, $("bar").getBoundingClientRect().top + window.scrollY - 4)); return; }
  const el = h ? document.getElementById(h) : null;
  if (el) { if (el.tagName === "DETAILS") el.open = true; el.scrollIntoView(); }
  paint();
  if (!page.opened) { page.opened = true; autoOpen(); }
}
window.addEventListener("hashchange", route);

const who = $("who");
who.value = local._who || "";
who.addEventListener("input", () => { local._who = who.value; save(); });

let firstPull = true;
async function pull(){
  try {
    const st = await api("/api/state");
    if (st.v !== state.v) { state = st; paint(); }
    if (firstPull) { firstPull = false; if (!location.hash) autoOpen(); }
    setSync("Общая доска · обновлено " + hhmm(), "ok");
  } catch (e) { if (e.message !== "no_access") setSync("Нет связи с доской, показываю последнее известное", "bad"); }
}
route();
pull();
setInterval(pull, 5000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) pull(); });

/* ───────── отчёт ───────── */
const LABEL = { ok: "✅ ок", bad: "❌ не так", skip: "⏭ пропуск" };
function buildReport(){
  const f = page ? page.f : { sess: "", tab: "" };
  const head = ["ПРИЁМКА ЮЛИД '26 · тестовый бот @YouLead_test_bot · общая доска uat.alekseev.info",
    "Отчёт собран: " + new Date().toLocaleString("ru-RU") + (local._who ? " · " + local._who : "")];
  const lines = [];
  const re = (page && page.reList) || [];
  const tabs = f.tab ? [f.tab] : Object.keys(TABS);
  for (const tab of tabs) {
    const mine = humanSteps(tab, f, re);
    const c = counts(mine);
    lines.push("\nВКЛАДКА «" + TABS[tab].name.toUpperCase() + "»" + (f.sess ? " · " + SESS_TAG[f.sess] : "") + " (пройдено " + c.done + " из " + c.total + ", ❌ " + c.bad + ", ⏭ " + c.skip + ")");
    const secs = SECTIONS.map(sec => ({ n: sec.n, title: sec.title, steps: sec.steps }));
    secs.push({ n: SECTIONS.length + 1, title: "Повторная проверка", steps: re });
    for (const sec of secs) {
      const steps = sec.steps.filter(st => st.tab === tab && inSess(st, f) && !verified(st));
      if (!steps.length) continue;
      lines.push("Раздел " + sec.n + ". " + sec.title);
      for (const st of steps) {
        const c2 = cur(st.key);
        const mark = c2 && c2.s ? "[" + LABEL[c2.s] + "]" : "[не сделано]";
        const by = c2 && c2.who ? " · " + c2.who : "";
        lines.push("  " + st.num + " " + mark + " " + st.do + by);
        const nn = c2 && (c2.note || "").trim();
        if (nn) lines.push("      заметка: " + nn.replace(/\n/g, "\n      "));
      }
    }
  }
  return head.concat(lines).join("\n");
}
const report = $("report"), reportText = $("reportText");
$("copy").addEventListener("click", async () => {
  const text = buildReport();
  reportText.value = text; report.hidden = false;
  const hint = $("reportHint");
  try { await navigator.clipboard.writeText(text); hint.innerHTML = "<b>Скопировано.</b> Вставьте в чат Андрею. Если не вставляется, выделите текст ниже и копируйте вручную."; }
  catch (_) { hint.textContent = "Выделите текст ниже, зажмите и «Копировать», потом вставьте в чат."; }
  reportText.focus(); reportText.select();
});
$("reportClose").addEventListener("click", () => { report.hidden = true; });
</script>
