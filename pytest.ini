[pytest]
testpaths = tests
# Тесты вызывают asyncio.run() сами; плагин pytest-asyncio не используется.
# Каждый тест держит свою копию шаблонной БД (~3,4 МБ); при политике по умолчанию (all)
# один полный прогон -n 6 оставлял в %TEMP%\pytest-of-* ~23 ГБ и ронял следующий прогон
# на «No space left on device». Каталог успешного теста удаляется сразу.
tmp_path_retention_policy = failed
