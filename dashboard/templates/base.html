<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}{{ event_name or "Дашборд статистики" }}{% endblock %}</title>
  <link rel="icon" href="/static/brand/aiesec-human-blue.svg" type="image/svg+xml">
  {# Шрифты бренда (BlueBook: Lato + Raleway) — Google Fonts, display=swap: до загрузки

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Raleway:wght@700;800&display=swap">
  <link rel="stylesheet" href="/static/tokens.css">

<body>
