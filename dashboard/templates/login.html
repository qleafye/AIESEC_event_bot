<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — дашборд статистики</title>
</head>
<body>
  <p>Вход для организаторов по Telegram.</p>
  {% if public_url and bot_username %}
  <script async src="https://telegram.org/js/telegram-widget.js?22"
    data-telegram-login="{{ bot_username }}"
    data-size="large"
    data-auth-url="{{ public_url }}/auth/callback"
    data-request-access="write"></script>
  {% else %}
  <p>Вход временно недоступен — не задан адрес дашборда или бот.</p>
  {% endif %}
</body>
</html>
